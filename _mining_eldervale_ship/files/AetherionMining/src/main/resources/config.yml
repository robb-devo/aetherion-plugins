  ignore-air: true
  auto-paste-once: false
  paste:
    x: 22
    y: 90
    z: 580


# =====================================================================
# Mining Eldervale: the mining destination (package de.aetherion.mining.isle)
# Every coordinate below was measured from Mining-Eldervale-Island.schem
# pasted at eldervale.paste (22 90 580, WE/FAWE offset -190 -181 -227):
#   world = paste + offset + schem-local  →  x -168..227, y -91..240, z 353..763
#   the island itself spans x -98..192, y -49..185, z 417..703 (surface ≈ Y 89).
# Re-paste somewhere else? Shift every x/y/z by the same delta (or /mineisle dev landing:set,
# NPC anchors and prop:<piece> to move things by hand).
# =====================================================================
mine-isle:
  enabled: true
  # Isle blocks in one day that log a shift (streak: +1 ore Fortune per consecutive day, max 7).
  shift-blocks: 250
  landing:
    world: world
    x: 53.5
    y: 90.0
    z: 486.5
    yaw: 0
  # Depth bands under the isle (surface ≈ 89, deepest rock ≈ -49).
  depth:
    galleries-below-y: 82
    deep-works-below-y: 56
    undercroft-below-y: 26

mine-isle-footprint:
  enabled: true
  world: world
  min-x: -104
  max-x: 198
  min-z: 410
  max-z: 710
  min-y: -64
  max-y: 200

