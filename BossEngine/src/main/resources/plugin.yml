name: BossEngine
version: 1.0.0
main: de.aetherion.bossengine.BossEngine
api-version: 1.21
author: Aetherion
description: Modular custom-mob and boss engine for Aetherion

depend:
  - AetherionCore

# Multiverse loads worlds at enable-time. Without this, MV can load world_eater
# before BossEngine registers BossEngine:worldeater and new chunks become vanilla.
loadbefore:
  - Multiverse-Core

softdepend:
  - AetherionItems
  - AetherionDungeons
  - AetherMobs
  - AetherionQuests
  - WorldGuard
  - WorldGuardExtraFlagsPlus
  - DeluxeHub
  - MythicMobs
  - Multiverse-Core

commands:
  boss:
    description: BossEngine admin command
    usage: /boss <spawn|kill|list|reload|give|info|stage|worldeater>
    permission: bossengine.admin
    aliases:
      - bossengine
      - be

  helios:
    description: Helios Requiem (enter / leave; admin tools with helios.admin)
    usage: /helios <enter|leave>
    aliases:
      - requiem

  hush:
    description: The Hush (enter / leave; admin tools with hush.admin)
    usage: /hush <enter|leave>
    aliases:
      - stille

permissions:
  hush.enter:
    description: May open The Hush with /hush enter or at an entry bell (see hush.yml entry.permission)
    default: op
  hush.admin:
    description: The Hush admin tools (start, abort, status, skip, solve, move, lamps, dread, reload)
    default: op
  hush.bypass:
    description: Exempt from The Hush movement rules (pearls, flight, block edits)
    default: op
  helios.admin:
    description: Helios Requiem admin tools (start, debug, skip, hp, attack, abort, restore)
    default: op
  helios.bypass:
    description: Exempt from Helios movement rules (pearls, flight, block edits)
    default: op
  bossengine.admin:
    description: Full BossEngine admin access
    default: op
  bossengine.spawn:
    description: Spawn bosses via command or spawn item
    default: op
