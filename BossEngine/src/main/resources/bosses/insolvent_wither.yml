  - type: SPECTACLE
    trigger: ON_SPAWN
    title: "&8INSOLVENT WITHER"
    subtitle: "&7The auction house sent fake flowers."
    lightning: 8
    particle: SMOKE
    count: 80
    radius: 12
    sound: ENTITY_WITHER_AMBIENT

  - type: DIALOG
    trigger: ON_SPAWN
    broadcast: true
    message: "&8&lThe Insolvent Wither &7arrives. The auction house sent flowers. Fake ones."

  - type: PARTICLE_AURA
    trigger: ON_TIMER
    interval-ticks: 7
    particle: SMOKE
    count: 22
    radius: 1.6
