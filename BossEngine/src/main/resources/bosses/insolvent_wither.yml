# ============================================================
# The Insolvent Wither – T3–T4 world boss (REV5 curve)
# Intended: Combat T3–T4 party. Slightly higher HP pool kept.
# Lost the auction. Kept the attitude. Rich players get audited.
# ============================================================

id: insolvent_wither
display-name: "&8&lThe Insolvent Wither"
entity-type: WITHER
model-engine-id: ""

attributes:
  max-health: 145000
  movement-speed: 0.38
  attack-damage: 168
  scale: 1.35
  follow-range: 40
  knockback-resistance: 1.0

