# ============================================================
# Baron von Wurm – T3–T4 world boss (REV5 curve)
# Intended: Combat T3–T4 / mining-aware party. HP kept.
# Came for the guild picks. Stayed for the raid.
# Mining skills equipped? He notices. +30% damage.
# ============================================================

id: baron_von_wurm
display-name: "&8&lBaron von Wurm"
entity-type: SILVERFISH
model-engine-id: ""

attributes:
  max-health: 128000
  movement-speed: 0.38
  attack-damage: 160
  scale: 3.8
  follow-range: 44
  knockback-resistance: 0.8

equipment:
  helmet: AIR
  chestplate: AIR
  leggings: AIR
  boots: AIR
  main-hand: AIR
  off-hand: AIR
  drop-chance: 0.0

options:
  glowing: false
  custom-name-visible: true
  silent: false
  invulnerable-spawn-ticks: 30
  persistent: true
  remove-when-far-away: false
  prevent-item-pickup: true

conditions:
  max-instances: 1
  leash-radius: 52
  leash-action: TELEPORT

phases:
  - id: nibble
    health-percent: 100
    display-name: "&8&lBaron von Wurm"
    skills:
      - type: BURROW_STRIKE
        trigger: ON_TIMER
        interval-ticks: 95
        hide-ticks: 40
        launch-power: 86
      - type: RING_BURST
        trigger: ON_TIMER
        interval-ticks: 140
        waves: 4
        step: 3.2
        damage: 58
        particle: CRIT

  - id: quarry
    health-percent: 60
    display-name: "&8&lBaron von Wurm &7(&6Hunger&7)"
    transition:
      duration-ticks: 75
      invulnerable: true
      freeze-ai: true
      particle: CRIT
      points: 64
      explode: false
    attributes:
      movement-speed: 0.42
      attack-damage: 184
      scale: 4.2
    skills:
      - type: DIALOG
        trigger: ON_PHASE
        broadcast: true
        message: "&8&lBaron von Wurm&7: &6Those picks were an appetizer."
      - type: SPECTACLE
        trigger: ON_PHASE
        title: "&8THE QUARRY BITES"
        subtitle: "&7Move, or become a claim."
        lightning: 6
        particle: CRIT
        count: 80
        radius: 12
        sound: ENTITY_WARDEN_DIG
      - type: BURROW_STRIKE
        trigger: ON_TIMER
        interval-ticks: 110
        hide-ticks: 40
        launch-power: 98
      - type: RING_BURST
        trigger: ON_TIMER
        interval-ticks: 100
        waves: 5
        step: 3.0
        damage: 72
        particle: CRIT
      - type: METEOR_RAIN
        trigger: ON_TIMER
        interval-ticks: 130
        amount: 6
        damage: 70
        scatter: 10
        style: BURST
      - type: MINION_SPAWN
        trigger: ON_PHASE
        entity-type: SILVERFISH
        amount: 8
        health: 420
        damage: 36
        scale: 1.6
        lifespan-ticks: 520
        custom-name: "&7Quarry Mite"

  - id: feeding
    health-percent: 28
    display-name: "&8&lBaron von Wurm &7(&4Feeding&7)"
    transition:
      duration-ticks: 85
      invulnerable: true
      freeze-ai: true
      shape: SPHERE
      particle: CRIT
      explode: true
      explode-damage: 44
      explode-radius: 7.5
    attributes:
      movement-speed: 0.48
      attack-damage: 210
      scale: 4.6
    skills:
      - type: DIALOG
        trigger: ON_PHASE
        broadcast: true
        message: "&8&lBaron von Wurm&7: &4The settlement is you."
      - type: SPECTACLE
        trigger: ON_PHASE
        title: "&4FEEDING"
        subtitle: "&7Insurance already said no."
        lightning: 9
        particle: SMOKE
        count: 70
        radius: 13
        sound: ENTITY_WARDEN_EMERGE
      - type: BURROW_STRIKE
        trigger: ON_TIMER
        interval-ticks: 130
        hide-ticks: 40
        launch-power: 112
      - type: RING_BURST
        trigger: ON_TIMER
        interval-ticks: 95
        waves: 5
        step: 2.9
        damage: 86
        particle: CRIT
      - type: METEOR_RAIN
        trigger: ON_TIMER
        interval-ticks: 100
        amount: 7
        damage: 80
        scatter: 12
        style: BURST
      - type: MINION_SPAWN
        trigger: ON_TIMER
        interval-ticks: 140
        entity-type: SILVERFISH
        amount: 7
        health: 460
        damage: 40
        scale: 1.8
        lifespan-ticks: 420
        custom-name: "&8Claim Denied"
      - type: SLAM_LEAP
        trigger: ON_TIMER
        interval-ticks: 100
        upward: 1.2
        range: 18
        slam-radius: 5.2
        slam-damage: 90

skills:
  - type: SOUND
    trigger: ON_SPAWN
    sound: ENTITY_SILVERFISH_AMBIENT
    volume: 1.7
    pitch: 0.3

  - type: SPECTACLE
    trigger: ON_SPAWN
    title: "&8BARON VON WURM"
    subtitle: "&7The quarry is closed."
    lightning: 5
    particle: CRIT
    count: 60
    radius: 10
    sound: ENTITY_WARDEN_DIG

  - type: DIALOG
    trigger: ON_SPAWN
    broadcast: true
    message: "&8&lBaron von Wurm &7surfaces. The quarry is closed."

  - type: PARTICLE_AURA
    trigger: ON_TIMER
    interval-ticks: 7
    particle: MYCELIUM
    count: 22
    radius: 1.2
    extra: 0.02

  - type: DIALOG
    trigger: ON_DEATH
    broadcast: true
    message: "&8&lBaron von Wurm &7folds. Return the picks. Slowly."

loot:
  damage-based: true
  participation-threshold-percent: 5.0
  experience: 55000
  killer-bonus:
    - source: AETHERION
      item-id: pickaxe_core_of_the_burrower
      amount: 1
      chance: 0.34
    - source: AETHERION
      item-id: random_booster
      amount: 1
      chance: 1.0
  rank-loot:
    1:
      - source: AETHERION
        item-id: pickaxe_core_of_the_burrower
        amount: 1
        chance: 0.18
  top-damagers:
    count: 3
    items:
      - source: AETHERION
        item-id: random_booster
        amount: 1
        chance: 1.0
  shared:
    - source: VANILLA
      material: IRON_PICKAXE
      amount: 1
      chance: 0.4
  per-damager:
    - source: VANILLA
      material: EXPERIENCE_BOTTLE
      min-amount: 10
      max-amount: 18
      chance: 1.0
      scale-with-damage: true
