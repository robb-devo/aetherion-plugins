      duration-ticks: 80
      invulnerable: true
      freeze-ai: true
      shape: FIRE_SPIRAL
      particle: FLAME
      extra-particle: SOUL_FIRE_FLAME
      explode: false
    attributes:
      attack-damage: 220
      movement-speed: 0.48
    skills:
      - type: DIALOG
        trigger: ON_PHASE
        broadcast: true
        message: "&5&lAetherion&7: &6This chamber is not the sky. Try anyway."
      - type: DRAGON_FIREBALL
        trigger: ON_TIMER
        interval-ticks: 40
        speed: 1.26
        damage: 195
        spread: 0.06

  - id: tempest
    health-percent: 50
    display-name: "&5&l✦✦✦ Aetherion &7(&bTempest&7)"
    transition:
      duration-ticks: 90
      invulnerable: true
