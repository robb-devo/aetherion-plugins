# ============================================================
# Aetherion, Sovereign of Ash – Floor 3 dungeon dragon (Throne of Ashes)
# Combat: AshenSovereignDirector. World raid (aetherion.yml) is a separate fight.
# Sovereign (100%): he rules the air. Ashen Wake strafe, Cinderfall, Talon Dive, Skyfire.
# The Throne Claims Him (66%): pylons erupt, chains drag him to the floor.
# Chained: tail sweep, sweeping breath, eruption rings (stand in the blue gaps),
#   lunge, chain lash. Every big move leaves his heart bare (green = hit him).
# The Last Sky (33%): he snaps the chains and drops a sun on the Throne.
#   Only the soul wards (the broken pylons) are safe.
# Unchained: faster, crowned in embers; Sovereign's Fall meteor dive.
# Death: the heart cracks, he crashes, the Throne chains him down for good.
# Reward: the Sovereign's Reliquary (dungeon victory chest). Boss loot stays empty.
# ============================================================

