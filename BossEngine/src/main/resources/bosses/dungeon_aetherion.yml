        trigger: ON_PHASE
        broadcast: true
        message: "&5&lAetherion&7: &bYou wanted the set. Earn the bruise."
      - type: DRAGON_FIREBALL
        trigger: ON_TIMER
        interval-ticks: 36
        speed: 1.30
        damage: 225
        spread: 0.07

  - id: singularity
    health-percent: 25
    display-name: "&5&l✦✦✦ Aetherion &7(&8Singularity&7)"
    transition:
      duration-ticks: 85
      invulnerable: true
      freeze-ai: true
      shape: BLACK_HOLE
      explode: false
      explode-radius: 20
    attributes:
      attack-damage: 255
      movement-speed: 0.52
    skills:
      - type: DIALOG
        trigger: ON_PHASE
        broadcast: true
        message: "&5&lAetherion&7: &8The armor remembers who bled for it."
      - type: DRAGON_FIREBALL
        trigger: ON_TIMER
        interval-ticks: 32
        speed: 1.34
        damage: 255
        spread: 0.08

skills:
  - type: DIALOG
    trigger: ON_SPAWN
    broadcast: true
    delay-ticks: 10
    message: "&5&lAetherion&7: &fA dungeon. How quaint. &cShow me."

  - type: DIALOG
    trigger: ON_SPAWN
    broadcast: true
    delay-ticks: 55
    message: "&5&lAetherion&7: &fThe set is not a souvenir."

  - type: SOUND
    trigger: ON_SPAWN
    sound: ENTITY_ENDER_DRAGON_GROWL
    volume: 0.85
    pitch: 0.65

  - type: PARTICLE_AURA
    trigger: ON_TIMER
    interval-ticks: 12
    particle: PORTAL
    count: 8
    radius: 1.8
    extra: 0.02

  - type: DIALOG
    trigger: ON_DEATH
    broadcast: true
    message: "&5&lAetherion&7: &fFine. Take a piece. Not the whole myth."

loot:
