# ============================================================
# The Lobby Cleaner – T3 world boss (REV5 curve)
# Intended: Combat T3 party. HP kept. Ports players around. No vacuum.
# ============================================================

id: lobby_cleaner
display-name: "&5&lThe Lobby Cleaner"
entity-type: ENDERMAN
model-engine-id: ""

attributes:
  max-health: 125000
  movement-speed: 0.42
  attack-damage: 154
  scale: 1.85
  follow-range: 52
  knockback-resistance: 0.7

equipment:
  helmet: AIR
  chestplate: AIR
  leggings: AIR
  boots: AIR
  main-hand: AIR
  off-hand: AIR
  drop-chance: 0.0

options:
  glowing: true
  custom-name-visible: true
  silent: false
  invulnerable-spawn-ticks: 30
  persistent: true
  remove-when-far-away: false
  prevent-item-pickup: true

conditions:
  max-instances: 1
  leash-radius: 60
  leash-action: TELEPORT

phases:
  - id: sweep
    health-percent: 100
    display-name: "&5&lThe Lobby Cleaner"
    skills:
      - type: TELEPORT_PRANK
        trigger: ON_TIMER
        interval-ticks: 130
        range: 24
      - type: RING_BURST
        trigger: ON_TIMER
        interval-ticks: 150
        waves: 4
        step: 3.4
        damage: 58
        particle: PORTAL

  - id: overtime
    health-percent: 55
    display-name: "&5&lThe Lobby Cleaner &7(&8Overtime&7)"
    transition:
      duration-ticks: 65
      invulnerable: true
      freeze-ai: true
      shape: VOID_TORNADO
      particle: PORTAL
      extra-particle: REVERSE_PORTAL
      explode: false
    attributes:
      movement-speed: 0.46
      attack-damage: 176
      scale: 1.95
    skills:
      - type: DIALOG
        trigger: ON_PHASE
        broadcast: true
        message: "&5&lThe Lobby Cleaner&7: &8Trash goes in the bag. You qualify."
      - type: SPECTACLE
        trigger: ON_PHASE
        title: "&8OVERTIME"
        subtitle: "&7The bag reshuffles. Keep your feet."
        lightning: 0
        particle: PORTAL
        count: 140
        radius: 13
        sound: ENTITY_ENDERMAN_STARE
      - type: TELEPORT_PRANK
        trigger: ON_TIMER
        interval-ticks: 100
        range: 26
      - type: RING_BURST
        trigger: ON_TIMER
        interval-ticks: 120
        waves: 5
        step: 3.2
        damage: 70
        particle: REVERSE_PORTAL
      - type: METEOR_RAIN
        trigger: ON_TIMER
        interval-ticks: 140
        amount: 6
        damage: 68
        scatter: 12
        style: BURST

  - id: shredder
    health-percent: 22
    display-name: "&5&lThe Lobby Cleaner &7(&4Shredder&7)"
    transition:
      duration-ticks: 130
      invulnerable: true
      freeze-ai: true
      shape: BEAM_SPIN
      start-radius: 18
      explode: false
      explode-damage: 88
      explode-radius: 10
    attributes:
      movement-speed: 0.48
      attack-damage: 198
      scale: 2.05
    skills:
      - type: DIALOG
        trigger: ON_PHASE
        broadcast: true
        message: "&5&lThe Lobby Cleaner&7: &4Lost and Found is now a woodchipper."
      - type: SPECTACLE
        trigger: ON_PHASE
        title: "&4SHREDDER"
        subtitle: "&7Duck the high beams. Jump the low ones."
        lightning: 0
        particle: END_ROD
        count: 90
        radius: 14
        sound: ENTITY_ENDERMAN_SCREAM
      - type: TELEPORT_PRANK
        trigger: ON_TIMER
        interval-ticks: 90
        range: 28
      - type: RING_BURST
        trigger: ON_TIMER
        interval-ticks: 95
        waves: 5
        step: 2.9
        damage: 82
        particle: PORTAL
      - type: METEOR_RAIN
        trigger: ON_TIMER
        interval-ticks: 110
        amount: 8
        damage: 76
        scatter: 13
        style: BURST

skills:
  - type: SOUND
    trigger: ON_SPAWN
    sound: ENTITY_ENDERMAN_STARE
    volume: 1.7
    pitch: 0.45

  - type: SPECTACLE
    trigger: ON_SPAWN
    title: "&5LOBBY CLEANER"
    subtitle: "&7The floor looks nervous."
    lightning: 0
    particle: PORTAL
    count: 110
    radius: 11
    sound: ENTITY_ENDERMAN_TELEPORT

  - type: DIALOG
    trigger: ON_SPAWN
    broadcast: true
    message: "&5&lThe Lobby Cleaner &7opens Lost and Found. You are inventory."

  - type: PARTICLE_AURA
    trigger: ON_TIMER
    interval-ticks: 6
    particle: PORTAL
    count: 28
    radius: 1.4
    extra: 0.35

  - type: DIALOG
    trigger: ON_DEATH
    broadcast: true
    message: "&5&lThe Lobby Cleaner&7 drops the bag. Do not look inside."

loot:
  damage-based: true
  participation-threshold-percent: 5.0
  experience: 54000
  killer-bonus:
    - source: AETHERION
      item-id: void_vacuum_charm
      amount: 1
      chance: 0.34
    - source: AETHERION
      item-id: random_booster
      amount: 1
      chance: 1.0
  rank-loot:
    1:
      - source: AETHERION
        item-id: void_vacuum_charm
        amount: 1
        chance: 0.18
  top-damagers:
    count: 3
    items:
      - source: AETHERION
        item-id: random_booster
        amount: 1
        chance: 1.0
  shared:
    - source: VANILLA
      material: ENDER_PEARL
      min-amount: 8
      max-amount: 16
      chance: 1.0
  per-damager:
    - source: VANILLA
      material: EXPERIENCE_BOTTLE
      min-amount: 10
      max-amount: 18
      chance: 1.0
      scale-with-damage: true
