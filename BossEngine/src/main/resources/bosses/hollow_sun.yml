# ============================================================
# The Hollow Sun – Fallen Star showcase boss (Bloodstone arena)
# Combat: HollowSunDirector (+ HollowProps floor language,
#   HollowAccretion collapse disk, HollowSky). Spawn: /boss spawn hollow_sun
# Tells: a sun glyph on the floor = it lands here; its star touches the
#   rim on the hit. Gold / flare-red / blue-white (inward rays) by phase.
#   White = now. Crimson = never stand here. Green ring = he is spent.
# Main Sequence: a gold star-knight. Swipe, lance, slam, starcall, corona.
# Ignition: a red photosphere closes around the knight, the floor splits,
#   the sky goes to dusk.
# Red Giant: he floats inside his own star. Flare beams (the white edge
#   leads), prominence loops from the forge's rim, the floor boils.
# Starfall (66% -> 33%): he rises, swells into a red sun, implodes (the
#   sky cuts to night, every sound stops), and falls. Leave the crimson sun.
# Collapse: black core, blue-white photon shell, an accretion disk torn
#   out of the Bloodstone floor. Ejecta, wells, folds, and at 15% the
#   Last Light: break the core or everyone burns.
# Death: the plates fall back into their holes, the armor bursts, the core
#   returns to the sky as a supernova.
# Every floor change is client-side or a display, restored on death,
#   abort, despawn and plugin disable.
# ============================================================

id: hollow_sun
