  killer-bonus: []

  rank-loot:
    1:
      - source: AETHERION
        item-id: aetherion_void_stick
        amount: 1
        chance: 0.10
      - source: AETHERION
        item-id: random_aetherion_armor
        amount: 1
        chance: 1.0
    2:
      - source: AETHERION
        item-id: random_aetherion_armor
        amount: 1
        chance: 0.70
    3:
      - source: AETHERION
        item-id: random_aetherion_armor
        amount: 1
        chance: 0.15

  top-damagers:
    count: 0
    items: []

  shared: []

  per-damager:
