name: AetherionQuests
version: 1.0.0
main: de.aetherion.quests.AetherionQuests
api-version: '1.21'

author: Aetherion
description: Aetherion MMO Quest System

depend:
  - AetherionCore
  - AetherionItems

softdepend:
  - PlaceholderAPI
  - FancyNpcs
  - BossEngine
  - AetherionHub
  - AetherMobs

commands:
  aquest:
    description: Admin quest tools (players use NPCs)
    usage: /aquest
    permission: aetherionquests.admin
    permission-message: "§cQuests are handled by NPCs."

  questnpc:
    description: Manage Aetherion quest NPCs
    usage: /questnpc <spawn|give|remove|cleanup|list|removeall>
    permission: aetherionquests.admin

  language:
    description: Choose quest/hint language (EN fully supported, DE experimental)
    usage: /language [en|de]
    aliases: [lang, sprache, sprachewahl]

  npc:
    description: In-game FancyNPC creator for moderators
    usage: /npc
    aliases: [aethernpc, npceditor]
    permission: aetherion.npc.editor

permissions:
  aetherion.npc.editor:
    description: Create and edit FancyNPCs with dialogue (moderator / content helper)
    default: false
  aetherionquests.admin:
    description: Admin quest NPC tools (/questnpc, anchors)
    default: op
