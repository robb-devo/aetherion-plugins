# Ankerhold opening orbit — 'Welcome to Aetherion' (15 s). Authored against ankerhold_hub_v2.schem.
# baked rows: [tick, x, y, z, yaw, pitch] (camera eye position; yaw unwrapped, MC convention)
opening_orbit:
  id: aetherion.open_orbit
  coords: Ankerhold DESIGN coords (schematic pasted with //paste -o, hub centre 0 63 0)
  gate: first join only (shown-once flag) AND Ankerhold is the active hub; otherwise skip silently
  duration_ticks: 300
  tps: 20
  interpolation: per-axis monotone cubic (Fritsch-Carlson), zero velocity at both ends; look-at target interpolated the same way; yaw/pitch derived
    from position->target each tick
  camera_eye_offset: 1.62
  start: {x: 166.5, y: 65.0, z: 8.5, yaw: 90.0, note: spawn.harbour (gangway)}
  end: {x: 147.5, y: 65.0, z: 4.5, yaw: 91.43, pitch: 0.67, note: 'player hand-off on the pier head, ~6 blocks east of Egon, facing him'}
  egon: {x: 141.5, y: 65.0, z: 3.5, yaw: -90.0}
  keyframes:
  - t: 0.0
    pos: [166.5, 66.62, 8.5]
    look: [120.0, 66.6, 8.5]
    beat: 'start: player''s eye at the gangway'
  - t: 0.9
    pos: [168.5, 73.5, 8.4]
    look: [104.0, 69.0, 6.6]
    beat: rise off the gangway
  - t: 1.8
    pos: [175.0, 88.0, 4.0]
    look: [100.0, 70.0, 6.0]
    beat: 'lift: straight up the pier axis, Spill Gate + sloop in frame'
  - t: 3.4
    pos: [212.0, 112.0, 40.0]
    look: [40.0, 78.0, 10.0]
    beat: climb out past the Long Haul
  - t: 5.6
    pos: [212.0, 136.0, 132.0]
    look: [-15.0, 80.0, 22.0]
    beat: 'SE vantage: Ore Ridge, Clucksworth, Capital'
  - t: 7.6
    pos: [246.0, 146.0, 6.0]
    look: [-20.0, 82.0, 0.0]
    beat: 'E vantage: harbour axis -> Tallybell -> Fallen Anchor'
  - t: 9.6
    pos: [208.0, 136.0, -134.0]
    look: [-25.0, 86.0, -40.0]
    beat: 'NE vantage: Mount Skyreach, Whisperwood, Seawatch'
  - t: 11.4
    pos: [204.0, 90.0, -18.0]
    look: [110.0, 72.0, 6.0]
    beat: 'return: swing down toward the pier axis'
  - t: 12.9
    pos: [184.0, 75.0, -1.0]
    look: [112.0, 68.0, 4.5]
    beat: approach the pier from the north-east
  - t: 13.5
    pos: [168.0, 69.5, 8.5]
    look: [116.0, 67.4, 4.2]
    beat: drop onto the pier axis, past the spawn
  - t: 14.0
    pos: [156.0, 67.6, 8.5]
    look: [119.0, 66.8, 3.9]
    beat: through the Spill Gate
  - t: 15.0
    pos: [147.5, 66.62, 4.5]
    look: [122.51, 66.33, 3.88]
    beat: 'settle: Egon just right of centre, hand-off'
  cues:
  - {t: 0.0, tick: 0, channel: player, do: 'SPECTATOR + spectate the camera rig; per-player time 1000 (morning, sun behind the arrival); hide
      HUD text'}
  - {t: 0.0, tick: 0, channel: music, do: 'aetherion:open_orbit starts (12–16 s, non-looping, quiet harbour motif)'}
  - {t: 0.2, tick: 4, channel: sfx, do: 'existing HarbourArrival foghorn, low (vol 0.35)'}
  - {t: 1.8, tick: 36, channel: visual, do: pier axis lines up on the Tallybell — no title; let the image read}
  - {t: 3.4, tick: 68, channel: sfx, do: 'soft wind (item.elytra.flying vol 0.15 pitch 0.6) for the climb, fade out by 5.0'}
  - {t: 7.6, tick: 152, channel: sfx, do: single distant Tallybell toll (block.bell.use vol 0.4 pitch 0.75) as the spire crosses frame centre}
  - {t: 9.6, tick: 192, channel: music, do: motif resolves / starts to settle}
  - {t: 12.9, tick: 258, channel: npc, do: 'Egon (LivingNpc) busywork: back half-turned, working the kit crates beside his shed'}
  - {t: 13.5, tick: 270, channel: npc, do: 'Egon turns to face the incoming camera / arrival (look-at), Fishmonger glances over'}
  - {t: 13.8, tick: 276, channel: fx, do: 'Spill spray: a few splash/cloud particles under the Spill Gate as the camera passes'}
  - {t: 14.0, tick: 280, channel: fx, do: existing green flare on Egon starts (HarbourArrival.flareEgon)}
  - {t: 14.6, tick: 292, channel: npc, do: Egon raises a hand / arm swing — 'there you are'}
  - {t: 15.0, tick: 300, channel: player, do: 'hand-off: teleport player to END with the last frame''s yaw/pitch, restore gamemode, stop spectating,
      remove rig, reset player time; FIND EGON action bar (shortened beat)'}
  verified: {min_clearance_blocks: 1.2, max_yaw_rate_deg_s: 19.2, max_pitch_rate_deg_s: 12.4, checked_against: 'ankerhold_hub_v2.schem (every
      solid block incl. ships, clouds, gate, lamps)'}
