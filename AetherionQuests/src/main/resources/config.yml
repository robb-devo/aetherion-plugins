# ============================================================
# Quest compass
# ============================================================
# The sidebar on the right is drawn by TAB or DeluxeHub,
# not by this plugin. If BOTH scoreboards are enabled they
# overwrite each other. Keep TAB, disable DeluxeHub's board.
#
# PlaceholderAPI must be installed. Then add this line to TAB
# (plugins/TAB/config.yml scoreboard) or DeluxeHub scoreboard:
#
#   %aetherionquests_compass% %aetherionquests_target%
#
# Placeholders:
#   %aetherionquests_compass%   ↗ 84m
#   %aetherionquests_arrow%     ↗
#   %aetherionquests_distance%  84m
#   %aetherionquests_target%    Hunter
#   %aetherionquests_title%     First Hunt
#
# TAB refresh (optional, makes the arrow feel live):
#   placeholder-refresh-intervals:
#     "%aetherionquests_compass%": 200
#     "%aetherionquests_target%": 1000
#
# The same arrow also appears on the quest bossbar.

npcs:

  fisherman:
    world: world
    x: 0
    y: 64
    z: 0

# ============================================================
# FancyNPC visibility (blocks)
# ============================================================
# Living story NPCs (Egon, Twig, …) stay high so the hub does not pop-in.
# Moderator-created editor NPCs use a shorter default — fine on islands.
# Miss Canopy lives in AetherionForaging: isle-guide.visibility-distance
#
# These keys are read with code defaults if missing. The jar will not
# overwrite a live plugins/AetherionQuests/config.yml.

living-npc-visibility-distance: 96
editor-npc-visibility-distance: 48
