    farmer_left: "§eFarmer§f will noch Weizen, falls du ihn ausgelassen hast — gleiche Ecke."
  fields:
    back_ledger: "Zurück zu §dMiss Ledger§f — sie schließt die Orientierung. Oder §e/capital§f."
