quests:
  # Das Schlaflied (main story, Act I–II)
  lullaby_old_tale:
    title: "Eine alte Geschichte"
    description: "Hollis sagt, Mütterchen Berit erzählt die Geschichte vom irren König am besten. Such ihr Häuschen am Rand der Capital und hör zu."
  lullaby_gear:
    title: "Das Summen in der Tiefe"
    description: "Die tiefen Stollen der Shabby Mine summen Berits Schlaflied. Töte den Hollow Lurker und bring, was er bewacht, zu Ysolde Thorne ins Archiv."
  lullaby_insignia:
    title: "Ein Abzeichen der Garde"
    description: "Ysolde will einen Beweis, dass der König eine Garde hatte. Töte Skuldugery, den brennenden Bogenschützen, und bring sein Abzeichen (Sun Guard Insignia) ins Archiv."
  lullaby_short_toll:
    title: "Glocken zählen"
    description: "Frag Sister Aurel, die Hüterin der Sieben Glocken, was sie gezählt hat."
  lullaby_old_seal:
    title: "Das alte Siegel"
    description: "Deine Inselpapiere tragen ein altes Siegel: Königreich Eldervale. Bring die Frage zu Ysolde Thorne ins Archiv."
  lullaby_letters:
    title: "Briefe von M"
    description: "Finde in Welt-Kisten drei versiegelte Briefe, gezeichnet 'M', und bring sie Ysolde ins Archiv."
  lullaby_third_anchor:
    title: "Der dritte Anker"
    description: "Geh runter zum Lager unter dem Fallen Anchor und frag Hesper Kael nach dem dritten Anker."
  lullaby_forgotten:
    title: "Das dunkle Fenster"
    description: "Nell sagt, Mütterchen Berit hat vergessen, ihre Lampe anzumachen. Sieh bei Berit in ihrem Häuschen nach."
  lullaby_silent_road:
    title: "Die stille Straße"
    description: "Töte den Pathwarden auf der versiegelten Königsstraße und bring das Schreiben, das er trägt, zu Ysolde ins Archiv."
  lullaby_ferry:
    title: "Hinter den Schleier"
    description: "Geh am Schleierkai an Bord der Königsfähre. Fahr hinüber. Dann sprich drüben mit dem Fährmann."
  lullaby_captain:
    title: "Der Sturz des Hauptmanns"
    description: "Hinter dem Eisenring brennt etwas im Krater. Weck es an Caedmons Schwert und lösch es. Der Wachposten am Ring will es wissen."
  lullaby_heart:
    title: "Ein Herz in einer Maschine"
    description: "Orrin hält im Observatorium einen sterbenden Stern am Schlagen. Tritt durch seinen Ring, besiege Herold und Requiem und sag es dann dem Platzanweiser am kleinen Theater."
  lullaby_doll:
    title: "Die letzte Vorstellung"
    description: "Zieh die Spieluhr auf Elins Bühne auf. Bleib bis zum Ende der Vorstellung. Dann geh zurück zum Platzanweiser."
  lullaby_seed:
    title: "Was der Same fraß"
    description: "Steig durch den Schlund hinab zum Letzten Samen. Komm am Unbroken vorbei, besiege Nihil und komm zurück zum Gärtnerjungen."
  welcome_aboard:
    title: "Willkommen an Bord"
    description: "Sprich mit dem Forager oben am Hügel über Anker Harbour."
  gather_wood:
    title: "Egons Holzlauf"
    description: "Hack Eiche mit der Axt vom Forager und bring Egon 10 Stämme."
  forge_coal:
    title: "Kohle für die Schmiede"
    description: "Bring dem Quartermaster 20 Kohle vom Ore Ridge."
  first_shift:
    title: "Erste Schicht"
    description: "Bau 32 Erze in der Shabby Mine ab und melde dich beim Shaft Foreman."
  first_hunt:
    title: "Erste Jagd"
    description: "Hilf, den Hof von ein paar Tieren zu befreien."
  farm_hand:
    title: "Feldarbeit"
    description: "Ernte Weizen auf den Feldern. Lark hat seine Sammlung gleich nebenan."
  a_simple_craft:
    title: "Zweites Rezept"
    description: "Öffne das §agrüne Recipe Book§7 im Manager und crafte eine §fMining Pickaxe§7 — Simple Pickaxe in die Mitte, Kohle drumherum."
  shiny_things:
    title: "Glänzendes"
    description: "Bau drei Diamanten ab."
  a_good_catch:
    title: "Ein guter Fang"
    description: "Fang fünf Fische."
  dock_pass:
    title: "Dock-Pass"
    description: "Hol dir bei Tackle am Steg einen Shop-Pass und geh zurück zum Fishmonger."
  open_up:
    title: "Aufmachen"
    description: "Öffne die Probekiste des Merchants."
  pocket_zoo:
    title: "Taschenzoo"
    description: "Fang mit einer Catch Sphere ein wildes Pet für Lark, sprich mit ihm und rüste es im Manager aus."
  those_sounds:
    title: "Diese Geräusche"
    description: "Finde die Quelle der Geräusche und erledige den Hollow Lurker."
  poultry_problem:
    title: "Geflügelproblem"
    description: "Finde McNugget und steck das Riesenhuhn zurück in den Eimer."
  troll_toll:
    title: "Trollmaut"
    description: "Überquer die Brücke. Überleb den Troll. Behalt das Wechselgeld."
  ink_contract:
    title: "Tintenvertrag"
    description: "Tauch nach Squidward und komm mit weniger Tentakeln zurück."
  ash_and_arrows:
    title: "Asche und Pfeile"
    description: "Jag Skuldugery, bevor die Feuersalve dich jagt."
  walking_mountain:
    title: "Wandelnder Berg"
    description: "Bring den Aether Colossus zu Fall. Lass dich nicht zertreten."
  the_veil:
    title: "Der Schleier"
    description: "Fordere Aetherion im Dungeon heraus. Unterhalte es — oder werd eine Fußnote."
  open_ticket:
    title: "Offenes Ticket"
    description: "Schließ Sir Balthazar. Endgültig. Der Support tut so, als wär das der Plan gewesen."
  lost_and_found:
    title: "Fundbüro"
    description: "Zieh dem Lobby Cleaner den Stecker, bevor er den Rest des Servers als Müll ablegt."
  overtime:
    title: "Überstunden"
    description: "Stempel Sparky aus. Der Gildensteinbruch hat sein Blitzbudget überzogen."
  denied_claim:
    title: "Abgelehnter Antrag"
    description: "Regel das mit Baron von Wurm. Die Spitzhacken-Versicherung hat schon nein gesagt."
  bounced_check:
    title: "Geplatzter Scheck"
    description: "Pfände den Insolvent Wither. Bring das Hauptbuch zurück, zur Not in Stücken."
  closed_road:
    title: "Gesperrte Straße"
    description: "Der Pathwarden ist die Straßensperre. Beweg ihn. Oder werd ein neues Wahrzeichen."
  lesson_steel:
    title: "Lektion: Stahl"
    description: "Sergeant Vex will zehn Feinde in den Borderlands erledigt sehen. Endgültig."
  lesson_boost:
    title: "Lektion: Boost"
    description: "Temper will einen Booster auf deinem Gear sehen — gefust am Anvil im Manager."
  border_rites:
    title: "Border-Riten"
    description: "Spirit-Fläschchen farmen, am Pulver-Altar zünden — ein Borderlands-Boss."
  lesson_manager:
    title: "Lektion: Skills"
    description: "Miss Ledger will, dass du im Aetherion Manager einen Skill ausrüstest."
  lesson_bones:
    title: "Lektion: Dungeons"
    description: "Rook will zehn Knochen. Dungeon-Hausaufgaben ohne Dungeon."
  sidewalk_survey:
    title: "Gehweg-Gutachten"
    description: "Der Bench Cynic braucht acht verrottetes Fleisch für 'Forschung'. Frag nicht."
  gravel_ambition:
    title: "Kies-Ehrgeiz"
    description: "Dust will dreißig Bruchstein. Die Karte kann warten. Die Straße nicht."
  pantry_run:
    title: "Vorratslauf"
    description: "Larder will drei Compressed Wheat. Farm-Weizen komprimieren, dann abliefern."
  pig_in_a_poke:
    title: "Die Sau im Sack"
    description: "Pet Scout will Beweise, dass du fangen kannst. Fang ein wildes Schwein mit einer Catch Sphere."
  coal_audit:
    title: "Kohleprüfung"
    description: "Ore Ledger will fünf Compressed Coal. Bring Belege, keine Ausreden."
  stump_census:
    title: "Stumpfzählung"
    description: "Timber Clerk braucht fünf Compressed Oak Logs. Bäume, die Steuern gezahlt haben."
  canopy_sample:
    title: "Kronenprobe"
    description: "Canopy Clerk will je ein Compressed Oak, Birch und Spruce. Nur Inselholz zählt als Beweis."
  scale_sample:
    title: "Schuppenprobe"
    description: "Dock Scaler will drei Compressed Cod. Das Klemmbrett ist schon nass."
  bovine_brief:
    title: "Rinderakte"
    description: "Sphere Proctor will eine Kuh in einer Sphere. Keine Milch. Kein Steak. Gewahrsam."
  guild_brick:
    title: "Gildenziegel"
    description: "Quarry Broker tauscht einen Compacted Cobblestone gegen Club-nahen Respekt."
  signature_crystal:
    title: "Schliff"
    description: "Ore Ledger will einen Crystal Find, von Hand geknackt. Holzfäller schärfen T4-Äxte daran; Bauern mahlen ihn in T5-Erde."
  signature_heartwood:
    title: "Maserung"
    description: "Timber Clerk will ein Elderbark Heartwood. Bergleute schäften T4-Spitzhacken damit; Kämpfer wickeln T4-Griffe in den dunklen Vetter."
  signature_prize:
    title: "Blaues Band"
    description: "Larder will eine Prize Crop. Angler ködern T4-Schnüre damit; Bergleute essen sie bei T5."
  signature_trophy:
    title: "Wandtrophäe"
    description: "Dock Scaler will einen Trophy Fish. Bauern düngen T4-Erde mit Fischmehl; T5-Kämpfer füttern ihre Platte mit Schuppen."

dialogs:
  # ---------------------------------------------------------------- gates
  fishing_before_egon:
    - "Moment. Erst Egon fertig machen — dann reden wir übers Angeln."
  tutorial_blocked:
    - "Noch nicht, {player}. Dieser Schalter öffnet nach der Orientierung."
    - "Hafen → Mine → Temper → Miss Ledger → Felder. Dann bist du frei."
  ledger_blocked:
    - "Zu früh, {player}. Skills bleiben zu, bis die Minenschicht durch ist."
    - "§eShaft Foreman§f, an den Minen. Schicht fertig machen, dann zurückkommen."
    - "Dann öffne ich den Skills-Tab. Keine Minute früher."

  # ---------------------------------------------------------------- Harbour spine
  egon_intro:
    - "{player}, richtig? Egon. Ich rüste Rookies aus. Du siehst aus wie einer."
    - "Das Kit kostet zehn Eichenstämme. Der §eLumberjack§f am Hügel leiht dir die Axt."
    - "Nennt sich Forager. Lass ihm den Spaß."
    - "Der §egelbe Pfeil oben§f kennt den Weg. Ich kenn hauptsächlich den Pier."
  egon_arrival_call:
    - "Hey — neues Gesicht! Hier drüben, beim grünen Leuchten."
  egon_greet_near:
    - "Das bin ich. Rechtsklick — ich beiße nicht, ich rüste aus."
  egon_kit_handoff:
    - "Zehn Stämme. Zweimal gezählt. Hier ist dein Kit — Spitzhacke, Schwert, Hacke, Rüstung."
    - "Die Rüstung ist gebraucht. Vorbesitzer ist in Rente. Größtenteils friedlich."
    - "Der §eQuartermaster§f sitzt hinter dem kleinen Markt. Na los, {player}."
  lumberjack_intro:
    - "Egon braucht Eiche. Schon wieder. Der Mann frisst Planken, ich schwör's."
    - "Simple Axe. Linksklick auf einen §eleuchtenden Stamm§f — das startet die Chop-Leiste."
    - "Grünes §aCHOP§f? Nochmal Linksklick. Verpasst? Baum setzt zurück. Bäume sind nachtragend."
    - "Zehn Eichenstämme → §eEgon am Pier§f. Nicht zu mir. Ich hab genug."
  quartermaster_intro:
    - "Quartermaster. Ich zähle Dinge. Heute: Kohle."
    - "Zwanzig Stück. §eOre Ridge§f — der Hügel hinter dem kleinen Markt. Offene Adern."
    - "Der §egelbe Pfeil oben§f verfolgt den Auftrag. Ich verfolge dich. Unauffällig."
  craftsman_intro:
    - "Hm. Craftsman. Crafting ist offen — das Recipe Book steckt in deinem Manager."
    - "Nether Star, Hotbar §e9§f → §agrünes Buch§f. Da drin ist jede Blaupause."
    - "Bau eine §fMining Pickaxe§f. Simple Pickaxe in die Mitte, Kohle drumherum."
    - "Bring sie her. Ich versuch, beeindruckt zu gucken."
  foreman_intro:
    default:
      - "Die Shabby Mine ist hinter mir. Schäbig trifft's."
      - "Bau §eKohle, Kupfer, Eisen§f ab. §e32 Erzblöcke§f, dann komm zurück, {player}."
      - "Mining Pickaxe und etwas Rüstung helfen. Das Recipe Book ist im Manager."
    crafting_unlocked:
      - "Die Shabby Mine ist hinter mir. Schäbig trifft's."
      - "Bau §eKohle, Kupfer, Eisen§f ab. §e32 Erzblöcke§f, dann komm zurück, {player}."
      - "Crafting ist jetzt offen. Grünes Recipe Book, im Manager."
      - "Mining Pickaxe und etwas Rüstung helfen da unten."
  booster_tutor_intro:
    - "Temper. Ich fuse Zeug. Booster aufs Gear — Mining Power, Fortune, Damage."
    - "Sag ja, und du kriegst einen Emerald Booster. Einmal fusen. Das ist die Lektion."
    - "Manager → §eAnvil§f. Gear links, Booster rechts. Funken sind normal."
  ledger_intro:
    - "Miss Ledger. Skills — und ich stemple die Orientierung zu, wenn du durch bist."
    - "Hotbar §e9§f → Nether Star → Manager → §dSkills§f. Blinkt. Rüste §eirgendeinen§f Skill aus."
    - "Komm wieder, wenn er sitzt, {player}. Ich halte den Stempel warm."
  farmer_intro:
    default:
      - "Weizen von diesen Feldern. Vögel weg von der Saat. Das ist der Job, {player}."
      - "Ernte, bis du §e48§f Weizen hast. Vögel landen? §eKlick§f drauf — die Bossbar zählt mit."
      - "§eLark§f macht Pets, gleiche Felder. Eigener Job — der Pfeil wandert, wenn's so weit ist."
    lark_done:
      - "Weizen von diesen Feldern. Vögel weg von der Saat. Das ist der Job, {player}."
      - "Ernte, bis du §e48§f Weizen hast. Vögel landen? §eKlick§f drauf — die Bossbar zählt mit."
  lark_intro:
    - "Die Felder sind Jagdgebiet. Wilde Tiere — nicht mein Papagei. Die beißt."
    - "Catch Sphere in die Hand, Tier anschauen, §eRechtsklick§f zum Werfen."
    - "Fang §eeins§f, dann rede mit mir. §eAusrüsten§f kommt danach. Schritt für Schritt."
  fisher_intro:
    - "Auswerfen. Auf den Biss warten. §eREEL§f, wenn die Leiste grün wird."
    - "Fenster verpasst, Fisch weg. Fang §efünf§f, dann komm zurück, {player}."
  fishmonger_intro:
    - "Shop. Ruten. Rüstung. Münzen willkommen."
  vex_intro:
    - "Sergeant Vex. Tor zu den §cBorderlands§f — Ödland hinter der Mauer."
    - "Erste Lektion: zehn Feinde. Husk, Stray, Crawler — mir egal, welche."
    - "Checkliste: Rüstung an, Klinge in der Hand, Essen im Beutel. Booster helfen."
    - "Und jetzt Abmarsch, {player}."

  # ---------------------------------------------------------------- Borderlands (Hub pass owns these — unchanged)
  rite_keeper_intro:
    - "Rite Warden. Borderlands-Vertrag — T1-Bosse, kein Sightseeing."
    - "Töte Gegner. Spirit-Fläschchen: §c5%§f T1 · §c10%§f Sturdy · §c15%§f Elites. Die §eBeacon-Säule§f ist der Altar."
    - "Rechtsklick auf hellgraues Pulver mit dem Fläschchen. Zehn Sekunden. Donner. Dann läuft er. Einmal töten — Ritus bestanden."
  arena_proctor_intro:
    - "Proctor. Dieser Ring bedeutete mal etwas. Dann wurden die Leute vorsichtig."
    - "Ich hab von Fläschchen alter Borderlands-Bosse gehört — und von einer stärkeren Variante in der Crypt."
    - "Bring mir eins von den stärkeren. Ich will es untersuchen. Vorsichtig. Wahrscheinlich."
  arena_proctor_vial:
    - "Da ist es. Stärker als die Borderlands-Variante."
    - "Komm — wir schauen uns den Ring an. Ich prüfe das Fläschchen unterwegs."
    - "Nicht dran rumschütteln. Und nicht zu nah atmen."
  arena_proctor_self:
    - "Du hast den Spill gesehen. Ich mach keine Encore-Spaziergänge."
    - "Nimm das Fläschchen zur leuchtenden Markierung im Ring. Rechtsklick selbst."
    - "Gleicher Donner. Gleiche zehn Sekunden. Weniger meiner Schritte."
  arena_proctor_done:
    - "Ring ist offen. Crypt-Fläschchen auf die leuchtende Markierung — nicht in meine Hand."
    - "Einmal durchgespielt. Das war der Lehrplan."
    - "Bring ein neues, wenn du eins hast. Oder auch nicht. Der Pathwarden ist nicht wählerisch."

  # ---------------------------------------------------------------- Hub / Capital / isles
  farm_isle_guide_intro:
    - "Die Farm Isle liegt den Weg runter — Eldervale-Felder, lange Reihen, besserer Boden."
    - "Das Pad unten bringt dich hin, ab Farming §e10§f. Der Pfeil zeigt drauf."
    - "Der Farmer nebenan hält sich für den echten Farmer. Süß."
  forage_pad_guide_intro:
    - "Schleim-Pad → Forage Isle. Springen. Nicht nachdenken."
    - "Die Bäume da droppen, was sie sind — Fichte ist Fichte, Birke ist Birke."
    - "Der §eCanopy Clerk§f auf der Insel will komprimierte Proben. Folg dem Pfeil, {player}."
  eldervale_welcome_intro:
    - "Willkommen auf Eldervale, {player}."
    - "Bergbauinsel. Tiefes Gestein, dünne Luft."
    - "Vorsicht an der Kante. Den Boden hat noch keiner gefunden."
  eldervale_upgrade_intro:
    - "Blaupausen-Schmiede. Tool plus Upgrade Stone. Das ist der ganze Trick."
    - "Tier II, III, IV — die Steine werden fies teuer. Schnell."
  isle_clerk_intro:
    default:
      - "Die eigene Insel gibt's ab Aetherion Level §e20§f."
      - "Nether Star, Slot neun → Island-Tab. Dort claimen. Ich mach keinen Papierkram."
      - "Ein Beamter ohne Papierkram. Ja. Ich weiß."
    after_seal:
      - "Der Island-Tab ist im Manager, {player}. Slot neun. Wie immer."
      - "Königreich Eldervale. Ich hab's nachgeschlagen, als du weg warst."
      - "Dann hieß es von der Registry, ich soll aufhören. Also hab ich aufgehört."
  merchant_intro:
    - "Welt-Kisten. Nicht nur diese hier — die spawnen überall."
    - "Seltenere Kiste, besseres Loot. Erkunden lohnt sich."
    - "Mit mir reden schaltet sie frei. Die Probekiste steht neben mir, {player}."
  surveyor_intro:
    - "Trolle kriechen jetzt durch die weichen Adern — Kohle, Eisen, Kupfer. Sie droppen Blaupausen."
    - "Bring mir eine Seite, {player}. Ich stemple sie dir hier in ein Tool."
  liquidator_intro:
    - "Kristall-Schalter. Kaufen, verkaufen oder Mats zu Aether Crystals schmelzen."
    - "Crystals gibt's im offiziellen Shop — oder als Level-Belohnung."
  canopy_clerk_intro:
    - "Ich will Inselholz — komprimiert. Keine Hafenreste."
    - "Foraging §e5§f. Dann je ein Compressed Oak, Birch, Spruce."
    - "Drei Proben. Fette Auszahlung. Dann ab zum Hacken, {player}."
  bar_whisper_intro:
    - "Psst. {player}. Unten am Bildschirm — die Leiste. Dein §bAetherion Level§f."
    - "Stats, Unlocks, neue Orte… das meiste hier öffnet sich darüber."
    - "Spiel weiter. Die Leiste merkt sich das."
  vince_intro:
    - "Casino ist direkt hinter mir. Such dir 'ne Maschine. Nicht auf den Filz heulen."
  dungeon_gate_intro:
    - "Das Portal ist das Dungeon Gate. Es bringt dich zum Dungeon-Hub — Instanzen, Etagen, Wächter."
    - "Geh durch, wenn du ausgerüstet bist. Die andere Seite schickt dich zurück in die Capital."
  town_crier_intro:
    default:
      - "Hört, hört! {player} naht! Vermutlich mit Absicht!"
      - "Hollis. Stadtschreier. Ist es Neuigkeit, brüll ich's. Ist es keine, auch."
      - "Heute: Der Hafen steht, die Glocken waren pünktlich, keiner ist reingefallen."
    quiet_news:
      - "Hört, hört… {player}. Leisere Nachrichten heute."
      - "Eine Frau auf dem Markt hat heute früh ihren eigenen Namen vergessen. Stand einfach da."
      - "Hab's trotzdem gerufen. Ist mein Job. Fühlte sich nur nicht wie eine Nachricht an."
  street_sweeper_intro:
    - "Vorsicht, der Haufen, {player}. Das ist ein ganzer Vormittag Arbeit."
    - "Bram. Ich fege. Rookies verlieren Bruchstein. Bergleute Kies. Alle verlieren Niveau."
    - "Saubere Straße, klarer Kopf. Vor allem saubere Straße."
  lamp_lighter_intro:
    night:
      - "Abend, {player}. Wick. Lampen sind mein Geschäft."
      - "Jede Laterne im Hafen brennt bis zum Morgen. Altes Gesetz."
      - "Bleib im Licht. Dafür ist es da."
    day:
      - "Morgen, {player}. Wick. Laternenanzünder."
      - "Tagsüber hab ich frei. Ich poliere Glas und schneide Dochte."
      - "Such mich nach Sonnenuntergang. Dann fängt die Arbeit an."
    night_queen:
      - "Abend, {player}. Die Lampen brennen. Alle."
      - "Altes Gesetz von einer Königin, sagte meine Oma. Damit die Kinder keine Angst haben."
      - "Ihren Namen weiß keiner mehr. Das Erinnern machen die Lampen."
    day_queen:
      - "Morgen, {player}. Glas ist sauber. Dochte sind geschnitten."
      - "Meine Oma meinte, das Lampengesetz kam von einer Königin. Welche, hat sie nie gesagt."
      - "Egal, wer's geschrieben hat. Dunkel bleibt dunkel."
  living_test_intro:
    - "Wenn du das lesen kannst, funktioniert die Living-NPC-Pipeline."
    - "Spieler-Skin, schaut dich an, kein Glühen. Dorfbewohner bleiben, wie sie sind."
    - "Gib dem Team Bescheid, wenn der Rest migrieren soll."
  rivet_intro:
    - "Hallo! Ich bin Rivet. Ich sorg dafür, dass die Schiffe in diesem Hafen nicht auseinanderfallen."
    - "Bolzen, Planken, Seile, Nägel. Was ein Schiff zusammenhält, hab ich mindestens einmal behämmert."
    - "Pass auf, wo du hintrittst, die Farbe auf dem Deck ist noch nass. Und falls du irgendwo Nieten findest: die gehören mir."
  # ---------------------------------------------------------------- world NPCs / boss hunts
  hunter_intro:
    - "Auf dem Hof wird's laut. Zu viele Kühe unterwegs."
    - "Leg fünf von ihnen um."
    - "Komm wieder, wenn's ruhiger ist."
  collector_intro:
    - "Ich mag glänzende Sachen. Du magst Belohnungen. Einfacher Deal."
    - "Bau mir drei Diamanten ab."
  miner_intro:
    - "WOAH!"
    - "Erschreck mich doch nicht so..."
    - "Ich war nur hier und hab friedlich vor mich hin gegraben..."
    - "Aber dann diese Geräusche... AAAH!"
    - "Kannst du nachsehen, woher die kommen? Ich zahl auch gut!"
  chicken_keeper_intro:
    - "Hallo! Ich kümmer mich um die Hühner von Clucksworth. Na ja, um die meisten."
    - "Mein größtes, McNugget, ist schon wieder ausgebüxt. Er ist irgendwo draußen auf den Feldern, und er ist riesig."
    - "Falls du ihm begegnest: schau ihm nicht in die Augen. Das hält er für eine Herausforderung."
  tollkeeper_intro:
    - "Hallo! Früher gab's an dieser Brücke einen Zoll. Dann ist ein Troll unter die alten Übergänge gezogen und hat seine eigenen Regeln gemacht."
    - "Er nimmt keine Münzen. Er nimmt Reisende, oder versucht es zumindest."
    - "Heute führ ich nur noch das Buch für die Brücke. Ein sehr kurzes Buch. Vor allem Entschuldigungen an die Leute, die geschnappt wurden."
  dockhand_intro:
    - "Das Wasser benimmt sich in letzter Zeit seltsam. Die Fischer kommen voller Tinte nach Hause."
    - "Unter dem Hafen lebt was mit zu vielen Armen und schlechter Laune. Tinte, Gift, das ganze Programm."
    - "Tackle sagt, es ist nur ein großer Tintenfisch. Tackle sagt aber auch, die Fische mögen ihn, also weiß ich nicht."
  ash_scout_intro:
    - "Hallo. Ich beobachte hier draußen die Ödnis und behalte die Bogenschützen im Auge."
    - "Skuldugery schießt brennende Pfeile auf jeden, der zu nahe kommt. Er liebt Publikum."
    - "Wenn du da rausgehst, bleib in Bewegung und hinter Deckung. Und zähl deine Pfeile, das mach ich auch immer."
  colossus_scholar_intro:
    - "Er läuft. Das ist die ganze These."
    - "Der Aether Colossus ist keine Metapher. Leider."
    - "Wirf ihn um. Ich zitiere dich als Primärquelle."
  veil_priest_intro:
    - "Aetherion langweilt sich. Das ist ein Wetterbericht."
    - "Es will einen Herausforderer. Du wirkst… verfügbar."
    - "Gewinn, und ich zahl dich, als wolltest du überleben. Verlier, und es kriegt eine Geschichte."
  patch_intern_intro:
    - "Willkommen beim Support. Ihre geschätzte Wartezeit: Sir Balthazar."
    - "Er hat die letzten drei eingefroren, die nach dem Status gefragt haben. Höflich."
    - "Schließ das Ticket. Endgültig. Ich zahl in Diamantblöcken, damit du aufhörst zu mailen."
  void_janitor_intro:
    - "Die Lobby ist ein Tatort. Die Tat: Müll."
    - "Der Lobby Cleaner hat drei Praktikanten und ein Gerücht eingesaugt. Frag nicht, was lauter war."
    - "Zieh ihm den Stecker. Zwei Compacted Diamond Blocks. Aus dem Fundbüro. Natürlich."
  fuse_intro:
    - "Sparky ist Mitarbeiter des Monats. Keiner hat abgestimmt. Das Klemmbrett ist geschmolzen."
    - "Kommt als Blitz zur Arbeit und geht als Loch im Gildensteinbruch."
    - "Schalt ihn ab. Zwei Compacted Diamond Blocks. HR hat schon unterschrieben. In Ruß."
  claims_adjuster_intro:
    - "Baron von Wurm hat einen Steinbruch gefressen. Und uns die Bissspuren in Rechnung gestellt."
    - "Das Formular hat ein Kästchen für 'am Stück verschluckt'. Zweimal geprüft."
    - "Erledig den Wurm. Compacted Diamond Blocks. Das ist der Vergleich. Kein Einspruch."
  repo_agent_intro:
    - "Der Insolvent Wither hat Insolvenz angemeldet. Auf fremden Schädeln."
    - "Das Inkasso hat mich geschickt. Ich schick dich. Nennt sich Delegieren. Auch Feigheit."
    - "Pfände den Wither. Zwei Compacted Diamond Blocks. Falls wer fragt: Wir kennen uns nicht."
  rook_intro:
    - "Hallo, ich bin Rook. Ich bereite Abenteurer auf die Dungeons unter der Insel vor."
    - "Bevor ich jemanden da runterbringe, brauch ich zehn Knochen. Sieh's als Hausaufgabe: Wer hier oben nicht mit Skeletten klarkommt, schafft es da unten auch nicht."
    - "Bring mir die Knochen, und ich erzähl dir alles, was ich übers Überleben im Dungeon weiß."
  gate_warden_intro:
    - "Die Straße hinter diesem Tor ist gesperrt. Der Pfadwächter steht darauf, und keiner kommt an ihm vorbei."
    - "Er ist langsam, er ist geduldig, und er hat schon viele mutige Laufbahnen beendet."
    - "Wenn du glaubst, du bist stark genug, dann geh und bring ihn weg. Wenn nicht, ist es keine Schande, noch etwas zu warten."
  bench_cynic_intro:
    - "Bitte setz dich nicht. Das ist meine Bank, und da bin ich sehr eigen."
    - "Wenn du dich nützlich machen willst, bring mir acht Stück verrottetes Fleisch. Für meine Forschung, und nein, ich erklär's nicht."
    - "Bring sie mir, dann kannst du wieder den Brunnen genießen. Ich bleib hier und genieß gar nichts."
  dust_intro:
    - "Hi! Ich bin Dust. Ich bau und repariere die Wege zwischen der Hauptstadt und überall sonst."
    - "Gerade brauch ich dreißig Bruchstein. Straßen wachsen leider nicht von selbst."
    - "Bring mir die Steine, und ich mach was Gutes draus. Wenn du das nächste Mal irgendwo Schönes langläufst, ist es vielleicht dein eigener Stein."
  fry_gossip_intro:
    - "Hey! Ich hab den Frittierstand, und ich hör alles, was in diesem Hafen passiert."
    - "Neueste Nachricht: Clucksworth sagt, sein Riesenhuhn McNugget ist schon wieder ausgebüxt. Es ist irgendwo auf den Feldern, und es ist riesig."
    - "Falls du es mal besiegst, erzähl's zuerst mir. Ich versprech dir, ich sag's nur allen weiter."
  dock_whisper_intro:
    - "Hallo. Die Leute nennen mich Dock Whisper, weil ich mit dem Wasser rede. Manchmal antwortet es."
    - "Tackle am Pier bringt dir das Angeln bei. An seltenen Tagen leuchtet deine Schnur lila. Das ist ein Mythischer Wasserdrache, und nur du kannst ihn fangen."
    - "Und falls du mal eine seltsame alte Phiole rausziehst: nicht schütteln, nicht öffnen. Bring sie jemandem, der sich auskennt."
  larder_intro:
    - "Hallo! Ich verwalte die Vorratskammer der Hauptstadt, und die ist gerade ziemlich leer."
    - "Ich brauch drei Verdichteten Weizen. Press Weizen vom Feld zusammen, dann bekommst du ihn."
    - "Bring mir drei, dann gibt's einen Booster und ein paar Münzen. Und hungrige Leute danken es dir auch."
  pet_scout_intro:
    - "Hi! Lark verteilt Fangsphären an alle, aber ich will sehen, wer auch damit umgehen kann."
    - "Fang mir ein wildes Schwein mit einer Sphäre. Nur eins, und bitte lebendig, nicht als Abendessen."
    - "Komm wieder, wenn deine Tasche anfängt zu grunzen."
  ore_ledger_intro:
    - "Hallo. Ich grab nicht selbst. Ich führ Buch über alles, was aus diesem Kamm kommt."
    - "Wenn dein Bergbau-Skill Level acht oder höher ist, hab ich Arbeit für dich."
    - "Bring mir fünf Verdichtete Kohle, die echte, dann zahl ich gut und schließe die Bücher für diesen Monat."
  timber_clerk_intro:
    - "Hallo! Ich führ Buch über jeden Baum, der im Ostwald gefällt wird."
    - "Wenn dein Sammeln-Skill Level acht oder höher ist, könnte ich deine Hilfe brauchen."
    - "Bring mir fünf Verdichtete Eichenstämme. Ich zahl dich, und ich sorg dafür, dass für jeden Baum neue gepflanzt werden."
  dock_scaler_intro:
    - "Ich bin der Dock Scaler. Ich wiege jeden Fisch, der in diesen Hafen kommt, und schreib ihn auf."
    - "Wenn dein Angeln-Skill Level zehn oder höher ist, hab ich einen Job für dich."
    - "Bring mir drei Verdichtete Kabeljaue für meine Proben. Ich zahl anständig, und mein Klemmbrett ist endlich glücklich."
  sphere_proctor_intro:
    - "Hallo! Schweine sind was für Anfänger. Ich prüfe den nächsten Schritt: Kühe."
    - "Du brauchst Aetherion-Level fünf, und dann fängst du mir eine Kuh in einer Sphäre. Bitte lebendig."
    - "Schaffst du das, bist du offiziell ein richtiger Fänger. Ich schreib's sogar auf."
  quarry_broker_intro:
    - "Hallo. Ich entscheide, wer in die Baugilde kommt, und ich bin sehr wählerisch."
    - "Du brauchst Aetherion-Level zwanzig, bevor ich dich überhaupt anschaue."
    - "Dann bring mir einen Verdichteten Bruchstein. Nicht gepresst, verdichtet. Der Ziegel beweist, dass du es mit dem Bauen ernst meinst."
  slag_poet_intro:
    - "Hallo! Ich grab am Erzkamm, und in meiner Freizeit schreib ich Gedichte darüber."
    - "Die meisten handeln von Erzadern, die genau dann aufhören, wenn man sich freut. Das passiert oft."
    - "Wenn du hier oben gräbst, folg den Kohleflözen bergab. Und wenn der Berg grollt, geh einen Schritt zurück. Das ist kein Applaus."
  bait_theory_intro:
    - "Ich teste seit elf Jahren Köder an diesem Pier. Würmer, Brot, Käse, alles Mögliche."
    - "Dock Whisper hört aufs Wasser, der Dock Scaler wiegt die Fische, und ich find raus, was sie zum Abendessen wollen."
    - "Mein Rat: Wirf ruhig aus, warte länger, als du denkst, und angle nie schlecht gelaunt. Die Fische merken das."
  stall_crumb_intro:
    - "Frisches Brot! Na ja, das von heute ist frisch. Das von gestern ist billiger."
    - "Ich back jeden Morgen, bevor die Sonne aufgeht. Der ganze Hafen isst meine Brote, sogar der Quartiermeister."
    - "Wenn du zur Arbeit aufbrichst, nimm Brot mit. Hungrige Leute treffen schlechte Entscheidungen."
  stall_tack_intro:
    - "Nägel, Seile, Schnur, Schnallen. Ich verkauf all die Kleinigkeiten, die man vergisst, bis man sie braucht."
    - "Die Bergleute oben am Erzkamm nutzen ihr Werkzeug schnell ab. Die meisten kommen zuerst hier vorbei."
    - "Schau dich ruhig um. Was ich nicht hab, brauchst du wahrscheinlich nicht."
  stall_brine_intro:
    - "Salz für Fisch, Salz für Fleisch, Salz für Suppe. Salz macht alles besser."
    - "Tackle verkauft dir die Angel. Ich verkauf dir den Grund, warum dein Fisch nach etwas schmeckt."
    - "Eine Prise heute Abend auf deinen Fang, und morgen kommst du für ein ganzes Glas wieder."
  # ------------------------------------------------------------ Das Schlaflied (story_<npc>.<beat>)
  # Same beat count as StoryLines.java. Chained ids (a+b) are localized part by part.
  story_town_crier:
    offer_old_tale:
      - "Hört, hört! Heute Abend: der irre König, der den Himmel entzweibrach!"
      - "Nicht von mir. Ich mach Schlagzeilen. §eMütterchen Berit§f erzählt's richtig."
      - "Ihr Häuschen steht am Rand der Capital. Geh vor ihrem Nickerchen."
    remind_old_tale:
      - "Hört, hört! {player} kennt die Geschichte immer noch nicht! Schande!"
      - "§eMütterchen Berit§f. Rand der Capital. Der Kompass weiß Bescheid."
  story_berit:
    before:
      - "Viel zu tun, Liebes? Erledig erst deine Wege."
      - "Ich bin genau hier. Meine Knie bestehen darauf."
    default:
      - "Setz dich, setz dich. Mütterchen Berit. Älteste Frau im Ort, und stolz drauf."
      - "Abends summ ich. Das Lied meiner Oma. Alte Gewohnheit."
      - "Hollis, der Schreier, schickt mir Leute für die alte Geschichte. Frag ihn."
    old_tale_done:
      - "Setz dich, Liebes. Der irre König? Hat den Himmel entzweigebrochen, heißt es."
      - "Dann haben ihn die Glocken fortgeschickt. Hier — Omas altes Märchenbuch."
      - "Sie hat mir dazu ein Schlaflied gesungen. Das Lied hatte nie ein Ende."
    gear_hook:
      - "Komisch nur: Die tiefen Stollen der §eShabby Mine§f summen es nachts."
      - "Was der Hollow Lurker da bewacht, bring's zu §eYsolde§f ins Archiv."
    offer_gear:
      - "Die Kumpel sagen, die tiefen Stollen summen nachts mein Lied. Falsch und langsam."
      - "Irgendwas unten in der §eShabby Mine§f. Hollow Lurker nennen sie's."
      - "Was immer es bewacht, bring's zu §eYsolde§f ins Archiv. Nicht zu mir."
    remind_gear:
      - "Das Summen, Liebes. §eShabby Mine§f, tiefe Stollen. Der Hollow Lurker."
      - "Was er bewacht, geht zu §eYsolde§f ins Archiv."
    after_gear:
      - "Da bist du ja. Ysolde sagt, das Summen war eine Spieldose. Schick."
      - "Oma sagte immer, das Lied kommt aus einem Kästchen. Ich dachte, sie neckt mich."
    forgotten_done:
      - "Oh — hallo, Liebes. Kennen wir uns? Du hast ein freundliches Gesicht."
      - "Ich hab abends immer etwas gesummt. Wie ging das noch…?"
      - "Ach, vergiss mich. Pass auf die Stufe, wenn du gehst. Wer immer du bist."
    stranger:
      - "Hallo, Liebes. Neu hier?"
      - "Ich stell immer eine Lampe ins Fenster. Ich weiß nicht mehr, warum."
  story_ysolde:
    before:
      - "Das Archiv öffnet nicht für Leute, die noch den Hafen lernen."
      - "Mach deine Runden bei §eMiss Ledger§f fertig. Dann komm wieder. Leise."
    default:
      - "Ysolde Thorne. Archivarin. Handschuhe an, wenn du was anfasst."
      - "Legenden sind was für den Schreier. Ich führe Akten. Langweilig und wahr."
      - "Findest du was, das älter ist als die Registry? Bring's mir."
    remind_gear:
      - "Berit schickt dich? Dann bring mir, was der Lurker bewacht."
      - "§eShabby Mine§f, tiefe Stollen. Folg dem Summen."
    gear_done:
      - "Ein Spieldosen-Zahnrad. Messing, von Hand geschnitten. Macht heute keiner mehr."
      - "Hofarbeit. Älter als die erste Seite der Registry. Interessant."
    offer_insignia:
      - "Angenommen, es gab einen König. Könige haben Wachen. Wachen tragen Abzeichen."
      - "§cSkuldugery§f, der brennende Bogenschütze, trägt eins unterm Ruß."
      - "Bring mir das Abzeichen. Dein Kompass findet ihn, solange er unterwegs ist."
    remind_insignia:
      - "Das Abzeichen, {player}. §cSkuldugery§f. Brennende Pfeile, großes Ego."
      - "Der Kompass findet ihn, solange er unterwegs ist. Bring das Abzeichen, nicht ihn."
    insignia_done:
      - "Sun Guard. Echt. Jahrhundertelang poliert, von jemandem, der sonst nichts hatte."
      - "Also: ein König, eine Garde und mindestens ein Mann, der weggerannt ist."
    offer_short_toll:
      - "Die Registry nennt das Glockenläuten 'Brauch'. Bräuche kommen irgendwoher."
      - "§eSister Aurel§f hütet die Sieben Glocken, drüben in der Scholars' Hall."
      - "Frag sie, was sie gezählt hat. Ich will Zahlen, keine Gedichte."
    remind_short_toll:
      - "§eSister Aurel§f, Scholars' Hall. Frag, was sie gezählt hat."
      - "Zahlen, {player}. Bring mir Zahlen."
    after_toll:
      - "Vier Schläge zur Dämmerung, sagt sie? Hab's aufgeschrieben. Zweimal."
      - "Bring mir alles, was älter ist als die Registry. Siegel. Briefe. Fetzen."
      - "Deine Inselurkunde kommt mit Aetherion Level §e20§f. Lies die Ecke."
    old_seal_done:
      - "Eldervale. So hieß dieses Königreich. Die Registry schwört, das gab's nie."
      - "Eine Seite hat überlebt. Ein König namens §fCorvin§f. Gelehrter, kein Soldat."
      - "Jemand hat einen Namen verbrannt. Das tut man nur, wenn er beim Lesen wehtut."
    offer_letters:
      - "In alten Kisten tauchen Briefe auf. Klein gefaltet, gezeichnet 'M'."
      - "Mach unterwegs die Welt-Kisten auf. Drei Briefe. Bring alle drei."
      - "Ich will wissen, wer 'M' war. Die Registry tut, als wüsste sie's nicht."
    letters_hook:
      - "In alten Kisten tauchen Briefe auf, gezeichnet 'M'. Mindestens drei."
      - "Mach unterwegs die Welt-Kisten auf. Bring mir alle drei."
    musing_seal:
      - "Eldervale. Corvin. Ich sag sie immer wieder. Vielleicht werden sie leichter."
    letters_gate:
      - "Die nächste Spur braucht jemand Stärkeren. Aetherion Level §e30§f."
    remind_letters:
      - "Drei Briefe, {player}. Welt-Kisten. Mach alles auf, woran du vorbeikommst."
      - "Versiegelt, gezeichnet 'M'. Lies sie nicht unterwegs. …Du wirst sie lesen."
    letters_done:
      - "Das Siegel im Wachs gehört einer Königin. Ihr Name war §fMaelis§f."
      - "Und eine Tochter. Schau — kleine Sterne am Rand. Der irre König hatte Familie."
    offer_third_anchor:
      - "Unter dem §eFallen Anchor§f gibt's ein Lager. Die führen eigene Akten."
      - "Ihr Sprecher heißt §eHesper Kael§f. Er wird dich nicht mögen. Geh trotzdem."
      - "Frag nach dem dritten Anker. Dann hör mehr zu, als du redest."
    third_anchor_hook:
      - "Lager unter dem §eFallen Anchor§f. Ihr Sprecher heißt §eHesper Kael§f."
      - "Frag ihn nach dem dritten Anker. Er wird dich nicht mögen. Geh trotzdem."
    musing_letters:
      - "Eine Frau. Eine Tochter. Das Märchenbuch hat beide vergessen. Kaum ein Zufall."
    anchor_gate:
      - "Die nächste Spur führt durch raues Land. Komm mit Aetherion Level §e40§f wieder."
    remind_third_anchor:
      - "§eHesper Kael§f. Das Lager unter dem §eFallen Anchor§f, draußen im Westen."
      - "Frag nach dem dritten Anker. Dann lass ihn reden."
    after_anchor:
      - "Du warst bei Hesper. Dann weißt du, was die Registry weggelassen hat."
      - "Sechzehn Liegeplätze in den alten Hafenplänen. Ich hab selbst gezählt."
      - "In den Hafengassen vergessen Leute Dinge. Halt die Ohren offen."
    offer_silent_road:
      - "Berit kennt dich nicht mehr? Dann ist es zurück. Die alte Krankheit: das Verblassen."
      - "Der Rat hat die Königsstraße versiegelt. Der §cPathwarden§f bewacht sie noch."
      - "Töte den Wächter. Bring mir das Schreiben, das er trägt. Der Kompass findet ihn."
    musing_fading:
      - "Leute, die ihre eigene Haustür vergessen. Die alten Bücher hatten ein Wort dafür."
    road_gate:
      - "Werd stärker, {player}. Aetherion Level §e60§f. Dann öffnen wir die Straße."
    remind_silent_road:
      - "Der §cPathwarden§f, {player}. Die Königsstraße. Der Kompass findet ihn."
      - "Bring das Schreiben. Brich das Wachs nicht. Das will ich selbst."
    silent_road_done:
      - "'Niemand gehe zu ihm. Niemand gehe von ihm.' Gezeichnet: der Rat."
      - "Ein Name ist Thorne. Meine Urgroßmutter hat ihn aus den Büchern gestrichen."
      - "Die Straße endet an einem alten Kai im Nebel. §fDer Veil Quay§f. Er ist jetzt offen."
    after_road:
      - "Ich behalte das Schreiben. Die Registry kann mich drum bitten. Höflich."
      - "Der Veil Quay gehört dir. Die Fähre ist was anderes. Level §e75§f."
  story_isle_clerk:
    offer_old_seal:
      - "Deine Inselpapiere sind da. Altes Siegel in der Ecke. Ignorier es."
      - "…Du liest es. Schön. 'Königreich Eldervale.' Nie gehört."
      - "Bring's zu §eYsolde§f ins Archiv. Sie sammelt alte Tinte. Ich sammle nichts."
    remind_old_seal:
      - "Das Siegel, {player}. §eYsolde§f, Archiv. Nicht ich. Niemals ich."
  story_bellkeeper:
    short_toll_done:
      - "Morgens drei Schläge. Abends fünf. War schon immer so, Liebes."
      - "Gestern Abend waren's vier. Ich hab zweimal gezählt. Dann ein drittes Mal."
      - "Sonst hat's keiner gemerkt. Sag's deiner Archivarin. Sie will die Zahl."
  story_hesper:
    before:
      - "Das Lager nimmt keine Besucher, die noch den Hafen lernen."
      - "Bring deine Einweisung zu Ende. Dann komm runter, wenn's sein muss."
    default:
      - "Hesper Kael. Ich spreche für das Lager unter dem Anker."
      - "Touristen starren auf den kaputten Liegeplatz. Du starrst auf mich."
      - "Starr auf den Liegeplatz. Ist einfacher."
    third_anchor_done:
      - "Du kommst wegen des Königs. Alle von da oben kommen wegen des Königs."
      - "Sechzehn Welten lagen hier vertäut. Er hat die Ketten gekappt. Meine fiel."
      - "Du hast die Briefe seiner Frau gelesen? Gut. Trauer ist keine Begnadigung."
    after:
      - "Du hast zugehört. Das tun die wenigsten."
      - "An ihm ändert das nichts. Denk dran, wenn die Geschichte traurig wird."
  story_nell:
    before:
      - "Hi! Mama sagt, ich darf keine Leute stören, die noch beschäftigt sind."
      - "Bist du noch beschäftigt? Du siehst beschäftigt aus."
    default:
      - "Hi. Ich bin Nell. Ich kann alle sieben Glocken. Hör mal: hmm, hmm, hmmm…"
      - "Mütterchen Berit hat's mir beigebracht. Das Lied hört mittendrin auf. Ist normal."
      - "Ich hab keine Angst im Dunkeln. Ich mag nur Lampen. Sehr."
    offer_forgotten:
      - "Mütterchen Berit hat gestern Abend ihre Lampe nicht angemacht. Macht sie sonst immer."
      - "Heute früh hat sie mich 'kleines Fräulein' genannt. So nennt sie mich nie."
      - "Kannst du nach ihr sehen? Ihr Häuschen, am Rand der Capital. Bitte?"
    wait:
      - "Mütterchen Berits Lampe ist komisch. Mama sagt, das ist nichts."
      - "Mama sagt auch, nur richtig starke Erwachsene helfen. So Level-§e50§f-stark."
    remind_forgotten:
      - "Hast du sie gesehen? Das Häuschen am Rand der Capital."
      - "Ihre Lampe ist immer noch aus. Ich hab die Fenster zweimal gezählt."
    after:
      - "Geht's ihr gut? Sie meinte, ich hab einen hübschen Namen. Sie kennt meinen Namen."
      - "Ich hab ihre Lampe für sie angemacht. Wick hat mir gezeigt, wie."
  story_ferryman:
    before:
      - "Heute keine Fahrgäste. Erledig erst deine Sachen im Hafen."
    default:
      - "Fähre! Fähre zum — hm. Wohin ging die noch gleich?"
      - "Die Straße ist lange zu. Du bist sie trotzdem gelaufen?"
      - "Heute keine Fahrgäste. Der Nebel sagt nein. Der Nebel sagt immer nein."
    waiting:
      - "Ein Fahrgast? Der erste seit… einer Weile. Einer langen Weile."
      - "Der Nebel ist nicht bereit für dich. Das Boot, ehrlich gesagt, auch nicht."
      - "Komm mit Aetherion Level §e75§f wieder. Der Nebel mag runde Zahlen."
    soon:
      - "Der Nebel ist heute dünner. Nicht dünn genug."
      - "Bald. Das Ruder will dauernd benutzt werden."
      - "Komm bald wieder. Bis dahin weiß ich den Weg wieder."
    offer_ferry:
      - "Ein Fahrgast. Sogar mit Schreiben. Der Nebel ist heute dünn genug."
      - "Steig auf die Fähre und läute die Glocke. Einmal. Das zählt."
      - "Wir sehen uns auf der anderen Seite. Ich bin immer auf der anderen Seite."
    remind_ferry:
      - "An Bord, {player}. Einmal läuten, oder einfach auf dem Deck stehen und warten."
      - "Der Nebel wartet nicht. Na ja. Er schon. Ich nicht."
    ferry_done:
      - "Hab ich doch gesagt. Irgendwie immer auf dieser Seite."
      - "Der Königskai. Seit dem Jahr des Schweigens hat hier keiner mehr festgemacht."
      - "Der Lift an der Kaimauer fährt hoch zur Hofstadt. Zieh den Hebel. Der beißt."
    captain_hook:
      - "Hinter der Hofstadt liegt ein Krater, mit Eisen umringt. Da ist etwas brennend hineingefallen."
      - "Am Ring steht noch ein Wachposten. Der will hören, dass es aus ist."
    offer_captain:
      - "Hinter der Hofstadt ist etwas in den Krater gefallen. Es brennt noch."
      - "Ein Eisenring drumherum, und ein Wachposten, der nie gegangen ist. Lösch das Feuer."
    remind_captain:
      - "Der Krater, {player}. Mit dem Lift hoch, durch die Hofstadt, nach Süden. Der Eisenring."
      - "Mittendrin steht sein Schwert. Es wartet auf einen Befehl."
    exile_default:
      - "Der Lift ist an der Kaimauer. Die Hofstadt liegt oben. Ich bleib beim Boot."
      - "Willst du zurück? Sag einfach Bescheid. Der Nebel mag Hin und Zurück."
  story_exile_sentry:
    default:
      - "Hier kommt keiner durch. Befehl vom Hauptmann."
      - "…Der Hauptmann ist da drin. Schon eine ganze Weile."
      - "Rechtsklick aufs Gitter, wenn's sein muss. Ich hab dich nicht gesehen. Ich seh nie wen."
    remind_captain:
      - "Brennt immer noch. Ich spür's durch die Stiefel."
      - "Sein Schwert steckt mitten im Krater. Gib ihm den Befehl. Er antwortet."
    captain_done:
      - "Still. Zum ersten Mal seit… ich weiß nicht, wie lange."
      - "Er hat dem König nein gesagt, weißt du. Am dritten Anker. Ich hab's gehört."
      - "Abgelöst. Das ist das Wort. Vom Dienst abgelöst."
  story_orrin:
    default:
      - "Orrin. Hofingenieur. Im Ruhestand, eigentlich. Der Stern sieht das anders."
      - "Bitte nicht den Ring anfassen. Der ist auf einen Herzschlag geeicht."
    offer_heart:
      - "Du bist gekommen, um ihr Herz anzuhalten. Ich weiß. Ich weiß seit tausend Jahren, dass jemand kommt."
      - "Ich hab der Königin versprochen, es schlagen zu lassen, bis er zurückkommt. Er ist nicht zurückgekommen."
      - "Geh. Bitte. …Nein? Dann nimmt dich der Ring. Ich bin auf der anderen Seite."
    remind_heart:
      - "Der Ring ist jetzt offen für dich. Mir wär's anders lieber."
      - "Dann geh. Ich warte da, wo das Licht ist."
  story_exile_usher:
    default:
      - "Karten? Karten hat keiner mehr. Jeder Platz ist besetzt."
      - "Die Vorstellung hört nie auf. Mein Herr. Meine Dame. Wer auch immer."
    remind_heart:
      - "Erst das Observatorium, glaub ich. Das Siegel der Königin öffnet diese Tür richtig."
    heart_done:
      - "Du trägst einen Brief. Mit ihrem Siegel. Das würd ich überall erkennen."
      - "Die Türen erinnern sich an die Königin. Ich auch. Ein bisschen."
    doll_hook:
      - "Auf der Bühne steht eine Spieluhr. Zieh sie auf, dann fängt sie an."
      - "Bleib bis zum Schluss. Dann erzähl mir, wie es ausgeht."
    offer_doll:
      - "Auf der Bühne steht eine Spieluhr. Zieh sie auf, dann fängt sie an."
      - "Sitz alles durch. Dann erzähl mir, wie es ausgeht. Es geht nie aus."
    remind_doll:
      - "Die Spieluhr, vorne an der Bühne. Pass auf die Fäden auf. Die gehören nicht mehr ihr."
    doll_done:
      - "Es ist zu Ende? Es ist wirklich zu Ende."
      - "Sie hat das Kind gehalten. Oder? Sonst war ja keiner da."
      - "Der Gärtnerjunge wartet bei den Wurzeln. Er will wissen, dass das Theater still ist."
  story_exile_gardener:
    default:
      - "Nicht auf die Beete treten. Da wird er sauer."
      - "Er ist kein Er. Er ist ein Golem. Er gießt alles. Sogar die Steine."
    offer_seed:
      - "Unter dem Garten ist ein Loch. Der Schlund. Da drin frisst etwas."
      - "Er ist da unten und bewacht es. Er hat nie aufgehört. Bitte mach, dass es aufhört zu fressen."
    remind_seed:
      - "Der Schlund ist am Ende des Wegs. Horch am Tor. Du hörst es kauen."
    seed_done:
      - "Es hat aufgehört. Der Boden ist… nur noch Boden."
      - "Er ist wieder hochgekommen. Er gießt schon wieder die Steine."
      - "Die Tore vom Schloss sind das Letzte, was noch zu ist. Vielleicht hören die jetzt zu."
  story_exile_lamplighter:
    default:
      - "Zweihundertzwölf Lampen. Jeden Abend. Ich bin spät dran."
      - "Hinter dir der Lift, vor dir die Hofstadt. Überall Türen. Frag ruhig."
  story_exile_mother:
    default:
      - "Wir müssen vor der Abendglocke weg sein. Hast du ihren anderen Schuh gesehen?"
      - "Sie versteckt sich immer. Meistens unter der Treppe. Heute nicht."
  story_exile_keeper:
    default:
      - "Die Letzte Glocke hat offen. Immer offen. Keiner trinkt."
      - "Setz dich ruhig. Die Stühle erinnern sich an Leute."

  # Origin island cast (SAITAMA pass)
  harbourmaster_intro:
    - "Quill. Tallymann. Jede Kiste von diesem Pier steht in meinem Buch. Und alles, was vorbeifliegt."
    - "Behalt den Nordrand im Auge — wenn die §bHalcyon§f einläuft, bleibt der ganze Hafen stehen und guckt."
    - "Neu hier? Erst §eEgon§f auf dem Pier. Danach komm wieder, dann find ich was Nützliches für dich."
  crane_hand_intro:
    - "Haul. Ich bewege, was die Halcyon bringt und was die Boote vergessen."
    - "Der Stapel geht auf den Kahn, der Kahn geht zum Markt, der Markt geht in deine Taschen."
    - "Helfen? Nicht unter dem Haken stehen. Das ist der ganze Job."
  lighthouse_keeper_intro:
    - "Moll. Ich halte das Leuchtfeuer am Brennen — vierzig Jahre, eine Möwe vom Frieden entfernt."
    - "Das Vieh hat meine Brille geklaut. Mir direkt von der Nase gerissen."
    - "Sie mag hohe Plätze. Je höher, desto frecher."
  shanty_busker_intro:
    - "Tobin. Straßenmusiker, Lügner, gelegentlich im Takt."
    - "Ich schreibe das Hafen-Shanty, und mir fehlt die Tonart."
    - "Die Hafenglocken kennen sie. Sie wollen sie mir nur nicht vorsummen."
  beekeeper_intro:
    - "Hettie Comb. Ich halte die Bienen am Alten Methaus."
    - "Meine Königin ist heute früh mit einem Schwarm ausgeflogen. Zu den Riesenblumen, die Angeberin."
    - "Pass auf die Stöcke auf dem Weg rein auf. Die sind netter, als sie klingen."
  painter_intro:
    - "Fenna. Ich male, wie die Insel aussieht, wenn keiner hinschaut."
    - "Ich hab eine Skizze verloren — drei Orte, ein Bild. Ich weiß nicht mehr, wo ich saß."
    - "Eine Brücke über träges Wasser. Ein See voller Seerosen. Ein Schrein unter alten Bäumen. Kommt dir das bekannt vor?"
  hermit_intro:
    - "Hallo, Reisender. Ich bin Moss. Früher hab ich in der Hauptstadt gewohnt, jetzt wohn ich unter diesen Bäumen."
    - "Die meisten hetzen durch den Flüsterwald, ohne ihm je richtig zuzuhören."
    - "Wenn du magst, setz dich mal eine Minute zu mir. Du wärst überrascht, was man alles hören kann."
  bookie_intro:
    - "Odds Mulligan. Sport. Beine. Wetten auf beides."
    - "Das Bergtor liegt im Norden, hinter dem Brunnen und der Großen Treppe."
    - "Berühr es und sei in drei Minuten zurück, dann zahl ich doppelt. Schaffst du's nicht … kriegst du nichts. Charakter vielleicht."
  mushroom_forager_intro:
    - "Cap. Ich sammle. Meistens Pilze, manchmal Ärger."
    - "Nachts fangen drei der Riesenpilze hier an zu leuchten."
    - "Find alle drei vor dem Morgen, dann teil ich meinen Geheimeintopf. Den willst du nicht. Du willst die Münzen."
  lost_tourist_intro:
    - "Pim Whistledown! Tourist. Profi. Ich bin wegen des Gipfels von Skyreach hier."
    - "Ich stehe seit drei Tagen an diesem Brunnen."
    - "Alle sagen 'geh einfach hoch'. Hoch ist eine sehr große Richtung."

completed:
  default:
    - "Wir sind quitt. Sagt das Klemmbrett."
    - "Geh und mach jemand anderem den Tag ein bisschen schlechter."
  egon:
    default:
      - "Passt das Kit? Gut. Sag's mir nicht, wenn nicht."
      - "Der §eQuartermaster§f hinter dem kleinen Markt will dich als Nächstes."
      - "§eGelber Pfeil oben§f. Trau ihm mehr als mir."
    after_coal:
      - "Hält das Kit, {player}? Gut. Sag's mir nicht, wenn nicht."
      - "Am Pier ist Ruhe. §bTackle§f angelt ganz vorne, falls du 'ne Rute willst."
  lumberjack:
    - "Egon hat seine Eiche? Gut. Behalt die Axt. Sie mag dich."
    - "Mal 'nen Nachmittag frei? §aTwigs§f Schleim-Pad ist gleich hinter mir. Forage Isle."
  quartermaster:
    - "Kohle abgeheftet, {player}. Der Mines-Teleport bleibt offen — §e/mines§f."
    - "Einmal hinlaufen, dann gehört's dir. §e/spawns§f listet alles."
    - "Der Foreman wohnt immer noch an den Minen. Freiwillig, angeblich."
  craftsman:
    default:
      - "Schöne Spitzhacke, {player}. Du bist bereit für die Minen."
      - "Als Nächstes: §eShaft Foreman§f. Das Recipe Book griffbereit halten — später kommen neue Seiten."
    after_shift:
      - "Hm. {player}. Hält die Spitzhacke? Gut."
      - "Das Recipe Book wächst mit dir. Schau ab und zu rein."
  foreman:
    default:
      - "Schicht ist zu. Als Nächstes: §eTemper§f, auf dem Weg zur Capital."
      - "Ein Booster fusen, dann Skills. Vertrau der Reihenfolge."
    after_boost:
      - "Die Mine ist noch da, {player}. Der Staub auch."
      - "Tiefere Adern zahlen besser. Tiefere Adern beißen auch."
  booster_tutor:
    default:
      - "Booster gefust. Rezepte bleiben jederzeit im §eRecipe Book§f."
      - "Als Nächstes: §eMiss Ledger§f in der Capital — Skills. Dann die Felder."
    after_skills:
      - "In letzter Zeit was Scharfes gefust, {player}?"
      - "Der Anvil ist immer im Manager. Rezepte im §eRecipe Book§f."
  ledger:
    - "Skill sitzt. Gut. Gestempelt."
    - "Als Nächstes: die Felder — §eFarmer§f (Weizen) und §eLark§f (Pets), gleiche Ecke."
    - "Komm nach beiden zurück, {player}. Ich schließe die Orientierung — und hab einen Hilfeschalter."
  farmer:
    default:
      - "Weizen erledigt. Die Vögel schmollen. Gute Arbeit, {player}."
      - "Mach §eLark§f fertig, falls noch offen, dann §eMiss Ledger§f — oder §e/capital§f."
    lark_done:
      - "Weizen erledigt. Die Vögel schmollen. Gute Arbeit, {player}."
      - "Zurück zu §eMiss Ledger§f für den Stempel — oder §e/capital§f, wenn du den Weg kennst."
    graduate:
      - "Die Vögel sind zurück. Du auch. Gut, {player}."
      - "Farm Isle? §eHarlow§f, hinteres Ende der Scheune. Der kennt den Weg runter."
  lark:
    default:
      - "Fang erledigt. Dein Pet mag dich. Wahrscheinlich."
      - "§eMiss Ledger§f schließt die Orientierung — §e/capital§f, wenn du faul bist. Fragen an sie."
    graduate:
      - "{player}! Dein Pet mag dich immer noch. Pistachio ist eifersüchtig."
      - "Wilde laufen über die Felder. Fang mehr, wenn du neugierig bist."
  fisher:
    - "Fang gezählt. Leine frei. Meer noch voll."
    - "Guck dir mal deine Rute an — manche Tools leveln hier."
  fishmonger:
    - "Shop ist offen. Sprich mich an, wenn du stöbern willst."
  vex:
    - "Lektion Stahl: bestanden. Form: fragwürdig. Akzeptabel."
    - "Combat-Set und Booster vor dem härteren Ödland. Dann §cRite Warden§f, wenn du Bosse willst."
  surveyor:
    - "Der Tisch bleibt offen. Sammlung oben, unten eine Blaupause ins Tool stempeln."
    - "Trolle kriechen durch jede Ader in dieser Mine. Grab, wenn du Seiten willst."
  merchant:
    - "Die Kisten bleiben frei, {player}. Probe neben mir, mehr draußen in der Welt."
    - "Seltenere Kiste, besseres Loot. Mach alles auf. Trau nichts."
  canopy_clerk:
    - "Proben abgeheftet. Eiche, Birke, Fichte — vom Blätterdach genehmigt."
    - "Komm wieder, wenn die Insel einen vierten Baum erfindet, {player}. Bis dahin: hacken."
  hunter:
    - "Erstes Blut abgeheftet. Werd nicht sentimental."
    - "Nächstes Mal größere Probleme mitbringen. Oder leisere Schritte."
  collector:
    - "Glänzendes erhalten. Mein Regal ist selbstgefällig. Du darfst gehen."
    - "Grab tiefer, wenn dir das Urteil der Felsen fehlt."
  miner:
    - "Der Hollow Lurker ist still. Meine Nerven nicht. Danke dafür."
    - "Wenn die Tunnel wieder flüstern, schieb ich's auf deine Schritte."
  chicken_keeper:
    - "McNugget ist erledigt. Der Stall beschwert sich trotzdem."
    - "Sag nichts von Fett. Fry Gossip hört alles."
  tollkeeper:
    - "Maut in Troll bezahlt. Die Brücke ist zufrieden. Weitergehen."
    - "Die nächste Überquerung kostet Charme. Du bist im Minus."
  dockhand:
    - "Tintenvertrag erledigt. Squidward ist wieder ein Gerücht. Gut."
    - "Der Steg bleibt nass. Meine Geduld dünn. Lass beides in Ruhe."
  ash_scout:
    - "Asche abgeheftet. Pfeile gezählt. Skuldugery ist jetzt das Problem von jemand anderem."
    - "Stocher nicht zum Spaß in der Glut. Das ist mein Job. Angeblich."
  colossus_scholar:
    - "Laufender Berg: notiert. These: überfällig. Du: frei."
    - "Wenn er wieder aufsteht, war ich nie hier."
  veil_priest:
    - "Der Schleier hält. Deine Neugier nicht. Zügle sie."
    - "Nyx bewahrt Geheimnisse. Du bewahrst Abstand."
  patch_intern:
    - "Ticket geschlossen. Sir Balthazar gepatcht. Praktikant immer noch unbezahlt."
    - "Bitte bewerten Sie dieses Gespräch: ein Stern, zwei Seufzer."
  void_janitor:
    - "Fundbüro leer. Lobby urteilt. Mopp ist heilig."
    - "Tritt kein Void auf die Fliesen. Hab gerade existenzielle Angst gewachst."
  fuse:
    - "Überstunden verbucht. Sparky ist still. Meine Schicht nicht."
    - "Wenn was funkt: weggehen. Dramatisch."
  claims_adjuster:
    - "Antrag abgelehnt. Dann doch nicht. Bürokratie ist Extremsport."
    - "Wormsworth stempelt. Du gehst. Wunderschönes System."
  repo_agent:
    - "Scheck geplatzt. Dann zurückgeprallt. Audit hat genug gegrinst."
    - "Nächstes Mal weniger Schuldscheine. Mehr Würde."
  rook:
    - "Knochen geliefert. Lehrplan zerkaut. Unterricht beendet."
    - "Rook hebt Quittungen auf. Du hältst Abstand."
  gate_warden:
    - "Straße offen. Tor gelangweilt. Nicht rumlungern wie ein Tourist."
    - "Gesperrte Straßen öffnen sich für Leute, die Jobs erledigen. So wie du."
  bench_cynic:
    - "Fleisch erforscht. Ansprüche verfehlt. Bank weiter besetzt."
    - "Nicht hinsetzen. Die Enttäuschung ist reserviert."
  dust:
    - "Bruchstein gestapelt. Ehrgeiz kurz weniger staubig. Weiter."
    - "Karten können warten. Deine Füße nicht."
  larder:
    - "Speisekammer weniger tragisch. Weizen komprimiert. Ego aufgeblasen. Fertig."
    - "Komm hungrig wieder, nicht nostalgisch."
  pet_scout:
    - "Schweinebeweis akzeptiert. Tasche quiekt noch. Stolz auf dich. Mäßig."
    - "Nächster Fang: höher zielen. Wörtlich. Kühe haben Höhe."
  ore_ledger:
    - "Kohleprüfung abgeschlossen. Zahlen haben sich benommen. Wunder notiert."
    - "Keine Quittungen fälschen. Hat der Berg schon versucht."
  timber_clerk:
    - "Stumpfzählung abgeschlossen. Wald ruhiger. Klemmbrett glücklicher."
    - "Nur versteuertes Holz. Unversteuertes Holz ist ein Lebensstil, den ich nicht unterstütze."
  dock_scaler:
    - "Schuppenprobe abgeheftet. Kabeljau komprimiert. Klemmbrett noch nass. Passt."
    - "Nächstes Mal Fische, die Maßeinheiten respektieren."
  sphere_proctor:
    - "Rinderakte geschlossen. Kuh in Gewahrsam. Zwischenprüfung: bestanden."
    - "Keine Steakwitze. Kenn ich alle. Schlecht erzählt."
  quarry_broker:
    - "Gildenziegel erhalten. Club-nah. Handschlag imaginär."
    - "Compacted heißt compacted. Komm wieder, wenn du's vergisst — trau dich."

