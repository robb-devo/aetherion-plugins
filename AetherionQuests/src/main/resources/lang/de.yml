    - "Als Nächstes: die Felder — §eFarmer§f (Weizen) und §eLark§f (Pets), gleiche Area."
    - "Komm nach beiden zurück. Ich schließe das Tutorial — und ich hab ein Hilfemenü, wenn du's brauchst."
  farmer:
    - "Weizen erledigt. Gute Arbeit."
    - "§eLark§f fertig machen, falls noch offen — dann §eMiss Ledger§f, oder §e/capital§f."
  lark:
    - "Fang erledigt. Pets sind klar."
    - "§eMiss Ledger§f schließt die Orientierung — oder §e/capital§f. Fragen an ihren Schreibtisch."
  vex:
    - "Zehn erledigt. Stahl abgeheftet. Du bist weniger ein Risiko."
    - "Kleiner Tipp — Combat-Set und Boosters, bevor's härter wird."
    - "Willst Bosse? Rite Warden im Ödland. Oder lass. Die Map gehört dir."
  fisher:
    - "Fang gezählt. Leine klar."
    - "Schau dir irgendwann die Rute an — manches Tool hier levelt."
  merchant:
    - "Kisten bleiben frei. Sample neben mir, mehr draußen. Seltenere Kiste, besseres Loot."
  surveyor:
    - "Schreibtisch bleibt offen. Sammlung oben, Blaupause unten ins Tool stempeln."
    - "Trolle kriechen jede Ader in dieser Mine. Grab, wenn du Seiten willst."
  canopy_clerk:
    - "Samples abgeheftet. Eiche, Birke, Fichte — Canopy sagt ja."
    - "Komm zurück, wenn die Insel einen vierten Baum erfindet. Bis dahin: hacken."

