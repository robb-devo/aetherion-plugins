  fishmonger:
    pass_ok: "Pass passt."
    shop_open: "Der Shop ist offen für T1-Gear — Rute und Rüstung. Sprich mich an, wenn du stöbern willst."
    lesson: "Willst du Tackles Angelstunde? Kauf hier 'ne Rute, dann zurück zu ihm."
  vex:
    ten_down: "Zehn erledigt, {player}. Stahl abgeheftet. Du bist weniger ein Risiko."
    tip_fallback: "§7Kleiner Tipp — Combat-Set und Booster aufrüsten, bevor's ins härtere Ödland geht."
    rite_fallback: "Loser Faden — §cRite Warden§f im Ödland, für Bosse. Oder nicht. Die Karte gehört dir."
    gear_tip: "§7Kleiner Tipp — härte dein Gear, bevor du tiefer gehst. Recipe Book und Anvil helfen."
