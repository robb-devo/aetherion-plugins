quests:
  welcome_aboard:
    title: "Willkommen an Bord"
    description: "Sprich mit dem Forager oben am Hügel über Anker Harbour."
  gather_wood:
    title: "Egons Holzlauf"
    description: "Hack Eiche mit der Axt vom Forager und bring Egon 10 Stämme."
  forge_coal:
    title: "Kohle für die Schmiede"
    description: "Bring dem Quartermaster 20 Kohle vom Ore Ridge."
  first_shift:
    title: "Erste Schicht"
    description: "Bau 32 Erze in der Shabby Mine ab und melde dich beim Shaft Foreman."
  first_hunt:
    title: "Erste Jagd"
    description: "Hilf, den Hof von ein paar Tieren zu befreien."
  farm_hand:
    title: "Feldarbeit"
    description: "Ernte Weizen auf den Feldern. Lark hat seine Sammlung gleich nebenan."
  a_simple_craft:
    title: "Zweites Rezept"
    description: "Öffne das §agrüne Recipe Book§7 im Manager und crafte eine §fMining Pickaxe§7 — Simple Pickaxe in die Mitte, Kohle drumherum."
  shiny_things:
    title: "Glänzendes"
    description: "Bau drei Diamanten ab."
  a_good_catch:
    title: "Ein guter Fang"
    description: "Fang fünf Fische."
  dock_pass:
    title: "Dock-Pass"
    description: "Hol dir bei Tackle am Steg einen Shop-Pass und geh zurück zum Fishmonger."
  open_up:
    title: "Aufmachen"
    description: "Öffne die Probekiste des Merchants."
  pocket_zoo:
    title: "Taschenzoo"
    description: "Fang mit einer Catch Sphere ein wildes Pet für Lark, sprich mit ihm und rüste es im Manager aus."
  those_sounds:
    title: "Diese Geräusche"
    description: "Finde die Quelle der Geräusche und erledige den Hollow Lurker."
  poultry_problem:
    title: "Geflügelproblem"
    description: "Finde McNugget und steck das Riesenhuhn zurück in den Eimer."
  troll_toll:
    title: "Trollmaut"
    description: "Überquer die Brücke. Überleb den Troll. Behalt das Wechselgeld."
  ink_contract:
    title: "Tintenvertrag"
    description: "Tauch nach Squidward und komm mit weniger Tentakeln zurück."
  ash_and_arrows:
    title: "Asche und Pfeile"
    description: "Jag Skuldugery, bevor die Feuersalve dich jagt."
  walking_mountain:
    title: "Wandelnder Berg"
    description: "Bring den Aether Colossus zu Fall. Lass dich nicht zertreten."
  the_veil:
    title: "Der Schleier"
    description: "Fordere Aetherion im Dungeon heraus. Unterhalte es — oder werd eine Fußnote."
  open_ticket:
    title: "Offenes Ticket"
    description: "Schließ Sir Balthazar. Endgültig. Der Support tut so, als wär das der Plan gewesen."
  lost_and_found:
    title: "Fundbüro"
    description: "Zieh dem Lobby Cleaner den Stecker, bevor er den Rest des Servers als Müll ablegt."
  overtime:
    title: "Überstunden"
    description: "Stempel Sparky aus. Der Gildensteinbruch hat sein Blitzbudget überzogen."
  denied_claim:
    title: "Abgelehnter Antrag"
    description: "Regel das mit Baron von Wurm. Die Spitzhacken-Versicherung hat schon nein gesagt."
  bounced_check:
    title: "Geplatzter Scheck"
    description: "Pfände den Insolvent Wither. Bring das Hauptbuch zurück, zur Not in Stücken."
  closed_road:
    title: "Gesperrte Straße"
    description: "Der Pathwarden ist die Straßensperre. Beweg ihn. Oder werd ein neues Wahrzeichen."
  lesson_steel:
    title: "Lektion: Stahl"
    description: "Sergeant Vex will zehn Feinde in den Borderlands erledigt sehen. Endgültig."
  lesson_boost:
    title: "Lektion: Boost"
    description: "Temper will einen Booster auf deinem Gear sehen — gefust am Anvil im Manager."
  border_rites:
    title: "Border-Riten"
    description: "Spirit-Fläschchen farmen, am Pulver-Altar zünden — ein Borderlands-Boss."
  lesson_manager:
    title: "Lektion: Skills"
    description: "Miss Ledger will, dass du im Aetherion Manager einen Skill ausrüstest."
  lesson_bones:
    title: "Lektion: Dungeons"
    description: "Rook will zehn Knochen. Dungeon-Hausaufgaben ohne Dungeon."
  sidewalk_survey:
    title: "Gehweg-Gutachten"
    description: "Der Bench Cynic braucht acht verrottetes Fleisch für 'Forschung'. Frag nicht."
  gravel_ambition:
    title: "Kies-Ehrgeiz"
    description: "Dust will dreißig Bruchstein. Die Karte kann warten. Die Straße nicht."
  pantry_run:
    title: "Vorratslauf"
    description: "Larder will drei Compressed Wheat. Farm-Weizen komprimieren, dann abliefern."
  pig_in_a_poke:
    title: "Die Sau im Sack"
    description: "Pet Scout will Beweise, dass du fangen kannst. Fang ein wildes Schwein mit einer Catch Sphere."
  coal_audit:
    title: "Kohleprüfung"
    description: "Ore Ledger will fünf Compressed Coal. Bring Belege, keine Ausreden."
  stump_census:
    title: "Stumpfzählung"
    description: "Timber Clerk braucht fünf Compressed Oak Logs. Bäume, die Steuern gezahlt haben."
  canopy_sample:
    title: "Kronenprobe"
    description: "Canopy Clerk will je ein Compressed Oak, Birch und Spruce. Nur Inselholz zählt als Beweis."
  scale_sample:
    title: "Schuppenprobe"
    description: "Dock Scaler will drei Compressed Cod. Das Klemmbrett ist schon nass."
  bovine_brief:
    title: "Rinderakte"
    description: "Sphere Proctor will eine Kuh in einer Sphere. Keine Milch. Kein Steak. Gewahrsam."
  guild_brick:
    title: "Gildenziegel"
    description: "Quarry Broker tauscht einen Compacted Cobblestone gegen Club-nahen Respekt."

dialogs:
  # ---------------------------------------------------------------- gates
  fishing_before_egon:
    - "Moment. Erst Egon fertig machen — dann reden wir übers Angeln."
  tutorial_blocked:
    - "Noch nicht, {player}. Dieser Schalter öffnet nach der Orientierung."
    - "Hafen → Mine → Temper → Miss Ledger → Felder. Dann bist du frei."
  ledger_blocked:
    - "Zu früh, {player}. Skills bleiben zu, bis die Minenschicht durch ist."
    - "§eShaft Foreman§f, an den Minen. Schicht fertig machen, dann zurückkommen."
    - "Dann öffne ich den Skills-Tab. Keine Minute früher."

  # ---------------------------------------------------------------- Harbour spine
  egon_intro:
    - "{player}, richtig? Egon. Ich rüste Rookies aus. Du siehst aus wie einer."
    - "Das Kit kostet zehn Eichenstämme. Der §eLumberjack§f am Hügel leiht dir die Axt."
    - "Nennt sich Forager. Lass ihm den Spaß."
    - "Der §egelbe Pfeil oben§f kennt den Weg. Das Glitzern auf den Planken ist von mir."
  egon_arrival_call:
    - "Hey — neues Gesicht! Hier drüben, beim grünen Leuchten."
  egon_greet_near:
    - "Das bin ich. Rechtsklick — ich beiße nicht, ich rüste aus."
  egon_kit_handoff:
    - "Zehn Stämme. Zweimal gezählt. Hier ist dein Kit — Spitzhacke, Schwert, Hacke, Rüstung."
    - "Die Rüstung ist gebraucht. Vorbesitzer ist in Rente. Größtenteils friedlich."
    - "Der §eQuartermaster§f sitzt hinter dem kleinen Markt. Na los, {player}."
  lumberjack_intro:
    - "Egon braucht Eiche. Schon wieder. Der Mann frisst Planken, ich schwör's."
    - "Simple Axe. Linksklick auf einen §eleuchtenden Stamm§f — das startet die Chop-Leiste."
    - "Grünes §aCHOP§f? Nochmal Linksklick. Verpasst? Baum setzt zurück. Bäume sind nachtragend."
    - "Zehn Eichenstämme → §eEgon am Pier§f. Nicht zu mir. Ich hab genug."
  quartermaster_intro:
    - "Quartermaster. Ich zähle Dinge. Heute: Kohle."
    - "Zwanzig Stück. §eOre Ridge§f — der Hügel hinter dem kleinen Markt. Offene Adern."
    - "Der §egelbe Pfeil oben§f verfolgt den Auftrag. Ich verfolge dich. Unauffällig."
  craftsman_intro:
    - "Hm. Craftsman. Crafting ist offen — das Recipe Book steckt in deinem Manager."
    - "Nether Star, Hotbar §e9§f → §agrünes Buch§f. Da drin ist jede Blaupause."
    - "Bau eine §fMining Pickaxe§f. Simple Pickaxe in die Mitte, Kohle drumherum."
    - "Bring sie her. Ich versuch, beeindruckt zu gucken."
  foreman_intro:
    default:
      - "Die Shabby Mine ist hinter mir. Schäbig trifft's."
      - "Bau §eKohle, Kupfer, Eisen§f ab. §e32 Erzblöcke§f, dann komm zurück, {player}."
      - "Mining Pickaxe und etwas Rüstung helfen. Das Recipe Book ist im Manager."
    crafting_unlocked:
      - "Die Shabby Mine ist hinter mir. Schäbig trifft's."
      - "Bau §eKohle, Kupfer, Eisen§f ab. §e32 Erzblöcke§f, dann komm zurück, {player}."
      - "Crafting ist jetzt offen. Grünes Recipe Book, im Manager."
      - "Mining Pickaxe und etwas Rüstung helfen da unten."
  booster_tutor_intro:
    - "Temper. Ich fuse Zeug. Booster aufs Gear — Mining Power, Fortune, Damage."
    - "Sag ja, und du kriegst einen Emerald Booster. Einmal fusen. Das ist die Lektion."
    - "Manager → §eAnvil§f. Gear links, Booster rechts. Funken sind normal."
  ledger_intro:
    - "Miss Ledger. Skills — und ich stemple die Orientierung zu, wenn du durch bist."
    - "Hotbar §e9§f → Nether Star → Manager → §dSkills§f. Blinkt. Rüste §eirgendeinen§f Skill aus."
    - "Komm wieder, wenn er sitzt, {player}. Ich halte den Stempel warm."
  farmer_intro:
    default:
      - "Weizen von diesen Feldern. Vögel weg von der Saat. Das ist der Job, {player}."
      - "Ernte, bis du §e48§f Weizen hast. Vögel landen? §eKlick§f drauf — die Bossbar zählt mit."
      - "§eLark§f macht Pets, gleiche Felder. Eigener Job — der Pfeil wandert, wenn's so weit ist."
    lark_done:
      - "Weizen von diesen Feldern. Vögel weg von der Saat. Das ist der Job, {player}."
      - "Ernte, bis du §e48§f Weizen hast. Vögel landen? §eKlick§f drauf — die Bossbar zählt mit."
  lark_intro:
    - "Die Felder sind Jagdgebiet. Wilde Tiere — nicht mein Papagei. Die beißt."
    - "Catch Sphere in die Hand, Tier anschauen, §eRechtsklick§f zum Werfen."
    - "Fang §eeins§f, dann rede mit mir. §eAusrüsten§f kommt danach. Schritt für Schritt."
  fisher_intro:
    - "Auswerfen. Auf den Biss warten. §eREEL§f, wenn die Leiste grün wird."
    - "Fenster verpasst, Fisch weg. Fang §efünf§f, dann komm zurück, {player}."
  fishmonger_intro:
    - "Shop. Ruten. Rüstung. Münzen willkommen."
  vex_intro:
    - "Sergeant Vex. Tor zu den §cBorderlands§f — Ödland hinter der Mauer."
    - "Erste Lektion: zehn Feinde. Husk, Stray, Crawler — mir egal, welche."
    - "Zu hart? Combat-Set aus dem Recipe Book. Booster auf den Anvil."
    - "Und jetzt Abmarsch, {player}."

  # ---------------------------------------------------------------- Borderlands (Hub pass owns these — unchanged)
  rite_keeper_intro:
    - "Rite Warden. Borderlands-Vertrag — T1-Bosse, kein Sightseeing."
    - "Töte Gegner. Spirit-Fläschchen: §c5%§f T1 · §c10%§f Sturdy · §c15%§f Elites. Die §eBeacon-Säule§f ist der Altar."
    - "Rechtsklick auf hellgraues Pulver mit dem Fläschchen. Zehn Sekunden. Donner. Dann läuft er. Einmal töten — Ritus bestanden."
  arena_proctor_intro:
    - "Proctor. Dieser Ring bedeutete mal etwas. Dann wurden die Leute vorsichtig."
    - "Ich hab von Fläschchen alter Borderlands-Bosse gehört — und von einer stärkeren Variante in der Crypt."
    - "Bring mir eins von den stärkeren. Ich will es untersuchen. Vorsichtig. Wahrscheinlich."
  arena_proctor_vial:
    - "Da ist es. Stärker als die Borderlands-Variante."
    - "Komm — wir schauen uns den Ring an. Ich prüfe das Fläschchen unterwegs."
    - "Nicht dran rumschütteln. Und nicht zu nah atmen."
  arena_proctor_self:
    - "Du hast den Spill gesehen. Ich mach keine Encore-Spaziergänge."
    - "Nimm das Fläschchen zur leuchtenden Markierung im Ring. Rechtsklick selbst."
    - "Gleicher Donner. Gleiche zehn Sekunden. Weniger meiner Schritte."
  arena_proctor_done:
    - "Ring ist offen. Crypt-Fläschchen auf die leuchtende Markierung — nicht in meine Hand."
    - "Einmal durchgespielt. Das war der Lehrplan."
    - "Bring ein neues, wenn du eins hast. Oder auch nicht. Der Pathwarden ist nicht wählerisch."

  # ---------------------------------------------------------------- Hub / Capital / isles
  farm_isle_guide_intro:
    - "Das Portal führt zur Farm Isle — geteilte Felder neben der Hub-Farm."
    - "Farming §e10§f zum Betreten. Dasselbe Portal bringt dich zurück."
    - "Der Farmer nebenan hält sich für den echten Farmer. Süß."
  forage_pad_guide_intro:
    - "Schleim-Pad → Forage Isle. Springen. Nicht nachdenken."
    - "Die Bäume da droppen, was sie sind — Fichte ist Fichte, Birke ist Birke."
    - "Der §eCanopy Clerk§f auf der Insel will komprimierte Proben. Folg dem Pfeil, {player}."
  eldervale_welcome_intro:
    - "Willkommen auf Eldervale, {player}."
    - "Bergbauinsel. Tiefes Gestein, dünne Luft."
    - "Vorsicht an der Kante. Den Boden hat noch keiner gefunden."
  eldervale_upgrade_intro:
    - "Blaupausen-Schmiede. Tool plus Upgrade Stone. Das ist der ganze Trick."
    - "Tier II, III, IV — die Steine werden fies teuer. Schnell."
  isle_clerk_intro:
    - "Die eigene Insel gibt's ab Aetherion Level §e20§f."
    - "Nether Star, Slot neun → Island-Tab. Dort claimen. Ich mach keinen Papierkram."
    - "Ein Beamter ohne Papierkram. Ja. Ich weiß."
  merchant_intro:
    - "Welt-Kisten. Nicht nur diese hier — die spawnen überall."
    - "Seltenere Kiste, besseres Loot. Erkunden lohnt sich."
    - "Mit mir reden schaltet sie frei. Die Probekiste steht neben mir, {player}."
  surveyor_intro:
    - "Trolle kriechen jetzt durch die weichen Adern — Kohle, Eisen, Kupfer. Sie droppen Blaupausen."
    - "Bring mir eine Seite, {player}. Ich stemple sie dir hier in ein Tool."
  liquidator_intro:
    - "Kristall-Schalter. Kaufen, verkaufen oder Mats zu Aether Crystals schmelzen."
    - "Crystals gibt's im offiziellen Shop — oder als Level-Belohnung."
  canopy_clerk_intro:
    - "Ich will Inselholz — komprimiert. Keine Hafenreste."
    - "Foraging §e5§f. Dann je ein Compressed Oak, Birch, Spruce."
    - "Drei Proben. Fette Auszahlung. Dann ab zum Hacken, {player}."
  bar_whisper_intro:
    - "Psst. {player}. Unten am Bildschirm — die Leiste. Dein §bAetherion Level§f."
    - "Stats, Unlocks, neue Gebiete… vieles in dieser Welt öffnet sich darüber."
    - "Spiel weiter. Die Leiste merkt sich das."
  vince_intro:
    - "Casino ist direkt hinter mir. Such dir 'ne Maschine. Nicht auf den Filz heulen."
  dungeon_gate_intro:
    - "Das Portal ist das Dungeon Gate. Es bringt dich zum Dungeon-Hub — Instanzen, Etagen, Wächter."
    - "Geh durch, wenn du ausgerüstet bist. Die andere Seite schickt dich zurück in die Capital."
  town_crier_intro:
    - "Hört, hört! {player} naht!"
    - "Hollis. Stadtschreier. Ich brülle Nützliches, damit der Pfeil es nicht muss."
    - "Heutige Meldung: Der §egelbe Pfeil oben§f kennt immer noch den Weg. Jeden Tag. Zuverlässig."
  street_sweeper_intro:
    - "Vorsicht, der Haufen, {player}. Das ist ein ganzer Vormittag Arbeit."
    - "Bram. Ich fege. Rookies verlieren Bruchstein. Bergleute Kies. Alle verlieren Niveau."
    - "Saubere Straße, klarer Kopf. Vor allem saubere Straße."
  lamp_lighter_intro:
    night:
      - "Abend, {player}. Wick. Lampen sind mein Geschäft."
      - "Nachts braucht mich der Hafen. Und die Monster brauchen einen Snack."
      - "Bleib im Licht. Dafür bin ich da."
    day:
      - "Morgen, {player}. Wick. Laternenanzünder."
      - "Tagsüber hab ich frei. Ich poliere Glas und warte auf die Dämmerung."
      - "Such mich nach Sonnenuntergang. Dann wird's interessant."
  living_test_intro:
    - "Wenn du das lesen kannst, funktioniert die Living-NPC-Pipeline."
    - "Spieler-Skin, schaut dich an, kein Glühen. Dorfbewohner bleiben, wie sie sind."
    - "Gib dem Team Bescheid, wenn der Rest migrieren soll."
  rivet_intro:
    - "Stillhalten — wenn die Platte klappert, berechne ich dir das Echo."
    - "Dock Whisper murmelt von Gezeiten. Ich von Bolzen, die beruflich lügen."
    - "Messing will Politur. Eisen will Respekt. Ich will den, der ständig meine Nieten klaut."
    - "Du siehst nützlich aus. Oder zumindest ablenkend senkrecht. Nicht an die frische Farbe lehnen."

  # ---------------------------------------------------------------- world NPCs / boss hunts
  hunter_intro:
    - "Auf dem Hof wird's laut. Zu viele Kühe unterwegs."
    - "Leg fünf von ihnen um."
    - "Komm wieder, wenn's ruhiger ist."
  collector_intro:
    - "Ich mag glänzende Sachen. Du magst Belohnungen. Einfacher Deal."
    - "Bau mir drei Diamanten ab."
  miner_intro:
    - "WOAH!"
    - "Erschreck mich doch nicht so..."
    - "Ich war nur hier und hab friedlich vor mich hin gegraben..."
    - "Aber dann diese Geräusche... AAAH!"
    - "Kannst du nachsehen, woher die kommen? Ich zahl auch gut!"
  chicken_keeper_intro:
    - "Das ist kein Huhn. Das ist ein Logistikfehler mit Federn."
    - "McNugget ist ausgebüxt. Schon wieder."
    - "Wenn du es erledigst, gibt's Münzen. Und zwei Gläser, die ich lieber nicht beschrifte."
  tollkeeper_intro:
    - "Die Brücke ist zu. Der Troll kassiert Maut."
    - "Die Maut ist, wer rüber will."
    - "Hol sie dir zurück."
  dockhand_intro:
    - "Das Wasser schreibt in letzter Zeit seinen Namen auf Leute."
    - "Squidward hat Laune. Tinte, Gift, das volle Programm."
    - "Erledig ihn, bevor der Hafen nach Schreibwarenladen riecht."
  ash_scout_intro:
    - "Siehst du brennende Pfeile, bist du schon zu spät."
    - "Skuldugery mag Publikum. Sei keins."
    - "Bring die Sehne zum Schweigen. Ich tu so, als wär das ein Plan."
  colossus_scholar_intro:
    - "Er läuft. Das ist die ganze These."
    - "Der Aether Colossus ist keine Metapher. Leider."
    - "Wirf ihn um. Ich zitiere dich als Primärquelle."
  veil_priest_intro:
    - "Aetherion langweilt sich. Das ist ein Wetterbericht."
    - "Es will einen Herausforderer. Du wirkst… verfügbar."
    - "Gewinn, und ich zahl dich, als wolltest du überleben. Verlier, und es kriegt eine Geschichte."
  patch_intern_intro:
    - "Willkommen beim Support. Ihre geschätzte Wartezeit: Sir Balthazar."
    - "Er hat die letzten drei eingefroren, die nach dem Status gefragt haben. Höflich."
    - "Schließ das Ticket. Endgültig. Ich zahl in Diamantblöcken, damit du aufhörst zu mailen."
  void_janitor_intro:
    - "Die Lobby ist ein Tatort. Die Tat: Müll."
    - "Der Lobby Cleaner hat drei Praktikanten und ein Gerücht eingesaugt. Frag nicht, was lauter war."
    - "Zieh ihm den Stecker. Zwei Compacted Diamond Blocks. Aus dem Fundbüro. Natürlich."
  fuse_intro:
    - "Sparky ist Mitarbeiter des Monats. Keiner hat abgestimmt. Das Klemmbrett ist geschmolzen."
    - "Kommt als Blitz zur Arbeit und geht als Loch im Gildensteinbruch."
    - "Schalt ihn ab. Zwei Compacted Diamond Blocks. HR hat schon unterschrieben. In Ruß."
  claims_adjuster_intro:
    - "Baron von Wurm hat einen Steinbruch gefressen. Und uns die Bissspuren in Rechnung gestellt."
    - "Das Formular hat ein Kästchen für 'am Stück verschluckt'. Zweimal geprüft."
    - "Erledig den Wurm. Compacted Diamond Blocks. Das ist der Vergleich. Kein Einspruch."
  repo_agent_intro:
    - "Der Insolvent Wither hat Insolvenz angemeldet. Auf fremden Schädeln."
    - "Das Inkasso hat mich geschickt. Ich schick dich. Nennt sich Delegieren. Auch Feigheit."
    - "Pfände den Wither. Zwei Compacted Diamond Blocks. Falls wer fragt: Wir kennen uns nicht."
  rook_intro:
    - "Rook. Ich bereite Leute auf Löcher im Boden vor, die Eintritt kosten."
    - "Dungeons sind Höhlen mit Meinung. Bring mir zehn Knochen. Hausaufgaben vor dem Ausflug."
    - "Erst den Papierkram überleben. Die Skelette können warten."
  gate_warden_intro:
    - "Straße gesperrt. Der Pathwarden ist Grund und Plakat zugleich."
    - "Er ist langsam. Er ist geduldig. Er beendet auch sehr gern Karrieren."
    - "Beweg ihn. Oder werd eine Warntafel. Deine Wahl. Ich werd so oder so bezahlt."
  bench_cynic_intro:
    - "Nicht hinsetzen. Die Bank ist von Ansprüchen besetzt."
    - "Ich brauch acht verrottetes Fleisch. Nenn's Forschung. Nenn's Mittagessen. Mir egal."
    - "Bring's her. Dann überlass mich meiner Enttäuschung."
  dust_intro:
    - "Ich heiß Dust. Ich kartiere Orte, über die schon alle gelaufen sind."
    - "Dreißig Bruchstein. Ehrgeiz braucht Straßen. Straßen brauchen Steine. Steine brauchen dich."
    - "Mach keine Poesie draus. Mach einen Haufen."
  fry_gossip_intro:
    - "Du riechst nach Abenteuer. Oder nach Fett. Schwer zu sagen hier."
    - "Clucksworth schreit ständig wegen McNugget. Riesenhuhn. Sehr verhaubar. Sehr knusprig."
    - "Wenn du's überlebst, prahl nicht an der Fritteuse. Gossip hört zu. Und erzählt weiter."
  dock_whisper_intro:
    - "Leise. Der Fluss hat Meinungen."
    - "Tackle zeigt dir das Einholen. Selten wird die Leine lila — Mythic Water Dragon. Nur für dich."
    - "Kommt was Älteres als das Riff im Fläschchen hoch? Nicht schütteln. Nicht Brine fragen. Lass es."
  larder_intro:
    - "Die Speisekammer ist dünn. Meine Geduld dünner."
    - "Weizen komprimieren — echter Compressed Wheat, keine grasigen Reste."
    - "Drei davon. Dann reden wir über Booster."
  pet_scout_intro:
    - "Lark verteilt Spheres wie Bonbons. Ich will Beweise, dass du zielen kannst."
    - "Fang ein wildes Schwein. Eins. Lebendig in der Sphere, nicht als Abendessen."
    - "Komm wieder, wenn die Tasche quiekt."
  ore_ledger_intro:
    - "Ich grabe nicht. Ich prüfe. Der Berg hat schon einmal gelogen."
    - "Mining-Skill Level acht. Mindestens. Darunter bist du Tourist mit Spitzhacke."
    - "Fünf Compressed Coal. Nicht staubig. Nicht 'fast'. Komprimiert. Dann schließen wir die Akte."
  timber_clerk_intro:
    - "Jeder Stumpf reicht Beschwerde ein. Ich bin die Beschwerdestelle."
    - "Foraging acht oder mehr. Wackelige Äxte warten draußen."
    - "Fünf Compressed Oak Logs. Versteuertes Holz. Stiller Wald. Alle gewinnen, außer den Bäumen."
  dock_scaler_intro:
    - "Ich wiege Fische, die sich nicht wiegen lassen wollen. Beruflich."
    - "Fishing zehn. Wenn dein Wurf noch wie ein Niesen aussieht: weitergehen."
    - "Drei Compressed Cod. Ein Schwarm mit Solidarität. Das Klemmbrett bleibt so oder so nass."
  sphere_proctor_intro:
    - "Schweine waren Kindergarten. Kühe sind die Zwischenprüfung."
    - "Aetherion Level fünf. Die Sphere hat Ansprüche. Ich auch."
    - "Fang eine Kuh. Lebendig. Muhend. In Gewahrsam. Bring mir kein Steak und nenn es Fortschritt."
  quarry_broker_intro:
    - "Die Gildentür ist wählerisch. Ich bin wählerischer."
    - "Aetherion Level zwanzig. Das ist der Club-Handschlag, minus Handschlag."
    - "Ein Compacted Cobblestone. Nicht compressed. Compacted. Der Beweis, dass du's ernst meinst."
  slag_poet_intro:
    - "Ode an eine Ader, die mich geghostet hat. Strophe eins: Verrat. Strophe zwei: auch Verrat."
    - "Ore Ledger will Kohle mit Quittung. Ich will Metaphern. Wir sind nicht gleich."
    - "Wenn der Berg singt, antworte nicht. Er rechnet stundenweise ab."
  bait_theory_intro:
    - "Köder ist eine Philosophie. Würmer sind die Fußnoten."
    - "Dock Whisper murmelt von lila Leinen. Dock Scaler von Klemmbrettern. Ich murmle von Entropie."
    - "Wirf aus, als meinst du's ernst. Oder nicht. Der Fluss bewertet nach Gefühl."
  stall_crumb_intro:
    - "Frisches Brot. Oder von gestern. Kommt drauf an, wie ehrlich du aussiehst."
    - "Der Quartermaster zahlt in Kohlegerede. Ich in Krusten. Such dir deine Religion aus."
  stall_tack_intro:
    - "Nägel, Schnur, Reue — drei für eine Münze, wenn ich dich mögen würde."
    - "Ore Ridge frisst Werkzeug. Ich verkaufe den Kaugummi, der fast hilft."
  stall_brine_intro:
    - "Salz für Fisch, Salz für Wunden, Salz für Meinungen."
    - "Tackle am Steg verkauft Ruten. Ich verkaufe den Grund, warum Fisch nach was schmeckt."

completed:
  default:
    - "Wir sind quitt. Sagt das Klemmbrett."
    - "Geh und mach jemand anderem den Tag ein bisschen schlechter."
  egon:
    default:
      - "Passt das Kit? Gut. Sag's mir nicht, wenn nicht."
      - "Der §eQuartermaster§f hinter dem kleinen Markt will dich als Nächstes."
      - "§eGelber Pfeil oben§f. Trau ihm mehr als mir."
    after_coal:
      - "Hält das Kit, {player}? Gut. Sag's mir nicht, wenn nicht."
      - "Am Pier ist Ruhe. So mag ich das."
  lumberjack:
    - "Egon hat seine Eiche? Gut. Behalt die Axt. Sie mag dich."
    - "Komm wieder, wenn dir der Harzgeruch fehlt."
  quartermaster:
    - "Kohle abgeheftet, {player}. Der Mines-Teleport bleibt offen — §e/mines§f."
    - "Einmal hinlaufen, dann gehört's dir. §e/spawns§f listet alles."
    - "Der Foreman wohnt immer noch an den Minen. Freiwillig, angeblich."
  craftsman:
    default:
      - "Schöne Spitzhacke, {player}. Du bist bereit für die Minen."
      - "Als Nächstes: §eShaft Foreman§f. Das Recipe Book griffbereit halten — später kommen neue Seiten."
    after_shift:
      - "Hm. {player}. Hält die Spitzhacke? Gut."
      - "Das Recipe Book wächst mit dir. Schau ab und zu rein."
  foreman:
    default:
      - "Schicht ist zu. Als Nächstes: §eTemper§f, auf dem Weg zur Capital."
      - "Ein Booster fusen, dann Skills. Vertrau der Reihenfolge."
    after_boost:
      - "Die Mine ist noch da, {player}. Der Staub auch."
      - "Tiefere Adern zahlen besser. Tiefere Adern beißen auch."
  booster_tutor:
    default:
      - "Booster gefust. Rezepte bleiben jederzeit im §eRecipe Book§f."
      - "Als Nächstes: §eMiss Ledger§f in der Capital — Skills. Dann die Felder."
    after_skills:
      - "In letzter Zeit was Scharfes gefust, {player}?"
      - "Der Anvil ist immer im Manager. Rezepte im §eRecipe Book§f."
  ledger:
    - "Skill sitzt. Gut. Gestempelt."
    - "Als Nächstes: die Felder — §eFarmer§f (Weizen) und §eLark§f (Pets), gleiche Ecke."
    - "Komm nach beiden zurück, {player}. Ich schließe die Orientierung — und hab einen Hilfeschalter."
  farmer:
    default:
      - "Weizen erledigt. Die Vögel schmollen. Gute Arbeit, {player}."
      - "Mach §eLark§f fertig, falls noch offen, dann §eMiss Ledger§f — oder §e/capital§f."
    lark_done:
      - "Weizen erledigt. Die Vögel schmollen. Gute Arbeit, {player}."
      - "Zurück zu §eMiss Ledger§f für den Stempel — oder §e/capital§f, wenn du den Weg kennst."
    graduate:
      - "Die Vögel sind zurück. Du auch. Gut, {player}."
      - "Die Farm Isle ist hinter §eHarrows§f Portal, hinteres Ende der Scheune."
  lark:
    default:
      - "Fang erledigt. Dein Pet mag dich. Wahrscheinlich."
      - "§eMiss Ledger§f schließt die Orientierung — §e/capital§f, wenn du faul bist. Fragen an sie."
    graduate:
      - "{player}! Dein Pet mag dich immer noch. Pistachio ist eifersüchtig."
      - "Wilde laufen über die Felder. Fang mehr, wenn du neugierig bist."
  fisher:
    - "Fang gezählt. Leine frei. Meer noch voll."
    - "Guck dir mal deine Rute an — manche Tools leveln hier."
  fishmonger:
    - "Shop ist offen. Sprich mich an, wenn du stöbern willst."
  vex:
    - "Lektion Stahl: bestanden. Form: fragwürdig. Akzeptabel."
    - "Combat-Set und Booster vor dem härteren Ödland. Dann §cRite Warden§f, wenn du Bosse willst."
  surveyor:
    - "Der Tisch bleibt offen. Sammlung oben, unten eine Blaupause ins Tool stempeln."
    - "Trolle kriechen durch jede Ader in dieser Mine. Grab, wenn du Seiten willst."
  merchant:
    - "Die Kisten bleiben frei, {player}. Probe neben mir, mehr draußen in der Welt."
    - "Seltenere Kiste, besseres Loot. Mach alles auf. Trau nichts."
  canopy_clerk:
    - "Proben abgeheftet. Eiche, Birke, Fichte — vom Blätterdach genehmigt."
    - "Komm wieder, wenn die Insel einen vierten Baum erfindet, {player}. Bis dahin: hacken."
  hunter:
    - "Erstes Blut abgeheftet. Werd nicht sentimental."
    - "Nächstes Mal größere Probleme mitbringen. Oder leisere Schritte."
  collector:
    - "Glänzendes erhalten. Mein Regal ist selbstgefällig. Du darfst gehen."
    - "Grab tiefer, wenn dir das Urteil der Felsen fehlt."
  miner:
    - "Der Hollow Lurker ist still. Meine Nerven nicht. Danke dafür."
    - "Wenn die Tunnel wieder flüstern, schieb ich's auf deine Schritte."
  chicken_keeper:
    - "McNugget ist erledigt. Der Stall beschwert sich trotzdem."
    - "Sag nichts von Fett. Fry Gossip hört alles."
  tollkeeper:
    - "Maut in Troll bezahlt. Die Brücke ist zufrieden. Weitergehen."
    - "Die nächste Überquerung kostet Charme. Du bist im Minus."
  dockhand:
    - "Tintenvertrag erledigt. Squidward ist wieder ein Gerücht. Gut."
    - "Der Steg bleibt nass. Meine Geduld dünn. Lass beides in Ruhe."
  ash_scout:
    - "Asche abgeheftet. Pfeile gezählt. Skuldugery ist jetzt das Problem von jemand anderem."
    - "Stocher nicht zum Spaß in der Glut. Das ist mein Job. Angeblich."
  colossus_scholar:
    - "Laufender Berg: notiert. These: überfällig. Du: frei."
    - "Wenn er wieder aufsteht, war ich nie hier."
  veil_priest:
    - "Der Schleier hält. Deine Neugier nicht. Zügle sie."
    - "Nyx bewahrt Geheimnisse. Du bewahrst Abstand."
  patch_intern:
    - "Ticket geschlossen. Sir Balthazar gepatcht. Praktikant immer noch unbezahlt."
    - "Bitte bewerten Sie dieses Gespräch: ein Stern, zwei Seufzer."
  void_janitor:
    - "Fundbüro leer. Lobby urteilt. Mopp ist heilig."
    - "Tritt kein Void auf die Fliesen. Hab gerade existenzielle Angst gewachst."
  fuse:
    - "Überstunden verbucht. Sparky ist still. Meine Schicht nicht."
    - "Wenn was funkt: weggehen. Dramatisch."
  claims_adjuster:
    - "Antrag abgelehnt. Dann doch nicht. Bürokratie ist Extremsport."
    - "Wormsworth stempelt. Du gehst. Wunderschönes System."
  repo_agent:
    - "Scheck geplatzt. Dann zurückgeprallt. Audit hat genug gegrinst."
    - "Nächstes Mal weniger Schuldscheine. Mehr Würde."
  rook:
    - "Knochen geliefert. Lehrplan zerkaut. Unterricht beendet."
    - "Rook hebt Quittungen auf. Du hältst Abstand."
  gate_warden:
    - "Straße offen. Tor gelangweilt. Nicht rumlungern wie ein Tourist."
    - "Gesperrte Straßen öffnen sich für Leute, die Jobs erledigen. So wie du."
  bench_cynic:
    - "Fleisch erforscht. Ansprüche verfehlt. Bank weiter besetzt."
    - "Nicht hinsetzen. Die Enttäuschung ist reserviert."
  dust:
    - "Bruchstein gestapelt. Ehrgeiz kurz weniger staubig. Weiter."
    - "Karten können warten. Deine Füße nicht."
  larder:
    - "Speisekammer weniger tragisch. Weizen komprimiert. Ego aufgeblasen. Fertig."
    - "Komm hungrig wieder, nicht nostalgisch."
  pet_scout:
    - "Schweinebeweis akzeptiert. Tasche quiekt noch. Stolz auf dich. Mäßig."
    - "Nächster Fang: höher zielen. Wörtlich. Kühe haben Höhe."
  ore_ledger:
    - "Kohleprüfung abgeschlossen. Zahlen haben sich benommen. Wunder notiert."
    - "Keine Quittungen fälschen. Hat der Berg schon versucht."
  timber_clerk:
    - "Stumpfzählung abgeschlossen. Wald ruhiger. Klemmbrett glücklicher."
    - "Nur versteuertes Holz. Unversteuertes Holz ist ein Lebensstil, den ich nicht unterstütze."
  dock_scaler:
    - "Schuppenprobe abgeheftet. Kabeljau komprimiert. Klemmbrett noch nass. Passt."
    - "Nächstes Mal Fische, die Maßeinheiten respektieren."
  sphere_proctor:
    - "Rinderakte geschlossen. Kuh in Gewahrsam. Zwischenprüfung: bestanden."
    - "Keine Steakwitze. Kenn ich alle. Schlecht erzählt."
  quarry_broker:
    - "Gildenziegel erhalten. Club-nah. Handschlag imaginär."
    - "Compacted heißt compacted. Komm wieder, wenn du's vergisst — trau dich."

