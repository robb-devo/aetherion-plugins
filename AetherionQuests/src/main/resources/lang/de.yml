quests:
  gather_wood:
    title: "Holz holen"
    description: "Zehn Eichenstämme vom Forager. Zurück zu Egon am Pier."
  forge_coal:
    title: "Kohle für die Schmiede"
    description: "Zwanzig Kohle vom Erzgrat zum Quartiermeister."
  first_shift:
    title: "Erste Schicht"
    description: "Zweiunddreißig Erze in der Schäbigen Mine, dann zum Vorarbeiter."
  lesson_boost:
    title: "Booster-Lektion"
    description: "Temper zeigt Boosters und Amboss."
  lesson_manager:
    title: "Skills & Manager"
    description: "Miss Ledger erklärt Skills im Manager."
  farm_hand:
    title: "Feldarbeit"
    description: "Weizen ernten. Lark wartet am Zaun mit seiner Taschen-Sammlung."
  pocket_zoo:
    title: "Taschenzoo"
    description: "Fang ein wildes Pet, sprich mit Lark, rüste es aus."
  lesson_steel:
    title: "Erste Lektion Stahl"
    description: "Zehn Gegner in den Borderlands für Sergeant Vex."
  border_rites:
    title: "Border-Riten"
    description: "Spirit-Fläschchen farmen, am Pulver-Altar zünden — ein Borderlands-Boss."
  a_simple_craft:
    title: "Einfache Schmiede"
    description: "Craft die Mining Pickaxe und zeig sie dem Craftsman."

dialogs:
  fishing_before_egon:
    - "Moment. Erst Egon fertig machen — dann reden wir übers Angeln."
  tutorial_blocked:
    - "Mach zuerst das Tutorial fertig."
    - "Hafen → Mine → Temper → Miss Ledger → Felder. Dann stempelt Ledger dich frei."
    - "Komm zurück, wenn sie gestempelt hat. Dieser Schreibtisch ist nichts für Rookies mitten in der Lektion."
  ledger_blocked:
    - "Zu früh. Skills bleiben zu, bis die Minen-Schicht durch ist."
    - "Shaft Foreman an den Minen. Schicht fertig — dann komm zurück."
    - "Dann schalte ich den Manager-Tab Skills frei. Nicht früher."
  rite_keeper_blocked:
    - "Zu. Erst Orientierung — Felder, dann stempelt Miss Ledger dich frei."
    - "Temper, Ledger, Weizen, ein Pet. Dann reden wir über Geister."
    - "Miss Ledger schließt das Tutorial. Komm zurück, wenn sie's getan hat."
  egon_intro:
    - "Egon. Hafen-Kit. Ich brauche Eiche — du holst sie."
    - "Der Forager am Hügel leiht die Axt und zeigt das Chop-Minispiel. Zehn Eichenstämme, zurück zu mir."
    - "§eGelber Pfeil oben§f ist dein Kompass. Für diesen Job gibt's auch einen Funkel-Pfad am Boden."
  lumberjack_intro:
    - "Egon braucht Eiche. Wieder."
    - "Simple Axe. Linksklick auf einen §eleuchtenden Stamm§f — das ist die Chop-Leiste."
    - "Wenn's §aCHOP§f (grün) zeigt: nochmal Linksklick. Verfehlst du's, setzt der Baum zurück."
    - "Zehn Eichenstämme → §eEgon am Pier§f. Nicht bei mir."
  quartermaster_intro:
    - "Die Schmiede hat Hunger. Zwanzig Kohle von der Oberfläche."
    - "§eErzgrat§f — Hügel hinter dem kleinen Markt. Kohleadern im Freien. Zwanzig abbauen, zu mir zurück."
    - "Der §egelbe Pfeil oben§f trackt den Auftrag."
  craftsman_intro:
    - "Crafting ist frei. Recipe Book sitzt im Manager."
    - "Nether Star (Hotbar §e9§f) → §agrünes Buch§f. Da sind alle Blaupausen."
    - "Craft eine §fMining Pickaxe§f: Simple Pickaxe in der Mitte, Kohle drumrum. Bring die Spitzhacke zu mir."
  foreman_intro:
    - "Schäbige Mine — Höhle hinter mir. Bau §eKohle, Kupfer, Eisen§f ab. Brich §e32 Erz-Blöcke§f, dann zurück."
    - "Mining-Pickaxe und etwas Rüstung helfen. Recipe Book im Manager, falls du noch craften musst."
  booster_tutor_intro:
    - "Temper. Boosters fusen auf Gear — Mining Power, Fortune, Damage."
    - "Manager → §eAnvil§f: Gear links, Booster rechts. Hier: Emerald — einmal fusen. Rezepte bleiben im §eRecipe Book§f."
  ledger_intro:
    - "Miss Ledger. Skills — und ich stemple die Orientierung zu, wenn du fertig bist."
    - "Hotbar §e9§f — Nether Star → Manager → Tab §dSkills§f (blinkt). Rüste §eirgendeinen§f Skill aus."
    - "Komm zurück, wenn er ausgerüstet ist."
  farmer_intro:
    - "Weizen von diesen Feldern. Vögel von den Pflanzen."
    - "Weizen abbauen bis §e48§f. Vögel landen? §eKlick§f — die Bossbar zählt die Verscheucher."
    - "§eLark§f ist danach in der gleichen Area für Pets. Anderer Quest — der Pfeil wandert, wenn's soweit ist."
  lark_intro:
    - "Die Felder sind Jagdgebiet. Wilde Tiere — nicht mein Papagei."
    - "Catch Sphere halten, Tier ansehen, §eRechtsklick§f werfen. Fang §eeins§f, dann wieder mit mir reden."
    - "Danach zeig ich dirs §eAusrüsten§f. Ein Schritt nach dem anderen."
  vex_intro:
    - "Sergeant Vex. Tor zu den §cBorderlands§f — Ödland hinter der Mauer."
    - "Erste Lektion: zehn Gegner. Töten. Husk, Stray, Crawler — egal welche."
    - "Zu hart? Combat-Set aus dem Recipe Book, Boosters am Amboss. Weicheres Gear. Härtere Treffer. Beweg dich."
  fisher_intro:
    - "Leine ins Wasser. Warten auf den Biss. §eREEL§f, wenn die Leiste grün wird."
    - "Verpasst du das Fenster, ist der Fisch weg. Fang §efünf§f, dann wieder mit mir reden."
  bar_whisper_intro:
    - "Unten am Bildschirm: §bAetherion Level§f."
    - "Stats, Unlocks, neue Areas — viel von dieser Welt läuft über diese Leiste."
    - "Spiel weiter. Sie merkt sich das."
  vince_intro:
    - "Casino ist hinter mir. Such dir 'ne Maschine. Nicht auf dem Filz heulen."
    - "Slots. Roulette. Münzen rein. Würde bleibt in der Tasche."
    - "Ich deal nicht. Ich kommentiere. Die Maschinen machen den Dreck."
    - "Das Glas ist hungriger als du. Fütter's trotzdem."
  fishmonger_intro:
    - "Shop. Ruten. Rüstung. Münzen willkommen."
  rite_keeper_intro:
    - "Rite Warden. T1-Bosse. Kein Sightseeing."
    - "Töte Gegner für Spirit-Fläschchen: §c5%§f T1 · §c10%§f Sturdy · §c15%§f Elites. Die §eBeacon-Säule§f ist der Altar."
    - "Rechtsklick auf hellgraues Pulver mit dem Fläschchen. Zehn Sekunden. Donner. Dann läuft er. Einmal töten — Ritus bestanden."
  arena_proctor_intro:
    - "Proctor. Dieser Ring bedeutete mal etwas."
    - "Borderlands-Fläschchen sind die Übung. Crypt-Fläschchen sind der Ernstfall."
    - "Bring mir ein Crypt-Fläschchen. Ich will es untersuchen. Vorsichtig. Wahrscheinlich."
  arena_proctor_vial:
    - "Da ist es. Stärker als das Borderlands-Zeug."
    - "Komm — wir schauen uns den Ring an. Ich prüfe das Fläschchen unterwegs."
    - "Nicht schütteln. Nicht dran schnüffeln."
  arena_proctor_self:
    - "Du hast den Spill gesehen. Ich mach keine Encore-Spaziergänge."
    - "Fläschchen zur leuchtenden Markierung im Ring. Rechtsklick selbst."
    - "Gleicher Donner. Gleiche zehn Sekunden. Weniger meiner Schritte."
  arena_proctor_done:
    - "Ring ist offen. Crypt-Fläschchen auf die leuchtende Markierung — nicht in meine Hand."
    - "Einmal durchgespielt. Das war die Lektion."
    - "Bring ein neues, wenn du eins hast. Der Pathwarden ist nicht wählerisch."
  farm_isle_guide_intro:
    - "Portal geht zur Farm Isle — geteilte Felder neben der Hub-Farm."
    - "Farming 10 zum Betreten. Dasselbe Portal bringt dich zurück."
  forage_pad_guide_intro:
    - "Schleim-Pad → Forage Isle. Spring. Nicht nachdenken."
    - "Bäume droppen, was sie sind. Fichte ist Fichte. Birke ist Birke."
    - "Canopy Clerk auf der Insel will komprimierte Samples. Folge dem Pfeil."
  eldervale_welcome_intro:
    - "Willkommen auf Eldervale."
    - "Mining-Insel. Tiefengestein. Nicht runterfallen."
  eldervale_upgrade_intro:
    - "Blaupausen-Schmiede. Tool plus Upgrade Stone. Mehr ist's nicht."
    - "Tier II, III, IV — Steine werden teuer. Schnell."
  isle_clerk_intro:
    - "Persönliche Insel: Aetherion Level 20."
    - "Nether Star, Slot 9 → Island-Tab. Dort claimen. Ich mach keinen Papierkram."
  liquidator_intro:
    - "Kristall-Schreibtisch. Kaufen, verkaufen, oder Mats zu Aether Crystals schmelzen."
    - "Crystals kommen aus dem offiziellen Shop — oder als Level-Belohnung."
  merchant_intro:
    - "Welt-Kisten. Nicht nur diese hier — die spawnen überall."
    - "Seltenere Kiste, besseres Loot. Entdecken zahlt sich aus."
    - "Mit mir reden schaltet sie frei. Sample-Kiste neben mir, jederzeit."
  surveyor_intro:
    - "Erz-Trolle droppen jetzt Blaupausen. Weiche Erze: Kohle, Eisen, Kupfer."
    - "Bring eine Seite. Ich stemple sie hier in ein Tool."
  canopy_clerk_intro:
    - "Ich will Insel-Holz — komprimiert. Keine Hafen-Reste."
    - "Foraging 5. Dann ein Compressed Oak, ein Birch, ein Spruce."
    - "Drei Samples. Fette Auszahlung. Dann geh hacken."
  root_cellar_intro:
    - "Mühlstein-Vorrat. Compacted Crops rein. Refined Pantry-Waren raus."

completed:
  egon:
    - "Holz erhalten. Kit bleibt deins — nicht verlieren."
    - "§eQuartiermeister§f ist hinter dem kleinen Markt — sprich als Nächstes mit ihm."
    - "Ab jetzt: achte auf den §egelben Pfeil oben§f. Der ist dein Guide."
  lumberjack:
    - "Egon hat sein Holz. Behalt die Axt."
    - "Folge dem Pfeil zurück zu §eEgon§f am Pier."
  quartermaster:
    - "Kohle ist durch. Mines-Teleport bleibt offen — §e/mines§f."
    - "Der Foreman wohnt weiter an den Minen, falls du ihn brauchst."
  craftsman:
    - "Schöne Spitzhacke. Du bist bereit für die Minen."
    - "Als Nächstes: §eShaft Foreman§f. Recipe Book im Blick behalten."
  foreman:
    - "Schicht zu. Als Nächstes: §eTemper§f auf dem Weg zum Hub — Booster Tutor."
    - "Einmal am Amboss fusen, bevor Skills."
  booster_tutor:
    - "Booster fused. Gut. Rezepte bleiben im §eRecipe Book§f."
    - "Als Nächstes: §eMiss Ledger§f in der Capital — Skills. Dann die Felder."
  ledger:
