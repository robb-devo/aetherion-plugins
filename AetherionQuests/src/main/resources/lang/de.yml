    bring_page: "Bring mir eine Seite. Ich stemple sie dir hier in ein Tool."
  eldervale_upgrade:
    open: "Die Schmiede ist heiß, {player}. Blaupausen-Tool + Upgrade Stone. Ich mach den Tisch auf."
  root_cellar:
    first: "Mühlstein-Speisekammer, Schätzchen. Compacted Crops rein, feine Vorräte raus."
  redirect:
    lead: "Wo du eigentlich hingehörst:"
    ledger_fields: "§eMiss Ledger §fschließt die Orientierung nach den Feldern."
    egon: "§aEgon §fam Pier — erst Eiche. Dann der Quartermaster."
    quartermaster: "§eQuartermaster §fhinter dem kleinen Markt — als Nächstes Kohle."
    foreman: "§eShaft Foreman §fan der Shabby Mine — seine Schicht fertig machen."
    temper: "§eTemper §f— Booster Tutor. Einen Booster fusen, dann weiter."
    ledger_skills: "§dMiss Ledger §fin der Capital — Skills im Manager."
    farmer: "§eFarmer §fauf den Feldern — als Nächstes Weizen."
    lark: "§dLark §fam Zaun — ein Fang für seine Sammlung."
    stamp: "§dMiss Ledger §fschließt die Orientierung. Hol dir den Stempel."
  gate:
    ledger_foreman_first: "§eErst der Shaft Foreman. §7Minenschicht, dann öffnen wir Skills."
    tutorial_first: "§eErst das Tutorial. §7Miss Ledger schließt die Orientierung nach den Feldern."

# CastBook voice sheet (German). Fields mirror npc/CastBook.java:
#   accept / decline (reply chips) · on_accept / on_decline (reaction) · returning (repeat visit)
#   greet_new / greet / greet_grad (approach, by stage) · idle (ambient) · farewell · topics
# idle lines are shown to everyone in range — never use {player} there.
cast:
  egon:
    accept: "Zeig mir die Eiche."
    decline: "Später, Egon."
    on_accept: ["Gut. Der Lumberjack ist oben am Hügel. Lass dich nicht umarmen."]
    on_decline: ["Der Pier läuft nicht weg. Ich auch nicht."]
    returning:
      - "Wieder da, {player}. Immer noch keine Eiche. Mutige Strategie."
      - "§eLumberjack§f, oben am Hügel. Der §egelbe Pfeil§f kennt den Weg."
    greet_new: ["He, {player}! Hier rüber — am Pier gibt's Arbeit.", "Neues Gesicht. Pier. Zu mir. Jetzt."]
    greet: ["Hält das Kit, {player}?", "{player}. Noch am Stück. Gutes Kit."]
    greet_grad: ["Schau dich an, {player}. Fast gefährlich.", "Das Kit hat sich bezahlt gemacht. Schön."]
    idle: ["Wer legt ständig Fisch auf meine Kisten?", "Eiche. Immer Eiche. Keiner bringt Birke.", "Dreißig Jahre Rookies. Ich zähl noch mit."]
    farewell: ["Pass auf die Kante auf. Das Wasser ist kalt, und ich spring nicht."]
    topics:
      - label: "Wer bist du eigentlich?"
        lines: ["Egon. Ich rüste Leute aus. Steht schon im Namen.", "Dreißig Jahre auf diesem Pier. Rookies kommen nass an und gehen gepanzert."]
      - label: "Was ist das hier?"
        lines: ["Anker Harbour. Boote rein, Rookies raus.", "Die Capital ist die Straße rauf. Dahinter die Minen. Nichts überstürzen."]
      - label: "Irgendwelche Tipps?"
        lines: ["Achte auf den §egelben Pfeil§f. Der ist schlauer als die meisten, die ich ausgerüstet hab.", "Und rede mit Leuten. Die halbe Hafenmeile berät gratis. Die andere Hälfte kassiert."]
  lumberjack:
    accept: "Her mit der Axt."
    decline: "Vielleicht später."
    on_accept: ["Baum fällt! …Sorry. Macht der Gewohnheit. Nur leuchtende Stämme."]
    on_decline: ["Die Bäume warten. Können sie gut."]
    returning:
      - "{player}! Zurück zur Axt-Lektion? Leuchtender Stamm, grünes §aCHOP§f."
      - "Zehn Eichenstämme → §eEgon am Pier§f. Nicht zu mir. Ich hab genug."
    greet_new: ["Axt-neugierig, {player}? Egon hat dich geschickt, oder?"]
    greet: ["{player}! In letzter Zeit Bäume fallen hören?", "Schon Muskelkater, {player}? Gut."]
    greet_grad: ["Da ist ja der Holzfäller-Profi. Die Bäume tuscheln immer noch über dich, {player}."]
    idle: ["Baum fällt!… sorry. Gewohnheit.", "Die Eiche guckt mich komisch an.", "Birke ist nur Eiche, die aufgegeben hat.", "Nenn mich Forager. Klingt netter."]
    farewell: ["Pass auf deine Zehen auf. Äxte tun's nicht."]
    topics:
      - label: "Lumberjack oder Forager?"
        lines: ["Auf dem Schild steht Lumberjack. Ich sag Forager.", "Lumberjack klingt brutal. Forager klingt, als wär's mir nicht egal. Ist es nicht. Ich hack trotzdem."]
      - label: "Baum-Tipps?"
        lines: ["Größere Bäume, längere Leisten. Nicht gierig werden.", "Nur leuchtende Stämme. Der Rest ist Deko. Emotional."]
  quartermaster:
    accept: "Zwanzig Stück. Bin dran."
    decline: "Heute nicht."
    on_accept: ["Notiert. Du hast jetzt einen Job, {player}."]
    on_decline: ["Notiert. Mit Enttäuschung."]
    returning:
      - "Kohlestand: immer noch null, {player}. Hab nachgezählt. Zweimal."
      - "§eOre Ridge§f. Hügel hinter dem Markt. Zwanzig Stück."
    greet_new: ["Ah. {player}. Du stehst auf meiner Liste."]
    greet: ["{player}. Inventar sieht gesund aus. Verdächtig gesund.", "{player}. Immer noch auf meiner Liste. Gute Liste."]
    greet_grad: ["{player}. Seite zwölf in meinem Buch. Die gute Seite."]
    idle: ["Zweiundvierzig Kisten. Heute Morgen waren's dreiundvierzig.", "Wer hat für diesen Anker unterschrieben?", "Nee. Die Karte stimmt immer noch nicht."]
    farewell: ["Weggetreten. Höflich."]
    topics:
      - label: "Was lieferst du?"
        lines: ["Alles. Irgendwann. Erst der Papierkram.", "Gerade: eine Schmiede, die Kohle frisst, und einen Hafen, der Schmieden frisst."]
      - label: "Wie gehen Teleports?"
        lines: ["Einmal hinlaufen — schon freigeschaltet. Oder einen Homestead Marker setzen.", "Dann Manager → Teleports, oder den Ort tippen. §e/harbour§f, §e/mines§f. So."]
  craftsman:
    greet_new: ["Hm. {player}. Das Recipe Book ist in deinem Manager."]
    greet: ["Hm. {player}.", "Hält die Spitzhacke? Hm. Gut."]
    greet_grad: ["Hm. Gute Arbeit in letzter Zeit, {player}. Bild dir nichts drauf ein."]
    idle: ["*kläng*", "Hm.", "Eisen ist heute launisch.", "Kohle. Mehr Kohle."]
    farewell: ["Hm."]
    topics:
      - label: "Was macht gutes Gear aus?"
        lines: ["Altes Teil in die Mitte. Material drumherum. Das ist das ganze Geheimnis.", "Der Rest ist Schweiß. Hauptsächlich deiner."]
      - label: "Wo ist das Recipe Book?"
        lines: ["Nether Star, Hotbar §e9§f. Grünes Buch. Da ist jede Blaupause drin."]
  foreman:
    accept: "Stempel mich ein."
    decline: "Noch nicht."
    on_accept: ["Mine ist hinter mir. Helm auf. Oh — kein Helm. Mutig."]
    on_decline: ["Die Mine wartet. Tut sie seit Ewigkeiten."]
    returning:
      - "Zweiunddreißig Erze, {player}. Die Höhle ist hinter mir. Beißt nicht. Kaum."
      - "Kohle, Kupfer, Eisen. Zählt alles."
    greet_new: ["Helme retten Leben, {player}. Hab ich gehört."]
    greet: ["{player}! Noch 'ne Schicht?", "Staub steht dir, {player}."]
    greet_grad: ["Guck mal, wer jetzt unter Tage zu Hause ist. Stolz auf dich. Sag's keinem."]
    idle: ["*paff*", "Hörst du das? Ich auch nicht. Gutes Zeichen.", "Dreißig Jahre. Hasse Spinnen immer noch."]
    farewell: ["Achte auf Abgründe. Auf die Dunkelheit. Auf dich."]
    topics:
      - label: "Ist es sicher da unten?"
        lines: ["Sicher? Das ist 'ne Mine, {player}.", "Meistens. Achte auf Abgründe. Auf die Dunkelheit. Und darauf, dass ich nicht reingehe."]
      - label: "Die Pfeife?"
        lines: ["Hält den Staub fern. Der Doktor sagt was anderes. Der Doktor gräbt nicht."]
  booster_tutor:
    accept: "Lass uns was fusen."
    decline: "Vielleicht später."
    on_accept: ["Ja! Der Emerald ist im Inventar. Der Anvil ist im Manager. Nicht ablecken."]
    on_decline: ["Dann bleibt dein Gear eben langweilig. Deine Entscheidung."]
    returning:
      - "Immer noch nichts gefust, {player}? Der Emerald wartet auf dein Ja."
      - "Dann Manager → §eAnvil§f. Gear links, Booster rechts."
    greet_new: ["{player}! Hast du was, das ich anzünden kann? Upgraden. Ich meinte upgraden."]
    greet: ["Riechst du das, {player}? Fortschritt. Und leicht verbrannt."]
    greet_grad: ["{player}! In letzter Zeit was Scharfes gefust?"]
    idle: ["*zisch*", "Der Funke war Absicht.", "Brille auf. Immer Brille auf."]
    farewell: ["Bleib entflammbar. Moment. Nein. Lieber nicht."]
    topics:
      - label: "Gibt's ein Limit?"
        lines: ["Es gibt ein Cap. Frag nicht, ob ich's anhebe.", "Hab's einmal versucht. Da war ein Feuer. Ein gutes Feuer, aber trotzdem."]
      - label: "Bester Booster?"
        lines: ["Der, den du auch wirklich fust, {player}."]
  ledger:
    accept: "Her mit dem Stempel."
    decline: "Später."
    on_accept: ["Notiert. Skills-Tab. Slot neun. Blinkt."]
    on_decline: ["Deine Akte bleibt offen. Sie urteilt über dich."]
    returning:
      - "{player}. Der Stempel wartet. Ich auch."
      - "Sag ja, rüste §eirgendeinen§f Skill aus, komm zurück."
    greet_new: ["{player}. Anwesend. Gut."]
    greet: ["{player}. Pünktlich. Fast.", "Haltung, {player}."]
    greet_grad: ["{player}. Gestempelt und entlassen. Blamier den Stempel nicht."]
    idle: ["*stempel*", "Zu spät. Zu spät. Zu früh. Zu spät.", "Wer schreibt denn so eine Neun?"]
    farewell: ["Entlassen."]
    topics:
      - label: "Was sind Skills?"
        lines: ["Ausgerüstete Bäume. Keine Hausaufgaben.", "Ein Slot frei zum Start. Mehr gibt's mit Münz-Meilensteinen."]
      - label: "Was steht noch an?"
        lines: ["Der gelbe Pfeil weiß es. Ich stemple nur."]
  farmer:
    accept: "Ab ans Ernten."
    decline: "Jetzt nicht."
    on_accept: ["Behalt den Himmel im Auge, {player}. Die planen was."]
    on_decline: ["Runde an die Vögel."]
    returning:
      - "Die Vögel gewinnen, {player}. §e48§f Weizen. Und verscheuchen."
      - "Sie landen — du klickst. Die Bossbar zählt."
    greet_new: ["{player}! Vögel gesehen? Trau ihnen nicht."]
    greet: ["Der Weizen wächst, {player}. Das Vogelproblem auch."]
    greet_grad: ["{player}! Die Vögel erinnern sich an dich. Gut so."]
    idle: ["Husch!", "Die Krähe starrt seit einer Stunde.", "Bald Regen. Oder Vögel. Eher Vögel."]
    farewell: ["Augen nach oben. Da sind sie immer."]
    topics:
      - label: "Warum die Vögel?"
        lines: ["Die wissen, was sie getan haben.", "Jede Saison. Dieselben Vögel. Den da kenn ich."]
      - label: "Farm Isle?"
        lines: ["Harrows Portal, hinteres Ende der Scheune.", "Farming zehn. Größere Felder. Weniger Vögel."]
  lark:
    accept: "Zeig mir die Spheres."
    decline: "Später."
    on_accept: ["Tief zielen, {player}. Schweine sind klein."]
    on_decline: ["Die Tiere werden erleichtert sein."]
    returning:
      - "Sphere in die Hand, Tier anschauen, §eRechtsklick§f. Ein Fang, {player}."
      - "Dann komm zurück. Pistachio will es kennenlernen."
    greet_new: ["{player}! Vorsicht, Papagei. Sie bewertet deine Schuhe."]
    greet: ["{player}! Pistachio erinnert sich an dich. Das ist kein Kompliment."]
    greet_grad: ["{player}! Dein Pet ist hier berühmt. Na ja. Bei mir."]
    idle: ["Wer ist ein guter Vogel? Du nicht.", "*pfeift*", "Pistachio, nein."]
    farewell: ["Pistachio sagt tschüss. Tut sie nicht. Aber stell's dir vor."]
    topics:
      - label: "Dein Papagei?"
        lines: ["Pistachio. Kein Blickkontakt.", "Sie nimmt das als Herausforderung."]
      - label: "Bestes Pet?"
        lines: ["Das, das dir folgt.", "Drachen machen ein Drama ums Leveln. Lohnt sich."]
  fisher:
    accept: "Ich werf aus."
    decline: "Heute nicht."
    on_accept: ["Geduld. Fische riechen Eile."]
    on_decline: ["Das Meer wartet. Tut es immer."]
    returning:
      - "Fünf Fische, {player}. Auswerfen. Warten. §eREEL§f bei Grün."
      - "Fenster verpasst, Fisch weg. Wär ich auch."
    greet_new: ["Gute Flut heute, {player}."]
    greet: ["Die Leine ruft, {player}.", "Wind stimmt. Fische nicht."]
    greet_grad: ["{player}. Das Meer hat nach dir gefragt."]
    idle: ["*summt ein Seemannslied*", "Ostwind. Die Fische schmollen.", "Hm. Knabbert."]
    farewell: ["Immer eine Handbreit Wasser unterm Kiel."]
    topics:
      - label: "Angel-Tipps?"
        lines: ["Geduld, {player}.", "Und Grün. Bei Grün einholen. Der Rest ist Wetter."]
      - label: "Mal was Großes gesehen?"
        lines: ["Einmal.", "Nicht rausgeholt. Denk heute noch dran."]
  fishmonger:
    greet_new: ["Heute frisch! Größtenteils!"]
    greet: ["{player}! Kabeljau? Lachs? Reue?", "Ruten, Rüstung, Fisch. Münzen willkommen."]
    idle: ["Frischer Kabeljau! Frischlich!", "Lachs! Kaum benutzt!", "Nicht den Fisch anstupsen."]
  vex:
    accept: "Jawohl!"
    decline: "Noch nicht bereit."
    on_accept: ["LOS, {player}! Zehn! Abmarsch!"]
    on_decline: ["Dann mach dich bereit. Die Uhr läuft."]
    returning:
      - "Zehn Feinde, {player}. Borderlands. Die erledigen sich nicht selbst."
      - "Husk, Stray, Crawler. Mir egal, welche."
    greet_new: ["Augen geradeaus, {player}!"]
    greet: ["{player}. Atmest noch. Ausreichend.", "Kinn hoch, {player}. Klinge hoch."]
    greet_grad: ["{player}. Kampfbereit. …Bild dir nichts drauf ein."]
    idle: ["Hopp!", "Links! Rechts! Links!", "*schärft das Schwert*"]
    farewell: ["Wegtreten! Und zwar mit Haltung."]
    topics:
      - label: "Ein Rat?"
        lines: ["Erst zuschlagen. Dann denken. Dann überleben.", "Nein — erst denken. Schreib dir das auf."]
      - label: "Die Narbe?"
        lines: ["Trainingsunfall.", "Das Training hat gewonnen."]
  farm_isle_guide:
    greet_new: ["Die Insel ist offen, {player}. Wenn deine Hände es sind."]
    greet: ["Guter Boden heute, {player}."]
    idle: ["*kaut auf einem Halm*", "Guter Boden heute.", "Das Portal summt. Das ist normal. Glaub ich."]
    farewell: ["Dasselbe Portal zurück. Keine Experimente."]
    topics:
      - label: "Was gibt's auf der Insel?"
        lines: ["Größere Felder. Weniger Vögel. Besserer Boden.", "Sag's nicht dem Farmer."]
      - label: "Du und der Farmer?"
        lines: ["Er hält sich für den echten Farmer.", "Süß."]
  surveyor:
    greet_new: ["{player}! Trolle gesehen? Große? Erzähl mir alles."]
    greet: ["Hast du 'ne Seite für mich, {player}?"]
    idle: ["*kritzelt eine Karte*", "Norden ist… da lang. Wahrscheinlich.", "Trolle. Faszinierend. Furchtbar. Faszinierend."]
  vince:
    greet_new: ["{player}! Glückstag? Du siehst nach Glück aus."]
    greet: ["{player}! Meine Lieblingskundschaft. Heute."]
    idle: ["*wirft eine Münze*", "Rot. Immer Rot.", "Heute Nacht gewinnt jemand. Statistisch."]
    farewell: ["Komm reicher wieder. Oder ärmer. Ich bin nicht wählerisch."]
    topics:
      - label: "Tipps?"
        lines: ["Die Bank gewinnt immer.", "Ich bin der Cousin der Bank. Mir geht's gut."]
      - label: "Hast du wirklich Glück?"
        lines: ["Lucky Vince. Steht im Namen.", "Namen lügen, {player}."]
  bar_whisper:
    greet_new: ["Psst. {player}. Schau nach unten. Die Leiste."]
    greet: ["deine leiste hat sich bewegt, {player}… ich hab's gespürt."]
    idle: ["…", "*lauscht in die Luft*", "level up… level up…"]
    farewell: ["spiel weiter. sie merkt es."]
    topics:
      - label: "Wie füll ich sie?"
        lines: ["Spielen. Quests. Graben. Angeln.", "Alles flüstert ihr was zu, {player}."]
  eldervale_welcome:
    greet_new: ["Die Luft ist dünn hier oben, {player}. Langsam atmen."]
    greet: ["Wieder auf dem Berg, {player}? Gute Lunge."]
    idle: ["*zieht den Schal enger*", "Schnee bis heute Abend.", "Pass auf den Sims auf, Schätzchen."]
    farewell: ["Bleib von der Kante weg. Ich mein's ernst."]
    topics:
      - label: "Was gibt's hier?"
        lines: ["Erz, das das Festland vergessen hat.", "Und eine Schmiede, die sich an alles erinnert."]
      - label: "Wie tief geht's runter?"
        lines: ["Tief.", "Keiner hat sich zurückgemeldet. Das ist der Witz."]
  eldervale_upgrade:
    greet_new: ["Die Esse glüht, {player}."]
    greet: ["Bring mir Stahl, {player}. Und Steine."]
    idle: ["*Hammerschlag*", "Heißer.", "Der Stein singt."]
  merchant:
    greet_new: ["Ah, {player}! Kundschaft! Oder nur zum Gucken. Beides willkommen."]
    greet: ["{player}! Gute Kisten gefunden?"]
    idle: ["Kisten! Abenteuer in Holz!", "*poliert einen Smaragd*", "Alles muss raus. Irgendwann."]
    farewell: ["Mach alles auf. Trau nichts. Vor allem keinen Mimics."]
    topics:
      - label: "Was verkaufst du?"
        lines: ["Gelegenheit. In Holz verpackt.", "Die Kisten, {player}. Ich verkaufe die Idee von Kisten."]
  isle_clerk:
    greet_new: ["Inselträume, {player}? Level zwanzig. Dann träumen."]
    greet: ["Papierkram? Nein. Nie. Nächster."]
    idle: ["*stempelt nichts*", "Formular 20-B. Gibt's nicht.", "Inseln. Alle wollen Inseln."]
    farewell: ["Geh leveln. Ich bin hier. Ohne Papierkram."]
    topics:
      - label: "Ein Beamter, der Papierkram hasst?"
        lines: ["Ja.", "Ich weiß."]
  forage_pad_guide:
    greet_new: ["Spring aufs Pad, {player}! Alles gut! Fast alles gut!"]
    greet: ["Zurück von der Insel, {player}? Riech mal — Fichte!"]
    idle: ["Boing.", "*wippt auf den Fersen*", "Das Pad ist heute klebrig. Gut klebrig."]
    farewell: ["Aus den Knien springen!"]
    topics:
      - label: "Ist das Pad sicher?"
        lines: ["Total.", "Zu neunzig Prozent total."]
  liquidator:
    greet_new: ["{player}. Die Kristalle flüstern über dich. Meistens Zahlen."]
    greet: ["Kaufen oder schmelzen, {player}?"]
    idle: ["*Kristallsummen*", "Lila ist ein Preis, keine Farbe.", "Schmelzen. Prägen. Wiederholen."]
  canopy_clerk:
    accept: "Proben kommen."
    decline: "Jetzt nicht."
    on_accept: ["Komprimiert, {player}. Ich prüfe das."]
    on_decline: ["Das Blätterdach kann warten. Es ist geduldig."]
    returning:
      - "Compressed Oak, Birch, Spruce, {player}. Inselholz."
      - "Hafenreste zählen nicht. Die rieche ich."
    greet_new: ["{player}. Rinde dabei? Proben, meine ich."]
    greet: ["Mehr Jahresringe, {player}. Gute Saison."]
    idle: ["*schnüffelt an einem Stamm*", "Fichte. Eindeutig Fichte.", "Jahresringe: vierzig. Respektabel."]
    farewell: ["Verantwortungsvoll hacken."]
    topics:
      - label: "Warum Proben?"
        lines: ["Beweis, dass die Insel echtes Holz wachsen lässt.", "Das Blätterdach führt Buch. Ich auch."]
  root_cellar:
    greet_new: ["Hunger, {player}? Alle haben Hunger."]
    greet: ["Frisches Mehl, {player}. Pass auf deine Stiefel auf."]
    idle: ["*mahlt Korn*", "Mehl überall. Überall.", "Karotten legen sich nicht von selbst ein."]
  town_crier:
    greet_new: ["Hört, hört! {player} wandelt unter uns!"]
    greet: ["Oyez, {player}! Nachrichten um elf. Und jetzt."]
    idle:
      - "Hört, hört! Der Manager wohnt in Hotbar-Slot neun!"
      - "Hört, hört! Booster gehören auf den Anvil, nicht in den Mund!"
      - "Hört, hört! Redet mit Fremden! Die haben Quests!"
      - "Hört, hört! Der gelbe Pfeil hat immer recht! Meistens!"
      - "Hört, hört! In der Wildnis spawnen Kisten! Macht Sachen auf!"
    farewell: ["Zieht los! Laut!"]
    topics:
      - label: "Neuigkeiten?"
        lines: ["Der Hafen steht. Die Minen sind staubig. Die Vögel gewinnen.", "Das waren die Nachrichten."]
      - label: "Warum schreist du?"
        lines: ["Flüstern skaliert nicht, {player}."]
  street_sweeper:
    greet_new: ["Stiefel abtreten, {player}."]
    greet: ["Schon wieder da, {player}? Kies dabei? Lass es."]
    idle: ["*fege fege*", "Wer verliert denn einen ganzen Bruchstein?", "Sauberster Platz der Insel. Gern geschehen."]
    farewell: ["Vorsicht, Haufen."]
    topics:
      - label: "Was Seltsames gesehen?"
        lines: ["Einen Trollabdruck bei den Minen. So groß wie ein Boot.", "Hab ihn weggefegt. Beweis weg. Hätte ich nicht tun sollen."]
  lamp_lighter:
    greet_new: ["Der Abend kommt, {player}. Ich spür's."]
    greet: ["Bleib im Licht, {player}."]
    idle: ["*poliert eine Laterne*", "Dämmerung in ein paar Stunden. Bereit.", "Jede Lampe hat einen Namen. Die da heißt Gerald."]
    farewell: ["Halt eine Fackel bereit."]
    topics:
      - label: "Warum Lampen?"
        lines: ["Monster hassen Licht. Ich liebe es. Wir haben einen Waffenstillstand.", "Eigentlich gehen sie mir nur aus dem Weg."]

