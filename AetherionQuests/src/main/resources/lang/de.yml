      - "Ich gebe nicht. Ich kommentiere. Die Drecksarbeit machen die Maschinen."
      - "Das Glas ist hungriger als du, {player}. Füttere es trotzdem."
      - "{player}! Glücksgesicht. Seh ich sofort. Seh ich immer."
  liquidator:
