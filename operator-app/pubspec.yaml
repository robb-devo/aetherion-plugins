name: operator_app
description: Aetherion Operator companion for Windows and Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  intl: any
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope.ttf
    - family: Cinzel
      fonts:
        - asset: fonts/Cinzel.ttf
