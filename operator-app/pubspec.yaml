name: operator_app
description: Aetherion Operator companion for Windows and Android.
publish_to: "none"
version: 0.2.3+5

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.0
  http: ^1.5.0
  intl: any
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope.ttf
    - family: Cinzel
      fonts:
        - asset: fonts/Cinzel.ttf

flutter_launcher_icons:
  android: true
  image_path: assets/brand/discord_guild_icon_1024.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/brand/discord_guild_icon_1024.png
  adaptive_icon_foreground_inset: 0
  windows:
    generate: true
    image_path: assets/brand/discord_guild_icon_1024.png
    icon_size: 256
  web:
    generate: false
