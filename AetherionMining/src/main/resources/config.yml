# Cleared 2026-09-11 — old megamap mine box removed.
# Re-define the Origin mine region when ready.

mine:
  world: world
  pos1:
    x: 0
    y: 0
    z: 0
  pos2:
    x: 0
    y: 0
    z: 0
  blocks:
    IRON_ORE:
      respawn: 30
    GOLD_ORE:
      respawn: 60
    DIAMOND_ORE:
      respawn: 120

veins:
  world: aether_veins
  radius: 250
  hub-y: 220
  # Default Amethyst Area entry when Hub spawn "amethyst" is not planted yet.
  # Robb's spawn anchor / /hubadmin set amethyst overrides this later.
  spawn-x: -119.5
  spawn-y: 220
  spawn-z: -100.5
  spawn-yaw: 0
  spawn-pitch: 0
  # Minimum mining skill for Crystal Guide / first-time /amethyst into the Amethyst Area.
  min-mining-level: 30
  reset-hours: 24
  keep-inventory: true

# Mining Eldervale Island (Blocky Verse) — paste south of Origin slime pad.
# Amethyst Area (aether_veins) player entry is /amethyst or Crystal Guide — not /deepmines.
eldervale:
  world: world
  schematic: Mining-Eldervale-Island.schem
  ignore-air: true
  auto-paste-once: false
  paste:
    x: 22
    y: 90
    z: 580

