# Cleared 2026-09-11 — old megamap mine box removed.
# Re-define the Origin mine region when ready.

mine:
  world: world
  pos1:
    x: 0
    y: 0
    z: 0
  pos2:
    x: 0
    y: 0
    z: 0
  blocks:
    IRON_ORE:
      respawn: 30
    GOLD_ORE:
      respawn: 60
    DIAMOND_ORE:
      respawn: 120

# Amethyst Area = finished BreadBuilds hub in aether_veins + four dig zones around it.
# Dig specialty: NO per-block ore regen — full identical restore every reset-hours.
veins:
  world: aether_veins
  radius: 250
  # hub-y is ignored (stale Deep Veins prototype). Spawn Y below is authoritative.
  hub-y: 18
  # Default entry when Hub spawn "amethyst" is not planted yet.
  # /hubadmin set amethyst (or Dev Menu spawn anchor) overrides this.
  spawn-x: 8.5
  spawn-y: 18
  spawn-z: 8.5
  spawn-yaw: 0
  spawn-pitch: 0
  # Cannot break/place inside this horizontal radius of hub spawn.
  spawn-protect-radius: 20
  # Dig-zone painter never writes inside this radius — BreadBuilds hub stays 1:1.
  dig-hub-clearance: 64
  # Outer ring for the four themed dig zones (defaults to radius-20 when 0).
  dig-outer-radius: 230
  # Fixed seed → identical structure/ores on every 24h reset.
  dig-seed: 20260922
  softlight-on-paint: true
  softlight-min: 7
  softlight-step: 5
  softlight-level: 10
  # Minimum mining skill for Crystal Guide / first-time /amethyst into the Amethyst Area.
  min-mining-level: 30
  reset-hours: 24
  keep-inventory: true

# Mining Eldervale Island (Blocky Verse) — paste south of Origin slime pad.
# Amethyst Area (aether_veins) player entry is /amethyst or Crystal Guide — not /deepmines.
eldervale:
  world: world
  schematic: Mining-Eldervale-Island.schem
  ignore-air: true
  auto-paste-once: false
  paste:
    x: 22
    y: 90
    z: 580
