name: AetherionMining
version: 1.0.0
main: de.aetherion.mining.AetherionMining
api-version: '1.21'
author: Aetherion

depend:
  - AetherionCore
  - WorldGuard

softdepend:
  - AetherionHub
  - AetherionItems
  - WorldEdit

description: Mining areas and The Veins

commands:
  deepmines:
    description: Admin tools for the Amethyst Area dig world (player entry is /amethyst)
    usage: /deepmines [enter|leave|time|npc|reset|eldervale]
    aliases: [veins]
    permission: aetherion.mines.use

permissions:
  aetherion.mines.use:
    default: true
  aetherion.mines.admin:
    default: op
