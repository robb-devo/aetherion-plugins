name: AetherionMining
version: 1.0.0
main: de.aetherion.mining.AetherionMining
api-version: '1.21'
author: Aetherion

depend:
  - AetherionCore
  - WorldGuard

softdepend:
  - AetherionHub
  - AetherionItems
  - WorldEdit

description: Mining Eldervale, the Amethyst Mine (The Veins) and shared-world ore regen

commands:
  amethyst:
    description: Enter the Amethyst Area dig world
    usage: /amethyst
    aliases: [veins]
    permission: aetherion.mines.use
  deepmines:
    description: Admin tools for the Amethyst Area dig world (player entry is /amethyst)
    usage: /deepmines [leave|time|npc|reset|zones|softlight|eldervale]
    permission: aetherion.mines.admin
    permission-message: "Use /amethyst or the Crystal Guide."
  jawcamp:
    description: Travel to Jawcamp, the camp in the Isle-Eater's skull
    usage: /jawcamp
    aliases: [camp]
    permission: aetherion.mines.use
  titan:
    description: Admin tools for the Swallowed Isles (status, churn, tp, camp)
    usage: /titan [status|churn|tp|camp]
    permission: aetherion.mines.admin
  mineisle:
    description: "Mining Eldervale journal, compass and crew tour (admins: reload, dev)"
    usage: "/mineisle [tour|go <place>|stop|map]"
    aliases: [minejournal]
    permission: aetherion.mines.use

permissions:
  aetherion.mines.use:
    default: true
  aetherion.mines.admin:
    default: op
