# The wishing fountain (Fountain Square). Sneak + right-click its water with an empty hand: pay `cost`
# coins, get a fortune; `favour-chance` of the Fountain's Favour (rewards.fountain-favour). One toss a minute.
fountain:
  center: "-0.5 60 -91"
  radius: 12
  cost: 10
