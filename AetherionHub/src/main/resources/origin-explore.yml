# =====================================================================================================
#  Origin Isle - exploration layer (curiosities, storytelling chests, prop spots, ambient life).
#  Same rules as origin.yml: missing keys are merged from the jar on every start, your edits stay.
#  Every spot below was checked against the original map: standable, reachable on foot from the plaza
#  (or from an updraft top; "swim" lilies are a short swim from the shore), and line of sight for look/touch.
# =====================================================================================================

# Curiosities: small hidden finds. kind: step (stand there) | look (hold your gaze on it) | touch (right-click it)
# | listen (sneak and keep still). at = where you stand (for look/touch: a spot it can be seen from).
# target = the block for look/touch. when: any | day | night | dusk | dawn | rain. requires: prop:<spot> = only
# once that prop spot is pasted. Rewards: rewards.curiosity per find, rewards.curio-district per district swept.
curiosity-settings:
  glint-radius: 9          # undiscovered finds glint faintly within this distance (particles on)
  look-hold-checks: 3      # 8-tick checks your gaze must stay on a look-curiosity (~1.2 s)
  listen-checks: 7         # 8-tick checks of sneaking still for a listen-curiosity (~2.8 s)
  milestones:
    curious:       {title: "§dCurious", count: 10, reward: curious, fallback: 300}
    keen_eyed:     {title: "§dKeen-Eyed", count: 25, reward: keen_eyed, fallback: 800}
    lorekeeper:    {title: "§5Lorekeeper", count: 45, reward: lorekeeper, fallback: 1500}
    small_wonders: {title: "§d§lKeeper of Small Wonders", count: 0, reward: small_wonders, fallback: 4000}  # 0 = every curiosity
curiosities:
  fountain_turtles:
    name: "Turtles in Town"
    district: capital
    kind: look
    at: "-42.5 59 -79.5"
    target: "-45 59 -82"
    range: 10
    radius: 0.9
    icon: TURTLE_EGG
    clue: "Someone is keeping something warm by the fountain."
    note: "Turtle eggs in a planter, nowhere near the sea. Nobody admits to putting them there. Everybody checks on them."
  windmill_garden:
    name: "The Windowsill Garden"
    district: capital
    kind: step
    at: "89.5 59 -15.5"
    radius: 3
    icon: FLOWER_POT
    clue: "Under the great mill, somebody grows a desert, a swamp and a beach in pots."
    note: "A cactus, a dripleaf and a clutch of eggs in one tiny garden. The miller calls it the world, small enough to water."
  snow_never_melts:
    name: "The Snow That Stays"
    district: capital
    kind: step
    at: "-99.5 63 -4.5"
    radius: 1.6
    icon: SNOWBALL
    clue: "One handful of winter refuses to leave the Capital."
    note: "A single layer of snow in a sunny lane. It has not melted since the city was built. The scholars measure it every spring."
  capital_roofs:
    name: "Over the Rooftops"
    district: capital
    kind: step
    at: "-86.5 72 -137.5"
    radius: 2.5
    icon: DARK_OAK_TRAPDOOR
    clue: "The Capital looks different from where the cats walk."
    note: "From up here the fountain is a coin and the Grand Stair a ribbon. The tiles are warm. A cat watches you, unimpressed."
  collectors_shelf:
    name: "The Collector's Shelf"
    district: capital
    kind: look
    at: "63.5 64 110.5"
    target: "61 67 112"
    range: 8
    radius: 0.9
    icon: SKELETON_SKULL
    clue: "Behind the Market Hall, somebody keeps a shelf of things that grin."
    note: "Two skulls and three locked ender chests. The label says 'not for sale'. The skulls seem to agree."
  quiet_enchanter:
    name: "The Quiet Enchanter"
    district: capital
    kind: touch
    at: "-59.5 59 -79.5"
    target: "-59 59 -80"
    icon: ENCHANTING_TABLE
    clue: "A reading room by the fountain where the books read back."
    note: "The table hums under your hand, like it remembers somebody. The shelves lean in to listen."
  aurels_specimen:
    name: "Sister Aurel's Specimen"
    district: capital
    kind: touch
    at: "-166.5 61 3.5"
    target: "-167 61 3"
    icon: HORN_CORAL
    clue: "In a hall of lecterns, a piece of the sea is kept dry."
    note: "Horn coral on a scholar's desk, labelled: 'Exhibit One. Proof the sea once reached the city.' There is no Exhibit Two."
  canopy_walk:
    name: "The Canopy Walk"
    district: meres
    kind: step
    at: "131.5 100 -160.5"
    radius: 3
    icon: OAK_LEAVES
    clue: "East of the Mountain Gate grows a tree you can walk across the top of."
    note: "Leaves underfoot, sky overhead. From the crown you can see the harbour masts and the summit at once."
  silent_crew:
    name: "The Silent Crew"
    district: anker_harbour
    kind: look
    at: "305.5 63 -402.5"
    target: "305 64 -406"
    range: 10
    radius: 0.9
    icon: PLAYER_HEAD
    clue: "On the moored ships, part of the crew never goes ashore."
    note: "Carved heads along the rail. Sailors say each one is a captain who never came home. Quill logs them as ballast."
  chartroom:
    name: "The Chartroom"
    district: anker_harbour
    kind: touch
    at: "288.5 64 -292.5"
    target: "288 64 -294"
    icon: CARTOGRAPHY_TABLE
    clue: "Where the twin bells hang, somebody still draws the sea."
    note: "Chart tables and looms: maps on one side, sails on the other. Every chart ends at the island's edge with 'and then the sky'."
  storm_catcher:
    name: "The Storm Catcher"
    district: anker_harbour
    kind: look
    at: "149.5 65 -451.5"
    target: "149 66 -455"
    range: 18
    radius: 0.9
    icon: LIGHTNING_ROD
    clue: "One roof west of the harbour is asking for lightning."
    note: "The only lightning rod on Origin. Old Moll swears it was struck the night the Halcyon first flew."
  lily_raft:
    name: "A Lily Big Enough"
    district: anker_harbour
    kind: step
    at: "325.5 62 -477.5"
    radius: 3
    icon: LILY_PAD
    clue: "Out in the bay grow lilies you could sleep on."
    note: "You climbed onto a lily the size of a raft. It holds. The gulls are furious about it."
  sailors_hex:
    name: "The Sailors' Hex Room"
    district: anker_harbour
    kind: touch
    at: "200.5 65 -317.5"
    target: "201 65 -318"
    icon: ENCHANTED_BOOK
    clue: "Behind the forge, a sailor's superstition has its own table."
    note: "Charms against drowning, against storms, against cats. Every book in here is full of knots."
  whalebone_deck:
    name: "The Whalebone Deck"
    district: anker_harbour
    kind: step
    at: "309.5 66 -398.5"
    radius: 2.5
    icon: BONE
    clue: "One ship in the harbour is built partly from something that used to swim."
    note: "The planks give way to bleached bone. Haul says it's whalebone. Haul has never seen a whale."
  lamp_smith:
    name: "The Lamp Smith's Anvil"
    district: anker_harbour
    kind: touch
    at: "129.5 63 -441.5"
    target: "130 64 -442"
    icon: ANVIL
    clue: "West of the harbour, a lamp post was forged right where it stands."
    note: "An anvil and a cauldron under a sea-lantern lamp. The lamplighter mends his own posts. Don't mention the lean."
  frosted_shelf:
    name: "The Frosted Shelf"
    district: seawatch
    kind: step
    at: "429.5 74 -374.5"
    radius: 3
    icon: SNOW_BLOCK
    clue: "On Seawatch, a red cap wears snow in summer."
    note: "Snow on a giant red cap, a whole season out of place. The sea wind keeps it cold and the gulls keep it company."
  listening_cap:
    name: "The Listening Cap"
    district: seawatch
    kind: listen
    at: "421.5 61 -429.5"
    radius: 3
    icon: BROWN_MUSHROOM
    sound: BLOCK_CONDUIT_AMBIENT_SHORT
    clue: "Under a broad brown cap by the shore, the sea sounds different."
    note: "Crouched under the cap you hear the bay as if through a shell: boats, bells, and a voice calling a name you almost catch."
  white_seam:
    name: "The White Seam"
    district: ore_ridge
    kind: step
    at: "156.5 93 -315.5"
    radius: 3
    icon: CALCITE
    clue: "High on the ridge, the rock turns pale as milk."
    note: "Chalk-white calcite breaks the surface, full of tiny scratches where someone once tried to write a name."
  too_good:
    name: "Too Good to Be True"
    district: ore_ridge
    kind: step
    at: "62.5 58 -358.5"
    radius: 3
    icon: DIAMOND
    clue: "Somewhere under Ore Ridge the floor is worth a fortune. Probably."
    note: "The floor glitters blue-white. A sign once read DO NOT PRY. Someone pried. Miss Ledger says it's painted stone."
  gilded_ledge:
    name: "The Gilded Ledge"
    district: skyreach
    kind: step
    at: "-49.5 171 -256.5"
    radius: 3
    icon: GOLD_BLOCK
    clue: "Below the Golden Willows, something drips and sets."
    note: "Where the willows drip gold it pools and hardens into a ledge. Pim would weep."
  violet_bloom:
    name: "The Violet Bloom"
    district: skyreach
    kind: step
    at: "12.5 183 -241.5"
    radius: 3
    icon: PURPLE_DYE
    clue: "Near the summit, a flower big enough to stand in."
    note: "Purple petals as wide as a room. Up here even the flowers forgot to stop growing."
  hermits_seat:
    name: "The Hermit's Seat"
    district: skyreach
    kind: step
    at: "-137.5 162 -269.5"
    radius: 2.5
    icon: TUFF
    clue: "On Skyreach's west shoulder there's a stone chair worn smooth."
    note: "A seat-shaped rock, polished by years of sitting. Moss says he came up here before the city got loud."
  topmost_mushroom:
    name: "The Topmost Mushroom"
    district: skyreach
    kind: step
    at: "-95.5 197 -265.5"
    radius: 2.5
    icon: BROWN_MUSHROOM
    clue: "The highest mushroom on Origin grows among the willow roots."
    note: "A brown cap clinging to the roots at the top of the world. Fen Glowmoor wants a cutting. Fen will not climb."
  cliff_bloom:
    name: "The Cliff Bloom"
    district: skyreach
    kind: step
    at: "4.5 126 -345.5"
    radius: 3
    icon: PURPLE_CONCRETE
    clue: "On Skyreach's north face, a bloom hangs over nothing."
    note: "A violet bloom clings to the north cliff with its petals over the drop. The wind tugs. It doesn't let go."
  giants_stump:
    name: "The Giant's Stump"
    district: whisperwood
    kind: step
    at: "-383.5 76 -547.5"
    radius: 2.5
    icon: STRIPPED_SPRUCE_LOG
    clue: "In the north woods, a tree so old it is now a floor."
    note: "Wide enough to dance on, and somebody did: there are scuff marks in a perfect circle."
  above_birches:
    name: "Above the Birches"
    district: whisperwood
    kind: step
    at: "-249.5 92 -260.5"
    radius: 3
    icon: BIRCH_LEAVES
    clue: "By the Crossing Bridge, the birches hold up a second floor."
    note: "You're standing on birch leaves high above the road. They hold. The river below is a pencil line."
  river_words:
    name: "What the River Says"
    district: whisperwood
    kind: listen
    at: "-268.5 57 -260.5"
    radius: 3
    icon: OAK_PLANKS
    sound: BLOCK_WATER_AMBIENT
    clue: "Stand still on the old bridge and the Whisper earns its name."
    note: "Under the planks the river says the same three words over and over. Nobody agrees on what they are."
  old_trap:
    name: "An Old Trap"
    district: whisperwood
    kind: look
    at: "-283.5 58 -239.5"
    target: "-287 59 -240"
    range: 8
    radius: 0.9
    icon: DISPENSER
    clue: "On the west road, something is still aiming at travellers."
    note: "A dispenser in the bridge-house wall, pointed at the road. Empty. Probably. The tollkeeper denies everything."
  brazier_walk:
    name: "The Brazier Keeper's Walk"
    district: whisperwood
    kind: step
    at: "-265.5 78 -503.5"
    radius: 2.5
    icon: CAMPFIRE
    clue: "Above the Old Shrine, the braziers need someone to tend them."
    note: "Up by the braziers the stones are warm even at dawn. Somebody left a broom and a very old sandwich."
  moon_on_the_lake:
    name: "Moon on Lily Lake"
    district: whisperwood
    kind: step
    at: "-444.5 58 -337.5"
    radius: 3
    when: night
    icon: LILY_PAD
    clue: "Lily Lake keeps one lily for the moon. Visit after dark."
    note: "Out on the great lily at night the lake goes still and the moon sits in it like a coin. Even the frogs hush."
  flat_top_tree:
    name: "The Flat-Top Tree"
    district: whisperwood
    kind: step
    at: "-306.5 79 -280.5"
    radius: 2.5
    icon: ACACIA_LEAVES
    clue: "Near the bridge, one tree grew flat on top, like a table."
    note: "An acacia far from anywhere acacias belong, with a crown you can stand on. Someone left a trail of picnic crumbs."
  night_choir:
    name: "The Night Choir"
    district: whisperwood
    kind: listen
    at: "-392.5 66 -343.5"
    radius: 3
    when: night
    icon: BROWN_MUSHROOM_BLOCK
    sound: ENTITY_ALLAY_AMBIENT_WITHOUT_ITEM
    clue: "Under the big cap by Lily Lake, the night sings if you let it."
    note: "Something small and many, singing in rounds. It stops the moment you stand up."
  moss_throne:
    name: "The Moss Throne"
    district: bloomfield
    kind: step
    at: "-73.5 73 -545.5"
    radius: 2.5
    icon: MOSS_BLOCK
    clue: "North of the Bloom Road, a hill wears a green chair."
    note: "A mossy hump shaped exactly like a throne. Sit, and the blossoms below look like a crowd."
  north_lip:
    name: "The North Lip"
    district: bloomfield
    kind: step
    at: "38.5 80 -591.5"
    radius: 3
    icon: RAW_IRON
    clue: "Where Bloomfield ends, the island's lip shows its ore."
    note: "Iron and copper in the very edge of the island. Beyond it nothing, just sky, all the way down."
  fools_gold:
    name: "Fool's Gold"
    district: bloomfield
    kind: look
    at: "-76.5 58 -533.5"
    target: "-77 59 -537"
    range: 10
    radius: 0.9
    icon: GILDED_BLACKSTONE
    clue: "Among Bloomfield's stones, a glitter that isn't quite gold."
    note: "Gilded blackstone, a fleck of somewhere hotter in a meadow. Odds Mulligan has sold a piece of it twice."
  sulking_cap:
    name: "The Sulking Cap"
    district: colosseum
    kind: step
    at: "-452.5 65 -147.5"
    radius: 3
    icon: RED_MUSHROOM
    clue: "West of the arena, a red cap low enough to climb."
    note: "A giant red mushroom with a dent in the top, just your size. Fighters come here to sulk after losing."
  fallen_candle:
    name: "A Candle for the Fallen"
    district: colosseum
    kind: step
    at: "-395.5 64 -81.5"
    radius: 2
    icon: CANDLE
    clue: "South of the arena, one candle is kept for someone."
    note: "A grey candle and a dripleaf by a stone plate. No name. The Proctor says: everyone who lost here, once."
  silver_cap:
    name: "The Silver Cap"
    district: glowcap_crags
    kind: step
    at: "-434.5 69 268.5"
    radius: 3
    icon: IRON_BLOCK
    clue: "Near the Twin Glowcaps, one mushroom turned to metal."
    note: "This cap rings when you stamp on it. Fen Glowmoor says it's just a phase."
  copper_shelf:
    name: "The Copper Shelf"
    district: glowcap_crags
    kind: step
    at: "-382.5 96 150.5"
    radius: 2.5
    icon: RAW_COPPER
    clue: "Halfway up the crags, the rock turns green-gold."
    note: "A shelf of copper ore underfoot, weathering slowly. In a hundred years it'll match the moss."
  mud_springs:
    name: "The Mud Springs"
    district: glowcap_crags
    kind: step
    at: "-342.5 83 21.5"
    radius: 3
    icon: MUD
    clue: "Below Crag Peak, the ground goes soft and warm."
    note: "Warm mud between the rocks. Your boots will never be the same. Locals swear it's good for the knees."
  dreaming_hollow:
    name: "The Dreaming Hollow"
    district: glowcap_crags
    kind: step
    at: "-366.5 74 149.5"
    radius: 3
    when: night
    icon: GLOWSTONE_DUST
    clue: "Under the giant caps of the crags, a hollow that only wakes at night."
    note: "After dark the stems around this hollow glow faintly, as if the mushrooms are dreaming out loud."
  southern_lily:
    name: "The Southern Lily"
    district: glowcap_crags
    kind: step
    at: "-332.5 57 293.5"
    radius: 3
    icon: LILY_PAD
    clue: "In the crags' south pond, one lily is big enough for a nap."
    note: "A raft of lily with a quartz step carved into its edge. Who carves a lily?"
  hay_mountain:
    name: "Hay Mountain"
    district: clucksworth
    kind: step
    at: "-261.5 62 200.5"
    radius: 3
    icon: HAY_BLOCK
    clue: "Behind the big barn, the hay piles higher than the roof wants."
    note: "You climbed the hay. Everyone does once. The chickens are still talking about it."
  quench_cauldron:
    name: "The Quench Cauldron"
    district: clucksworth
    kind: touch
    at: "-159.5 65 214.5"
    target: "-160 65 215"
    icon: WATER_BUCKET
    clue: "At the farm smithy, the water still hisses."
    note: "The smith's quench, still full. Warm, and it smells of iron. The twin bells hang right overhead."
  unlucky_anvil:
    name: "The Unlucky Anvil"
    district: clucksworth
    kind: touch
    at: "-145.5 67 173.5"
    target: "-145 68 173"
    icon: CHIPPED_ANVIL
    clue: "In Clucksworth a cracked anvil is kept for luck. Bad luck."
    note: "Chipped, cracked and still in use. They swear every tool forged on it breaks on a Tuesday."
  turnip_head:
    name: "Old Turnip-Head"
    district: clucksworth
    kind: look
    at: "-164.5 59 139.5"
    target: "-163 62 141"
    range: 10
    radius: 0.9
    icon: CARVED_PUMPKIN
    clue: "Something in the fields has been watching the crows for years."
    note: "A scarecrow with a pumpkin face and a chain for a belt. The crows stopped being afraid. Now they sit on his shoulders."
  shabby_deep:
    name: "The Shabby Deep"
    district: southwood
    kind: step
    at: "-28.5 48 246.5"
    radius: 4
    icon: IRON_ORE
    clue: "Under Mine Hill, the old tunnels go deeper than the maps."
    note: "Iron in the walls, cold air and old footprints. The Shabby Mine has a downstairs nobody mentions."
  sponge_gallery:
    name: "The Sponge Gallery"
    district: southwood
    kind: step
    at: "-62.5 45 263.5"
    radius: 4
    icon: SPONGE
    clue: "The old mine has a room where the walls drink."
    note: "Dry sponge in the rock, soaking up every drip. Someone drained a flooded tunnel and forgot to take the sponges home."
  wild_honey:
    name: "Wild Honey"
    district: southwood
    kind: touch
    at: "-7.5 100 245.5"
    target: "-9 100 245"
    icon: HONEYCOMB
    sound: BLOCK_BEEHIVE_WORK
    clue: "On Mine Hill, the bees built something bigger than a hive."
    note: "Honeycomb grown into the hilltop itself. Hettie would pay for this spot. Don't tell her you found it first."
  gold_in_the_moss:
    name: "Gold in the Moss"
    district: southwood
    kind: step
    at: "-11.5 105 256.5"
    radius: 2.5
    icon: RAW_GOLD
    clue: "The very crown of Mine Hill hides a fortune under the moss."
    note: "Raw gold and emerald in the hilltop, right under the moss. The mine below digs sideways. Nobody thought to dig up."
  still_digging:
    name: "Someone Still Digging"
    district: southwood
    kind: listen
    at: "45.5 49 244.5"
    radius: 3
    icon: IRON_PICKAXE
    sound: BLOCK_DEEPSLATE_HIT
    clue: "At the east end of the old mine, keep still and listen."
    note: "Tap. Tap. Tap. A pickaxe somewhere in the rock. When you hold your breath, it stops too."
  hilltop_reef:
    name: "The Hilltop Reef"
    district: southwood
    kind: step
    at: "73.5 96 271.5"
    radius: 2.5
    icon: FIRE_CORAL
    clue: "East of the mine, a reef grew on a hill far from any sea."
    note: "Fire coral, dry and red, on a hilltop. Either the sea was once very high here, or someone is very good at lying."
  pit_floor:
    name: "The Bottom of the Pit"
    district: borderlands
    kind: step
    at: "218.5 23 278.5"
    radius: 4
    icon: PODZOL
    clue: "The Borderlands sinkhole has a floor. Few have stood on it."
    note: "Down here the sky is a coin and the wind can't reach you. Old spruce boards underfoot: someone lived here once."
  pits_coin:
    name: "The Pit's Coin"
    district: borderlands
    kind: step
    at: "237.5 23 292.5"
    radius: 1.6
    icon: GOLD_BLOCK
    clue: "At the bottom of the sinkhole, one block shines."
    note: "One block of gold at the bottom of the pit, set like a coin in a fountain. A wish? A payment? The pit isn't saying."
  soul_prints:
    name: "Soul Prints"
    district: borderlands
    kind: step
    at: "384.5 62 214.5"
    radius: 2
    icon: SOUL_SAND
    clue: "In the east of the wastes, footprints that hum when you stand in them."
    note: "Soul sand in the shape of footprints, leading nowhere. Stand in one and you feel slow, and a little sad."
  giants_heartbeat:
    name: "The Giant's Heartbeat"
    district: borderlands
    kind: listen
    at: "298.5 64 133.5"
    radius: 4
    icon: BONE
    sound: ENTITY_WARDEN_HEARTBEAT
    clue: "Inside the Ribcage, crouch where the heart used to be."
    note: "Thump. Thump. Slow as weather. Vex says it's the ground settling. Vex doesn't come in here."
  pit_lights:
    name: "Pit Lights"
    district: borderlands
    kind: look
    at: "249.5 36 262.5"
    target: "250 40 262"
    range: 36
    radius: 2.5
    when: night
    icon: GLOWSTONE_DUST
    clue: "At night, lights drift in the Borderlands sinkhole. Look at them."
    note: "Will-o'-wisps in the pit, circling something you can't see. They blinked back at you."
  bone_stair:
    name: "The Bone Stair"
    district: borderlands
    kind: step
    at: "278.5 60 239.5"
    radius: 3
    icon: BONE_BLOCK
    clue: "On the pit's rim, steps made of something that used to walk."
    note: "A stair of bone down the sinkhole's edge. Every step is a different shade of old."
  hetties_smoker:
    name: "Hettie's Smoker"
    district: eastwood
    kind: touch
    at: "274.5 61 -10.5"
    target: "273 63 -11"
    icon: CAMPFIRE
    sound: BLOCK_CAMPFIRE_CRACKLE
    clue: "Beside the Old Mead House, a fire that never quite goes out."
    note: "A netherrack hearth for the bee smoker. A puff calms the hive. Hettie says it calms beekeepers too."
  hive_wall:
    name: "The Hive Wall"
    district: eastwood
    kind: listen
    at: "311.5 61 -37.5"
    radius: 3
    icon: BEEHIVE
    sound: BLOCK_BEEHIVE_WORK
    clue: "At the Mead House, put your ear to the hives."
    note: "The hive wall thrums like a choir holding one long note. Somewhere inside, a queen is giving orders."
  lumberjacks_umbrella:
    name: "The Lumberjack's Umbrella"
    district: eastwood
    kind: step
    at: "397.5 65 -274.5"
    radius: 3
    icon: BROWN_MUSHROOM_BLOCK
    clue: "In Eastwood a brown cap shelters the woodcutters' lunch."
    note: "The lumberjacks eat under this cap when it rains. Their initials are carved in the stem. One of them is just NO."
  library_rain:
    name: "Rain on the Library"
    district: capital
    kind: listen
    at: "-51.5 60 104.5"
    radius: 3
    when: rain
    icon: BOOKSHELF
    sound: WEATHER_RAIN_ABOVE
    clue: "When it rains, the Great Library has something to say."
    note: "Inside, between the shelves, the rain on the roof sounds like two hundred pages turning at once."
  mere_rain_choir:
    name: "The Rain Choir"
    district: meres
    kind: step
    at: "228.5 55 -149.5"
    radius: 3
    when: rain
    icon: LILY_PAD
    sound: ENTITY_FROG_AMBIENT
    clue: "The Great Mere only sings when it rains."
    note: "Every frog in the Meres starts at once, as if the rain were a cue. It is. They've been rehearsing."
  last_light:
    name: "The Last Light"
    district: glowcap_crags
    kind: look
    at: "-418.5 97 -46.5"
    target: "-449 101 -47"
    range: 36
    radius: 3
    when: dusk
    icon: CLAY_BALL
    clue: "From Sunset Bluff, watch the sky past the edge at dusk."
    note: "For one moment the light goes green out over nothing, and then it's gone. You saw it. Nobody believes you."
  first_light:
    name: "First Light"
    district: skyreach
    kind: step
    at: "-5.5 200 -268.5"
    radius: 4
    when: dawn
    icon: SUNFLOWER
    clue: "Be on the summit when the sun comes up."
    note: "The first light of the day hits Skyreach before anything else on Origin. For a minute the whole island is still asleep but you."
  fallen_anchor:
    name: "The Fallen Anchor"
    district: glowcap_crags
    kind: look
    at: "-445.5 56 -96.5"
    target: "-458 66 -98"
    range: 26
    radius: 1.6
    requires: prop:fallen_anchor
    icon: ANVIL
    clue: "Out west, past the arena, something heavy came down out of the sky."
    note: "An anchor taller than a house, driven into the meadow. Hesper Kael's people camp in its shadow and don't talk about the chain."

# Storytelling chests. place: chest | barrel (put on an empty, checked spot once; undo removes exactly those)
# | existing (a container the map already had). Opening one shows a per-player view: the note (a book) and,
# the first time, a little flavour loot + rewards.tale coins. loot: "MATERIAL amount Name | lore | lore".
tale-settings:
  auto-place: true         # first start places the missing chests once (recorded in origin-tales.yml)
  glint-radius: 8
tales:
  quills_log:
    name: "Quill's Harbour Log"
    district: anker_harbour
    at: "214 64 -397"
    place: existing
    author: "Quill, Harbourmaster"
    clue: "The harbourmaster keeps a log nobody is supposed to read."
    note:
      - "§lDay 4,117.§r\nTide normal. Gulls abnormal. The Halcyon came in eleven minutes late. The captain blamed the wind. The wind declined to comment."
      - "§lDay 4,118.§r\nOne crate overboard. Contents: hats. The fish are wearing them now. Do not log this.\n\n(Logged.)"
      - "§lDay 4,119.§r\nA stranger asked where the sea ends. Told them: it doesn't. The island does. They went quiet. Most do."
    loot:
      - "PAPER 1 §fTorn Tide Table | §7High water at noon, they say."
      - "COD 2 §fYesterday's Catch"
  unsent_letter:
    name: "A Letter That Never Sailed"
    district: anker_harbour
    at: "307 63 -409"
    place: existing
    author: "R., deckhand"
    clue: "On a moored ship, a letter is still waiting for the mail boat."
    note:
      - "Dear Mira,\n\nThe ship is fine. The food is not. I've learned eleven knots and forgotten your birthday, which is why this letter is late."
      - "They say the Halcyon flies over places nobody has walked. I'd like to see one. I'd like more to see you.\n\nTell the chickens hello.\n\n— R."
    loot:
      - "PAPER 1 §fSealed Letter | §7To: Mira, Clucksworth. | §8It was never sent."
      - "STRING 3"
  confiscated:
    name: "Confiscated at Customs"
    district: anker_harbour
    at: "168 64 -475"
    place: existing
    author: "Customs Office, Anker Harbour"
    clue: "North of the docks, Customs keeps what it took."
    note:
      - "§lSEIZED:§r\n1 bottle, label 'NOT RUM'. Is rum.\n3 sacks sugar, declared as 'sand, sweet'.\n1 parrot (escaped)."
      - "§lSEIZED:§r\n1 map to 'treasure'. The treasure is the Fish Market. Owner fined for wasting everyone's afternoon."
    loot:
      - "GLASS_BOTTLE 1 §fBottle, 'NOT RUM' | §7Empty. Of course it's empty."
      - "SUGAR 3"
  clucksworth_ledger:
    name: "The Clucksworth Ledger"
    district: clucksworth
    at: "-282 59 124"
    place: existing
    author: "Mira Thatch, Clucksworth"
    clue: "A farm office keeps careful count of something that clucks."
    note:
      - "§lEggs this week§r\nDuchess: 7\nPepper: 6\nOld Ruth: 0 (retired, refuses to discuss it)\nThe Baron: 1\n(The Baron is a rooster. Investigating.)"
      - "Note to self: write back to R. at the harbour. Tell him the chickens say hello.\n\nThey don't. Tell him anyway."
    loot:
      - "EGG 2 §fPrize Egg | §7Laid by Duchess, apparently."
      - "WHEAT_SEEDS 8"
  smithy_orders:
    name: "Orders for the Farm Smithy"
    district: clucksworth
    at: "-213 61 174"
    place: existing
    author: "the Farm Smithy"
    clue: "Near the barn, the smith's order book lies open."
    note:
      - "Hoe, mended.\nHoe, mended again.\nSame hoe. Tell Pepper's owner to stop hitting stones with it.\n\nBell brackets, two. The twin bells need a rest."
      - "Special order: one anvil, uncracked.\n\nCancelled. Apparently the cracked one is 'tradition'."
    loot:
      - "IRON_NUGGET 4 §fBent Nails"
      - "FLINT 1"
  misfiled_papers:
    name: "Misfiled Papers"
    district: capital
    at: "107 58 -1"
    place: existing
    author: "Miss Ledger"
    clue: "East of the plaza, a chest of papers that belong somewhere else."
    note:
      - "Form 7-B: Request to be excused from Form 7-A.\nStatus: misfiled.\n\nForm 12: Application to name the fountain.\nStatus: denied. It already has a name. The name is 'the fountain'."
      - "If found, return to Ledger's Court. Do not read.\n\nIf you have read this, please file Form 7-C (Regret)."
    loot:
      - "PAPER 2 §fForm 7-C (Regret) | §7Stamped twice. Approved by nobody."
      - "INK_SAC 1"
  mead_book:
    name: "Hettie's Mead Book"
    district: eastwood
    at: "290 61 -8"
    place: existing
    author: "Hettie Comb"
    clue: "Among the casks of the Mead House, one barrel holds a recipe."
    note:
      - "§lOld Mead§r\nHoney from the north yard. Never the south: the south bees are moody.\nWater from the pond.\nPatience: one winter."
      - "Do not tell the queen what the honey is for. She knows. She pretends not to. It's a whole thing."
    loot:
      - "HONEY_BOTTLE 1 §6Jar of Old Mead | §7Hettie's. Ask nicely."
      - "HONEYCOMB 2"
  moss_cache:
    name: "Notes on Listening"
    district: whisperwood
    at: "-406 59 -234"
    place: chest
    facing: east
    author: "Moss"
    clue: "Near the hermit's hollow, someone keeps notes about silence."
    note:
      - "Things I have heard in Whisperwood:\n\nA fox laughing.\nThe river saying three words.\nA tree falling with nobody there. It made a sound. I checked."
      - "If you are reading this, sit down.\n\nNot for long. Long enough."
    loot:
      - "SWEET_BERRIES 6 §fForest Berries"
      - "PAPER 1 §fA Pressed Leaf | §7From the oldest tree. Probably."
  shrine_roster:
    name: "The Brazier Roster"
    district: whisperwood
    at: "-285 69 -493"
    place: chest
    facing: north
    author: "Keepers of the Old Shrine"
    clue: "Below the Old Shrine, a duty roster nobody follows."
    note:
      - "Brazier duty:\nMonday: Ilse\nTuesday: Ilse\nWednesday: Ilse\nEveryone else: 'busy'.\n\n(Ilse would like a word.)"
      - "The fires on the tower have not gone out in two hundred years. Ilse would like it known that she lit most of them."
    loot:
      - "CANDLE 2"
      - "CHARCOAL 3 §fBrazier Charcoal"
  frog_census:
    name: "Lily Lake Frog Census"
    district: whisperwood
    at: "-420 59 -358"
    place: chest
    facing: south
    author: "Fen Glowmoor, amateur naturalist"
    clue: "On Lily Lake's shore, somebody tried to count the frogs."
    note:
      - "Frogs counted: 41.\nFrogs counted again: 38.\nFrogs that were the same frog: unclear.\nFrogs that looked at me funny: all of them."
      - "Conclusion: the frogs are fine.\n\nRecommendation: stop counting frogs."
    loot:
      - "LILY_PAD 2"
      - "SLIME_BALL 1 §fFrog Spit | §7Allegedly lucky."
  star_chart:
    name: "Stellan's Star Chart"
    district: skyreach
    at: "-4 198 -268"
    place: chest
    facing: east
    author: "Stellan Voss"
    clue: "On the summit, the stargazer keeps his charts out of the wind."
    note:
      - "The bright one over the harbour is not a star. It is the Halcyon's lamp.\n\nI have named it anyway: Persistence."
      - "The aurora comes from the north. The starfall comes from everywhere.\n\nMake your wish quickly. The sky does not wait."
    loot:
      - "GLOWSTONE_DUST 3 §eStardust | §7Swept off the summit."
      - "FEATHER 1"
  willow_postcard:
    name: "A Postcard from the Willows"
    district: skyreach
    at: "-81 192 -259"
    place: chest
    facing: east
    author: "a tourist, years ago"
    clue: "Under the Golden Willows, a postcard nobody posted."
    note:
      - "Wish you were here! The willows drip actual gold. Don't tell anyone.\n\nThe updraft was terrifying. Would do again."
      - "P.S. If a nervous man called Pim ever asks: YES. It is worth the climb."
    loot:
      - "GOLD_NUGGET 3 §6Willow Gold | §7It drips. Then it doesn't."
  slag_drafts:
    name: "The Slag Poet's Drafts"
    district: ore_ridge
    at: "79 66 -352"
    place: chest
    facing: west
    author: "the Slag Poet"
    clue: "On Ore Ridge, a poet threw away his best attempts."
    note:
      - "§oO slag, grey slag,\nthou stuff of slag...§r\n\n(crossed out)"
      - "§oThe ridge is iron,\nthe iron is sleep,\nthe miners dig\nand the mountain weeps.§r\n\nBetter. Still not about slag."
    loot:
      - "COAL 3"
      - "PAPER 1 §fA Poem About Slag | §7It rhymes 'slag' with 'slag'."
  shift_log:
    name: "Shift Log, Shabby Mine"
    district: southwood
    at: "33 55 180"
    place: chest
    facing: north
    author: "Foreman Dunn"
    clue: "By the Mine Road, the foreman's log waits for the next shift."
    note:
      - "Shift 1: iron.\nShift 2: iron.\nShift 3: tapping in the east tunnel. Nobody down there. Sent Wilks. Wilks came back. Wilks would not say."
      - "Shift 4: the sponges in the deep gallery drank the flood. Good sponges.\n\nDo not wring the sponges."
    loot:
      - "TORCH 6"
      - "BREAD 2 §fMiner's Lunch | §7Slightly dusty."
  vex_orders:
    name: "Standing Orders"
    district: borderlands
    at: "160 58 77"
    place: chest
    facing: north
    author: "Sgt. Vex"
    clue: "At Vex's Gate, the sergeant's orders are kept somewhere obvious."
    note:
      - "§lORDER 1:§r Stay behind the line.\n§lORDER 2:§r See Order 1.\n§lORDER 3:§r No, the Ribcage is not 'just bones'."
      - "If you are reading this, you crossed the line to reach the chest.\n\nWe will be discussing this."
    loot:
      - "ARROW 8"
      - "PAPER 1 §fStanding Order | §7STAY BEHIND THE LINE."
  warden_notes:
    name: "Margins of the Rite"
    district: borderlands
    at: "250 59 171"
    place: chest
    facing: south
    author: "the Rite Warden"
    clue: "Near the Rite Circle, the warden writes in the margins."
    note:
      - "The stones are not a door. People keep asking.\n\nThe stones are a promise: whatever fell here stays here."
      - "Light no fires in the circle. Speak no names in the pit.\n\nLeave the gold where it lies. That one is for someone else."
    loot:
      - "BONE 3"
      - "CANDLE 1"
  pit_camp:
    name: "The Last Camp in the Pit"
    district: borderlands
    at: "218 23 277"
    place: chest
    facing: south
    author: "unsigned"
    clue: "At the bottom of the sinkhole, somebody once made camp."
    note:
      - "We came down for the gold and stayed for the quiet. Up there the wind never stops. Down here it can't reach."
      - "Lights at night. Not ours. They don't come close. We don't go close.\n\nMutual respect."
    loot:
      - "BOWL 1"
      - "STICK 4"
      - "PAPER 1 §fA Child's Drawing | §7The sky, drawn as a small circle."
  molls_wager:
    name: "Old Moll's Wager"
    district: seawatch
    at: "406 56 -399"
    place: chest
    facing: north
    author: "Old Moll"
    clue: "On Seawatch, across the bay from the lighthouse, a bet is written down."
    note:
      - "I bet that gull my spectacles it couldn't reach the top of the lighthouse.\n\nIt could. It did. It kept the spectacles."
      - "If you see a gull wearing spectacles, it owes me forty years of reading."
    loot:
      - "GLASS_PANE 1 §fMoll's Spare Lens | §7Cracked. Still better than the gull's."
      - "FEATHER 2 §fGull Feather"
  oak_grievances:
    name: "Grievances of the Oaks"
    district: eastwood
    at: "352 66 -329"
    place: chest
    facing: north
    author: "the Lumberjack, for the oaks"
    clue: "At the lumber camp, a list of complaints from the trees."
    note:
      - "The oaks wish to state:\n1. They were here first.\n2. Axes are rude.\n3. They accept saplings as an apology."
      - "The lumberjack wishes to state: he plants three for every one he cuts.\n\nThe oaks have not acknowledged this."
    loot:
      - "OAK_SAPLING 1 §fAn Apology Sapling"
      - "STICK 3"
  betting_slips:
    name: "Ringside Betting Slips"
    district: colosseum
    at: "-332 62 -128"
    place: chest
    facing: north
    author: "Odds Mulligan's runners"
    clue: "Outside the Colosseum, the bookie's runners stash their slips."
    note:
      - "Slip 1: 10 on the challenger. LOST.\nSlip 2: 10 on the champion. LOST.\nSlip 3: 10 on 'nobody'. Under review."
      - "House rules: the house wins. Exceptions: none.\n\nOdds Mulligan would like you to know he is a fair man."
    loot:
      - "PAPER 3 §fLosing Slips"
      - "GOLD_NUGGET 2 §6Change from a Bet"
  fens_diary:
    name: "Fen's Glowcap Diary"
    district: glowcap_crags
    at: "-407 64 243"
    place: chest
    facing: east
    author: "Fen Glowmoor"
    clue: "Near the Twin Glowcaps, the tender's diary is tucked away."
    note:
      - "Day 1: the Twin Glowcaps are not twins. One is older.\n\nDo not tell the younger one."
      - "Day 40: tried to grow a cutting. It glowed for a week and then sulked.\n\nI understand completely."
    loot:
      - "GLOW_BERRIES 3"
      - "BROWN_MUSHROOM 2"
  pickers_map:
    name: "A Flower Picker's Map"
    district: bloomfield
    at: "-41 55 -445"
    place: chest
    facing: north
    author: "a picker from Bloomfield"
    clue: "By the Bloom Road, a picker hid a map of every flower."
    note:
      - "X marks a bloom. There are many X's. That's the whole map. It's mostly X's.\n\nI may have overdone it."
      - "Best blossoms: north of the road, under the big tree.\n\nSecond best: everywhere else."
    loot:
      - "PINK_PETALS 4"
      - "PAPER 1 §fPicker's Map | §7Every X is a bloom. There are a lot of X's."

