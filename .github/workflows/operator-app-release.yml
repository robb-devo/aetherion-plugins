name: Operator app release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag / release name (operator-app-0.2.3 or operator-app-apk-YYYYMMDD)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "operator-app-*"

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: operator-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            operator-app-*) ;;
            *) echo "Tag must start with operator-app-"; exit 1 ;;
          esac

      - name: Pub get and test
        run: |
          flutter pub get
          flutter gen-l10n
          flutter test
          flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Package APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/operator_app_release.apk"
          sha256sum "$GITHUB_WORKSPACE/operator_app_release.apk" \
            > "$GITHUB_WORKSPACE/operator_app_release.apk.sha256"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Aetherion Operator ${{ steps.meta.outputs.tag }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            operator_app_release.apk
            operator_app_release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-zip:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: operator-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            operator-app-*) ;;
            *) echo "Tag must start with operator-app-"; exit 1 ;;
          esac

      - name: Pub get
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter gen-l10n

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip Windows release
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) {
            $src = Get-ChildItem -Path "build\windows" -Recurse -Directory |
              Where-Object { $_.Name -eq 'Release' -and $_.FullName -match 'runner' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $src) { throw "Windows Release folder not found" }
          $out = Join-Path $env:GITHUB_WORKSPACE "operator_app_windows.zip"
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath $out -Force
          Get-FileHash $out -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  operator_app_windows.zip" } |
            Set-Content (Join-Path $env:GITHUB_WORKSPACE "operator_app_windows.zip.sha256")
          Get-Item $out | Format-List FullName, Length

      - name: Attach Windows zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Aetherion Operator ${{ steps.meta.outputs.tag }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            operator_app_windows.zip
            operator_app_windows.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
