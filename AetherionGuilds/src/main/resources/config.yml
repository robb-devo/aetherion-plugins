max-members: 50
invite-seconds: 300
island-spacing: 512
island-world: aether_guilds
personal-island-spacing: 512
personal-island-world: aether_islands
minion-interval-seconds: 10
max-quarry-level: 7
island-build-radius: 24
reset-islands: false
# Name of this server in island saves (islands/<id>.yml record who wrote them). Empty: "port-<port>".
# Islands should live on one server (the island server); a save changed by another server is never overwritten.
server-id: ""

# --- Island highlight (starters, land, structures, belts, guild projects) -----------------------
# All keys are optional; the plugin uses these defaults when a key is missing (existing configs keep working).
# Templates live in plugins/AetherionGuilds/templates/*.schem (extracted once, never overwritten).
# Re-author any of them with WorldEdit (//schem save), drop the file there, then /island admin reload-templates.
paste-blocks-per-tick: 3000
land:
  parcel-base: 2500        # personal: coins per 16x16 parcel x (parcels owned - 8)
  guild-parcel-base: 10000 # guild: from the guild bank
logistics:
  belt-extra-coins: 0      # coins per belt tile on top of its 1 Cobblestone from storage (0 = goods only)
  max-run: 64              # longest single belt lay
  cargo-per-island: 36     # visible cargo ItemDisplays per island (cosmetic)
  cargo-global: 240
  conveyor-visuals: true          # belt, rails, rollers and moving chevrons on the plates (display entities)
  conveyor-radius: 40             # only runs this close to someone on the island are dressed
  conveyor-runs-per-island: 80
  conveyor-entities-global: 3000
  machine-fx: true                # the machine props (bodies, wheels, sails, hammers), status tags, belt in/out arrows
  machine-sounds: true            # soft machine loops when you stand close (grindstone, anvil, chain, fire, grate)
  machine-fx-radius: 64           # props are drawn for people this close (they ARE the machines: keep it generous)
  machine-fx-per-island: 60       # machines drawn per island (nearest first)
  machine-fx-entities-global: 3000
unlock:
  island-foreshadow-level: 15  # gull's note (needs PlaceholderAPI %aetherion_level%)
  guild-foreshadow-level: 65

# --- Final knackpunkt pass ------------------------------------------------------------------------
void:
  persist-generator: true         # writes worlds.<island world>.generator: AetherionGuilds into bukkit.yml
  scrub: true                     # clears overworld terrain left in the island worlds (checked once per chunk)
  scrub-blocks-per-tick: 3000
guide:
  enabled: true                   # the isle hand (needs FancyNpcs; talks in the TalkUx bubble)
  name: Corin                     # not Hollis: that's the town crier at the harbour
  title: Isle Hand
  skin: aetherion:isle_hand       # his own painted cast skin (aetherion:<cast id>), or a player account's name
  free-belt-tiles: 16             # the first belt the guide hands out: these tiles cost nothing
  factory-belt-tiles: 24          # act two (the Mill): free belt tiles topped up for its belts
# The isle's quiet sound bed (wind, gulls, a hum near running machines), only for players on an island.
ambience:
  enabled: true
# The first landing as a film shot: out of the cloud, once round the new island, down into the player's eyes.
landing-camera:
  enabled: true
  morning: true                   # a new island is met just after sunrise (the player's own sky, only for them)
# The island choice on the Isle Dock: walking through a gate is the choice (no screen). Signs are fixed in place.
starter-gates:
  enabled: true
# On the islands and the Isle Dock the game's own "Advancement Made!" / "New Recipes Unlocked!" pop-ups stay away
# (the Build Tool turns into a lectern, a barrel, an iron pickaxe: each of those would be one). Restart to change.
quiet-vanilla-toasts: true
# The island's border, always shown: a slim rail of light with crystal posts along the land you may build on.
island-border:
  enabled: true
stages:
  ramp-multiplier: 10             # stage 0 (the tour): every quarry of a personal island digs this many times as fast
island-bar:
  enabled: true                   # calm island status bar; quest/hint bars step aside on island worlds either way

# --- Elevation: Coin Shortcuts (buy what is normally crafted; the very same item) -----------------
# Prices are coins. Brutal on purpose. Missing keys use these defaults.
market:
  quarry_compressor: 2500000       # Quarry Mill part (a Mill needs one)
  quarry_compactor: 7500000        # Quarry Forge part (a Forge needs one)
  quarry_core: 15000000
  compressed_cobblestone_32: 6000000
  compacted_cobblestone: 40000000
  # quarry_<type>: price of a level-1 quarry, e.g. quarry_cobblestone: 1500000 (default: 1.5M / rate^2)
  unit:                            # per missing item when an upgrade is bought instead of fed
    compressed_cobblestone: 187500
    compacted_cobblestone: 40000000
    quarry_core: 15000000
