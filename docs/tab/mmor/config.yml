header-footer:
  enabled: true
  designs:
    default:
      header:
      - ''
      - <gradient:gold:yellow:gold><b>✦ AETHERION ✦</b></gradient>
      - '&8— &7MMO Realm &8—'
      - ''
      footer:
      - ''
      - '&7Online &f%online%&8/&7%online_max%  &8·  &7Ping &f%ping%&7ms'
      - ''
tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  sorting-types:
  - GROUPS:admin,monkey,citrus,mvpplusplus,beta,aetherion,eternal,empyrean,ascendant,sovereign,celestine,aetherborn,mythwright,legend,champion,veteran,adventurer,default
  - PLACEHOLDER_A_TO_Z:%player%
  case-sensitive-sorting: true
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'
playerlist-objective:
  # Off: the layout below swaps real entries for fake slots, so TAB warns this
  # objective "will only look bad and consume resources". Ping is in the footer.
  enabled: false
  value: '%ping%'
  fancy-value: '&7Ping: %ping%'
  title: TAB
  render-type: INTEGER
  disable-condition: '%world%=disabledworld'
belowname-objective:
  enabled: true
  value: '%aetherion_hp%'
  fancy-value: '&c❤ %aetherion_hp%&7/&c%aetherion_max_hp%'
  fancy-value-default: NPC
  title: '&c❤'
  disable-condition: '%world%=disabledworld'
  view-distance: 12
prevent-spectator-effect:
  enabled: false
bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    ServerInfo:
      style: PROGRESS
      color: '%animation:barcolors%'
      progress: '100'
      text: '&fWebsite: &bwww.domain.com'
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: false
  hidden-by-default: false
  delay-on-join-milliseconds: 0
  scoreboards:
    # Single board: special-rank line is first; TAB drops empty lines when
    # %aetherion_ultra_rank% is blank (no stored extra). Avoids ultra/main
    # display-condition race that left ranked players stuck on main.
    #
    # Who (special rank, level, XP) -> where (area) -> purse (coins).
    # The level line always has static text, so it never hides. Quest progress
    # stays on the quest BossBar/ActionBar and is not repeated here.
    sidebar:
      title: '%animation:AetherionTitle%'
      lines:
      - '&8&m----------------'
      - '%aetherion_ultra_rank%'
      - '%aetherion_level_title% &8· &7Lv %aetherion_level_colored%'
      - '%aetherion_level_bar%'
      - ''
      - '&7Area &f%aetherion_area%'
      - '&7Coins &6%aetherion_coins%'
      - '&8&m----------------'
layout:
  enabled: true
  direction: COLUMNS
  default-skin: mineskin:37e93c8e12cd426cb28fce31969e0674
  enable-remaining-players-text: true
  remaining-players-text: '... and %s more'
