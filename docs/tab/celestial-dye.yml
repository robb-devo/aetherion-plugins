# Copy-paste for live TAB + LuckPerms (MMO-R).
#
# Citrus  = lime / yellow / orange shimmer. Cosmetic only.
# Monkey  = Hypixel Celestial Dye #B2FFFF (ice-cyan shimmer).
# Beta    = original Homie rainbow (cyan → pink → purple → gold).
# Never mix the three palettes.
#
# %aetherion_tab_prefix% and %aetherion_chat_prefix% both call RankBadgeService.tabPrefix:
#   [Citrus|Monkey|Beta|Admin|MVP++] dye, then the account level tag [n], then §f.
# The level title (Adventurer, Veteran, …) stays on %aetherion_level_title%.
# The dye does not replace that title.

# --- plugins/TAB/animations.yml ---
# change-interval is milliseconds. 200ms ≈ Hypixel dye shimmer.
