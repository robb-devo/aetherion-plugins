# --- plugins/TAB/groups.yml ---
# sorting-types GROUPS (Monkey stays the first Homie cosmetic):
#   groups: [admin, monkey, citrus, beta, mvpplusplus, aetherion, eternal, empyrean, ascendant,
#            sovereign, celestine, aetherborn, mythwright, legend, champion, veteran, adventurer]
#
# Prefer PlaceholderAPI so chat / compact list / hold-TAB stay in lockstep:
#   tabprefix: "%aetherion_tab_prefix%"
#   tagprefix: "%aetherion_tab_prefix%"
# LuckPerms chat / LPC:
#   %aetherion_chat_prefix%
# Right sidebar identity line (special rank + colored level + name):
#   "%aetherion_sidebar_1%"
#
# Do NOT use %luckperms_prefix% for these ultras if the live LP node is stale.
# Admin is not a LuckPerms or OP grant. Only Robb's profile (A3therion) can wear it,
# and only after Dev Menu → Ranks stores it.

# --- LuckPerms (rewritten on plugin enable) ---
# Citrus (cosmetic only, weight 94): /lp group citrus setweight 94
# Monkey (content + celestial #B2FFFF, weight 95): /lp group monkey setweight 95
# Beta (rainbow cosmetics only, weight 93): /lp group beta setweight 93
# Dev Menu → Ranks grants the same extras. XP sync does not remove them.
