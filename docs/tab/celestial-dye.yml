# Copy-paste for live TAB + LuckPerms (MMO-R).
#
# Monkey  = Hypixel Celestial Dye #B2FFFF (ice-cyan shimmer). EVERYWHERE.
# Beta    = original Homie rainbow (cyan → pink → purple → gold). EVERYWHERE.
# Never mix: Monkey must not use rainbow. Beta must not use #B2FFFF CelestialDye.
#
# In-game prefixes come from %aetherion_tab_prefix% (RankBadgeService.tabPrefix):
#   monkey → CelestialDye
#   beta   → RainbowDye
# ChatFormatListener, compact/right player list, and nametag use the same method.

# --- plugins/TAB/animations.yml ---
# change-interval is milliseconds. 200ms ≈ Hypixel dye shimmer.
Aetherion_Celestial:
  change-interval: 200
  texts:
    - "&#6EE8F2[&#6EE8F2M&#8CF4FCo&#B2FFFFn&#C8FFFFk&#DCFFFFe&#A6FBFFy&#7EF0F8]"
    - "&#8CF4FC[&#8CF4FCM&#B2FFFFo&#C8FFFFn&#DCFFFFk&#A6FBFFe&#7EF0F8y&#6EE8F2]"
    - "&#B2FFFF[&#B2FFFFM&#C8FFFFo&#DCFFFFn&#A6FBFFk&#7EF0F8e&#6EE8F2y&#8CF4FC]"
    - "&#C8FFFF[&#C8FFFFM&#DCFFFFo&#A6FBFFn&#7EF0F8k&#6EE8F2e&#8CF4FCy&#B2FFFF]"
    - "&#DCFFFF[&#DCFFFFM&#A6FBFFo&#7EF0F8n&#6EE8F2k&#8CF4FCe&#B2FFFFy&#C8FFFF]"
    - "&#A6FBFF[&#A6FBFFM&#7EF0F8o&#6EE8F2n&#8CF4FCk&#B2FFFFe&#C8FFFFy&#DCFFFF]"
    - "&#7EF0F8[&#7EF0F8M&#6EE8F2o&#8CF4FCn&#B2FFFFk&#C8FFFFe&#DCFFFFy&#A6FBFF]"

# Beta rainbow — original Monkey flashy letters. Not #B2FFFF.
Aetherion_Rainbow:
  change-interval: 200
  texts:
    - "&#55FFFF[&#55FFFFB&#7CEBFFe&#B89AFFt&#FF7AEEa&#FF8A88]"
    - "&#7CEBFF[&#7CEBFFB&#B89AFFe&#FF7AEEt&#FF8A88a&#FFC15A]"
    - "&#B89AFF[&#B89AFFB&#FF7AEEe&#FF8A88t&#FFC15Aa&#FFE08A]"
    - "&#FF7AEE[&#FF7AEEB&#FF8A88e&#FFC15At&#FFE08Aa&#55FFFF]"
    - "&#FF8A88[&#FF8A88B&#FFC15Ae&#FFE08At&#55FFFFa&#7CEBFF]"
    - "&#FFC15A[&#FFC15AB&#FFE08Ae&#55FFFFt&#7CEBFFa&#B89AFF]"
    - "&#FFE08A[&#FFE08AB&#55FFFFe&#7CEBFFt&#B89AFFa&#FF7AEE]"

# Backward-compatible alias — older live TAB configs used this name for Monkey.
Aetherion_Monkey:
  change-interval: 200
  texts:
    - "&#6EE8F2[&#6EE8F2M&#8CF4FCo&#B2FFFFn&#C8FFFFk&#DCFFFFe&#A6FBFFy&#7EF0F8]"
    - "&#8CF4FC[&#8CF4FCM&#B2FFFFo&#C8FFFFn&#DCFFFFk&#A6FBFFe&#7EF0F8y&#6EE8F2]"
    - "&#B2FFFF[&#B2FFFFM&#C8FFFFo&#DCFFFFn&#A6FBFFk&#7EF0F8e&#6EE8F2y&#8CF4FC]"
    - "&#C8FFFF[&#C8FFFFM&#DCFFFFo&#A6FBFFn&#7EF0F8k&#6EE8F2e&#8CF4FCy&#B2FFFF]"
    - "&#DCFFFF[&#DCFFFFM&#A6FBFFo&#7EF0F8n&#6EE8F2k&#8CF4FCe&#B2FFFFy&#C8FFFF]"
    - "&#A6FBFF[&#A6FBFFM&#7EF0F8o&#6EE8F2n&#8CF4FCk&#B2FFFFe&#C8FFFFy&#DCFFFF]"
    - "&#7EF0F8[&#7EF0F8M&#6EE8F2o&#8CF4FCn&#B2FFFFk&#C8FFFFe&#DCFFFFy&#A6FBFF]"

# --- plugins/TAB/groups.yml (add / merge) ---
# sorting-types GROUPS list: Monkey is the first Homie hub (after Admin is fine).
#   groups: [admin, monkey, beta, mvpplusplus, aetherion, eternal, empyrean, ascendant,
#            sovereign, celestine, aetherborn, mythwright, legend, champion, veteran, adventurer]
#
# Prefer PlaceholderAPI so chat / compact list / hold-TAB stay in lockstep:
#   tabprefix: "%aetherion_tab_prefix%"
#   tagprefix: "%aetherion_tab_prefix%"
#   customtabname: "%aetherion_list_name%"
#
# Or animations (must stay split — do not give Beta Aetherion_Celestial):
# monkey:
#   tabprefix: "%animation:Aetherion_Celestial% "
#   tagprefix: "%animation:Aetherion_Celestial% "
# beta:
#   tabprefix: "%animation:Aetherion_Rainbow% "
#   tagprefix: "%animation:Aetherion_Rainbow% "
#
# Do NOT use %luckperms_prefix% for these ultras if the live LP node is stale.

# --- LuckPerms ---
# Monkey (content tools + celestial #B2FFFF):
#   Dev Menu → Ranks → Monkey
#   /lp group monkey setweight 95
#   Prefix rewritten to CelestialDye on plugin enable.
#
# Beta Tester (rainbow cosmetics only — no tools):
#   Dev Menu → Ranks → Beta Tester
#   /lp group beta setweight 93
#   Prefix rewritten to RainbowDye on plugin enable.
#   No aetherion.dev / aetherion.dev.content / flight / npc.editor.
