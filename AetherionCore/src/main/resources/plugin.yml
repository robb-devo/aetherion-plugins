name: AetherionCore
version: 1.0.0
main: de.aetherion.core.AetherionCore
api-version: 1.21
author: Aetherion
load: STARTUP
description: Shared keys, entity identity, and hit flags. No game loop.

commands:
  aethercore:
    description: Core status
    permission: aetherion.core.admin
    usage: /aethercore
  aenet:
    description: Broadcast a restart countdown, then shut this backend down
    permission: aetherion.core.admin
    usage: /aenet restart [seconds] [eta]
  wipe:
    description: Shut down, reset all player data, then restart
    permission: aetherion.wipe
    usage: /wipe beta confirm
  exile:
    description: Cross to the exile island (mmo-c) or return
    usage: /exile [go|return|replay|stop|where]
    aliases: [exil]

permissions:
  aetherion.core.admin:
    description: Core admin command
    default: op
  aetherion.wipe:
    description: Run a full beta player-data wipe
    default: op
  aetherion.exile:
    description: Use /exile go and return
    default: true
