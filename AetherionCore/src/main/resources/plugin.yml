name: AetherionCore
version: 1.0.0
main: de.aetherion.core.AetherionCore
api-version: 1.21
author: Aetherion
load: STARTUP
softdepend: [ProtocolLib]
description: Shared keys, entity identity, and hit flags. No game loop.

commands:
  report:
    description: Send a bug report to the team
    aliases: [bug, bugreport]
    permission: aetherion.report
    usage: /report <what happened>
  aethercore:
    description: Core status
    permission: aetherion.core.admin
    usage: /aethercore
  aenet:
    description: Broadcast a restart countdown, then shut this backend down
    permission: aetherion.core.admin
    usage: /aenet restart [seconds] [eta]
  wipe:
    description: Shut down, reset all player data, then restart
    permission: aetherion.wipe
    usage: /wipe beta confirm
  exile:
    description: Cross to the exile island (mmo-c) or return
    usage: /exile [go|return|replay|stop|where|causeway|paste|placequay|clearsaint|quayundo|repairquay|turnquay]
    aliases: [exil]
  raidban:
    description: Anti bot-raid menu - pick players by join order and IP-ban them on every server
    usage: /raidban [list | pardon <name|ip>]
    permission: aetherion.mod.raidban
    aliases: [antiraid, raidmenu]
  aetransfer:
    description: Network transfer state of a player, or hop yourself (admin)
    usage: /aetransfer [player] | /aetransfer go <mmo-r|mmo-d|mmo-c|mmo-i>
    permission: aetherion.core.admin

permissions:
  aetherion.report:
    description: Send bug reports with /report
    default: true
  aetherion.report.notify:
    description: See bug reports in chat as they come in
    default: op
  aetherion.core.admin:
    description: Core admin command
    default: op
  aetherion.wipe:
    description: Run a full beta player-data wipe
    default: op
  aetherion.mod.raidban:
    description: Open the raid menu and IP-ban raiders network-wide
    default: op
  aetherion.exile:
    description: Use /exile go and return
    default: true
