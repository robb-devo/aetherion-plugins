name: AetherionCore
version: 1.0.0
main: de.aetherion.core.AetherionCore
api-version: 1.21
author: Aetherion
load: STARTUP
description: Shared keys, entity identity, hit flags, and wipe-safe playtime.

commands:
  aethercore:
    description: Core status
    permission: aetherion.core.admin
    usage: /aethercore
  wipe:
    description: Shut down, reset all player data, then restart
    permission: aetherion.wipe
    usage: /wipe beta confirm
  playtime:
    description: Show your wipe-safe total playtime
    usage: /playtime [player]
  fullplaytimereset:
    description: Reset wipe-safe playtime for yourself, or another player with permission
    usage: /fullplaytimereset [player]

permissions:
  aetherion.core.admin:
    description: Core admin command
    default: op
  aetherion.wipe:
    description: Run a full beta player-data wipe
    default: op
  aetherion.playtime.others:
    description: View another player's wipe-safe playtime
    default: op
  aetherion.playtime.reset.self:
    description: Reset your own wipe-safe playtime (/fullplaytimereset)
    default: op
  aetherion.playtime.reset.others:
    description: Reset another player's wipe-safe playtime
    default: op
