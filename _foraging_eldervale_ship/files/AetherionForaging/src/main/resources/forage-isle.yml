# ── The Grove cast (FancyNPC, isle-local). No skin = Steve/Alex. Only ever use ORIGINAL skins. ──
cast:
  auto-place: true
  visibility-distance: 40
  board_clerk:
    anchor: 564.5 90 -180.5
    yaw: 180
    skin: ""
  woodwright:
    anchor: 763.5 92 -44.5
    yaw: 0
    skin: ""
  archivist:
    anchor: 693.5 200 -243.5
    yaw: 90
    skin: ""

# ── Tuning ─────────────────────────────────────────────────────────────────────────────────────
tuning:
  # Crown Finds: base chance a felled tree drops a find from its crown.
  crown-find-chance: 0.07
  # Trees with at least this many logs are Titans (two-stage fell).
  titan-logs: 40
  # Widowmaker: tall trees can drop a loose limb on you after the fell.
  widowmaker-min-logs: 14
  widowmaker-chance: 0.12
  # District extras (saplings, petals, cocoa…) per fell.
  extras-chance: 0.22
  # Fall-catch: below this y inside the isle footprint you get pulled back to your last safe spot.
  fall-catch-floor-y: 70
  updraft-speed: 1.05

events:
  enabled: true
  # Seconds between isle events while foragers are on the isle (random in range).
  interval-min-seconds: 420
  interval-max-seconds: 660
  warmup-seconds: 20

critters:
  enabled: true
  global-cap: 14
