name: AetherionForaging
version: 1.0.0
main: de.aetherion.foraging.AetherionForaging
api-version: '1.21'

depend:
  - AetherionCore
  - WorldGuard
softdepend:
  - AetherionItems
  - WorldEdit
  - FancyNpcs

commands:
  forageadmin:
    description: Foraging admin helpers (isle paste).
    usage: /forageadmin isle clear|paste|paste here
    aliases: [forageadm]
    permission: aetherion.forage.admin

  grove:
    description: Foraging Eldervale journal, tour and wayfinder.
    usage: /grove [tour|go <place>|stop|where|places|mastery|cabinet|board|bench|ledger]
    aliases: [canopy, forestjournal]

permissions:
  aetherion.forage.admin:
    description: Paste forage isle / admin forage tools
    default: op
