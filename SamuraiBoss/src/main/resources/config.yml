  prefix: "<gradient:#ffd1dc:#ff6f91>桜</gradient> <dark_gray>»</dark_gray> "
  boss-name: "<gradient:#ffe3ea:#ff8fab>Sakuragi Jinsai</gradient>"
  boss-title: "<gray>Sword Saint of Falling Blossoms</gray>"
  bossbar: "<gradient:#ffe3ea:#ff8fab><b>Sakuragi Jinsai</b></gradient> <dark_gray>·</dark_gray> <gray>{phase}</gray> <dark_gray>·</dark_gray> <white>{hp}</white><dark_gray>/</dark_gray><gray>{max}</gray>"
  phase-1: "Form I 「静」 Stillness"
  phase-2: "Form II 「嵐」 Storm"
  phase-3: "Form III 「散華」 Falling Blossoms"
  phase-ruin: "Final Form 「無」 Void"
  ultimate-bar: "<white><b>Tenchi Issen</b></white> <gray>— Bow! (Sneak)</gray>"
  no-permission: "<red>No permission.</red>"
  fight-start: "<gray>The temple bell tolls. <white>The Kensei awakens…</white></gray>"
  victory-broadcast: "<gradient:#ffd1dc:#ff6f91><b>Flawless</b></gradient> <gray>— {players} defeated</gray> <white>Sakuragi Jinsai</white><gray>!</gray>"
  defeat: "<gray>The Kensei returns to sleep beneath the cherry tree…</gray>"
  bow-saved: "<gradient:#ffd1dc:#ff6f91>Accepted</gradient> <gray>— your bow was seen.</gray>"

