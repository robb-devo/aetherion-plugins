name: AetherionStressBots
version: 1.0.0
main: de.aetherion.stressbots.AetherionStressBots
api-version: 1.21
author: Aetherion
description: Mineflayer test/stress bots — kits, teleports, Dev-menu control, /botreport
depend:
  - AetherionCore
  - AetherionItems
softdepend:
  - AetherMobs
  - AetherionQuests
  - AetherionHub
  - AetherionBeta

commands:
  stressbots:
    description: Stress/test-bot assist controls
    usage: /stressbots <reload|setup|list|start|stop|stopall|report>
    permission: aetherion.stressbots.admin
    permission-message: No permission.
  botreport:
    description: Dump online test-bot status for QA
    usage: /botreport
    aliases: [testbotreport]
    permission: aetherion.stressbots.admin
    permission-message: No permission.

permissions:
  aetherion.stressbots.admin:
    description: Manage test/stress bots and /botreport
    default: op
