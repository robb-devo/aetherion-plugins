# Name prefixes for auto-provisioning (case-insensitive).
# Phase 1 stress bots keep StressC / StressM. Wave 1 QA bots use Qa* names.
prefixes:
  combat: StressC
  mining: StressM

# Ticks after join/respawn before gear + teleport.
setup-delay-ticks: 40

# Keep bots fed and alive enough to keep working.
auto-feed: true
full-heal-on-setup: true

combat:
  world: world
  # Mob-zone center (borderlands profile)
  x: 220.5
  y: 58.0
  z: 160.5
  yaw: 0.0
  pitch: 0.0
  scatter-radius: 12
  leash-radius: 22

mining:
  world: world
  # Shabby Mine area anchors (from areas.yml) — legacy StressM*
  anchors:
    - { x: 13.5, y: 55.5, z: 297.5 }
    - { x: -85.5, y: 51.5, z: 277.5 }
    - { x: -25.5, y: 46.5, z: 254.5 }
    - { x: 71.5, y: 49.5, z: 266.5 }
    - { x: 20.5, y: 50.5, z: 231.5 }
  yaw: 0.0
  pitch: 0.0
  scatter-radius: 6
  leash-radius: 16

# ---------------------------------------------------------------------------
# Wave 1 QA testbots (Dev menu + /botreport + /stressbots start)
# Bots only spawn from the plugin when enabled is true.
# The Mineflayer runner still needs to be running (control HTTP).
# Velocity forwarding secret stays in runner/config.json — do not put it here.
#
# Island safety: keep scatter small, leash near the assigned pad, and prefer
# interior anchors over jump-pad lip / canopy / borderlands death spots.
# Live configs are patched on start (config-version): role anchors that still equal the shipped
# defaults of an older version move to the current spots, and new keys are added. Tuned anchors stay.
# ---------------------------------------------------------------------------
testbots:
  config-version: 2
  enabled: false
  # Mixed fleet headroom (~5 roles × 8, or a thinner mix of all 9). Live max-players is 60.
  max-total: 40
  max-per-start: 40
  runner:
    host: 127.0.0.1
    port: 18765
    # Optional. Empty = no header. If set, must match runner config.json control.token.
    token: ""
  prefixes:
    mine: QaMine
    forage: QaForage
    catch: QaCatch
    roam: QaRoam
    combat: QaCombat
    fish: QaFish
    trade: QaTrade
    quest: QaQuest
    pad: QaPad
  caps:
    mine: 8
    forage: 8
    catch: 8
    roam: 8
    combat: 8
    fish: 8
    quest: 8
    trade: 8
    pad: 8
  # Player-like extras (skills, mixed-tier kits, pets, boosters) run on every provision.
  # Skill XP only lands on equipped loadout skills — bots do not /skills setlevel.
  # Coins are topped up to these targets on setup, never added on top (no inflation across respawns).
  playstyle:
    starter-coins: 2500
    pocket-coins: 250
    unlock-trader: true
    unlock-spawns: true
  safety:
    # Paper watchdog + Mineflayer hold. Tune if pads sit lower than Y 56. A role can set its own
    # void-floor-y (mine does: quarry floors are deeper than the pads).
    void-floor-y: 40
    leash-radius: 18
    recover-cooldown-ms: 1500
    respawn-setup-ticks: 5
    # Teleport idle mine/forage/catch bots to another role pad (12s).
    idle-reanchor-ticks: 240
    # Roam/pad: plugin pad-hop between origin pads (80s). 0 disables.
    pad-hop-ticks: 1600
    # Pad role: ignore leash/falling while mid-arc (ms).
    pad-flight-ms: 8000
  roles:
    # Quarry floors on Mining Eldervale (anchors from docs/MINING_ELDERVALE.md): Terraces, North Pit,
    # Long Cut, Sunder Cut, West Hollow. The floors sit at Y 35-77, below the island void floor, so mine
    # has its own floor. The Eldervale town (Lantern Row, the Landing) is not a dig site.
    mine:
      world: world
      void-floor-y: -40
      anchors:
        - { x: 99.5, y: 77.0, z: 506.5 }
        - { x: 30.5, y: 35.0, z: 457.5 }
        - { x: -27.5, y: 45.0, z: 512.5 }
        - { x: 159.5, y: 45.0, z: 529.5 }
        - { x: -72.5, y: 50.0, z: 586.5 }
      yaw: 0.0
      pitch: 20.0
      scatter-radius: 4
      leash-radius: 16
    # Forage Eldervale places (forage-isle.yml landmarks): the Landing and Streamside Hut (Elderwood, oak +
    # birch), Bell Lodge, Ridge Watchtower and Frostpine Lodge (Frostpine, spruce). Never the jump-pad lip
    # 479.5 74 -240.5 (Canopy-Kalle death loop).
    forage:
      world: world
      anchors:
        - { x: 559.5, y: 90.0, z: -207.5 }
        - { x: 698.5, y: 91.0, z: -132.5 }
        - { x: 763.5, y: 92.0, z: -44.5 }
        - { x: 766.5, y: 112.0, z: -146.5 }
        - { x: 846.5, y: 113.0, z: -161.5 }
      yaw: 90.0
      pitch: 10.0
      scatter-radius: 5
      leash-radius: 20
    # Solid ground in the Elderwood Vale (Landing, Streamside Hut). Removed 500.5 80 -200.5 (immediate void after TP).
    catch:
      world: world
      spheres: [common]
      sphere-count: 16
      anchors:
        - { x: 559.5, y: 90.0, z: -207.5 }
        - { x: 698.5, y: 91.0, z: -132.5 }
        - { x: 560.5, y: 90.0, z: -160.5 }
      yaw: 0.0
      pitch: 0.0
      scatter-radius: 4
      leash-radius: 12
    # Origin slime pads only. Removed borderlands 220.5 58 160.5 (husk/skeleton loop).
    # Runner hops locally; plugin pad-hops between these two islands. Do not add
    # far waypoints unless you want the plugin to teleport — bots will not walk the void.
    roam:
      world: world
      waypoints:
        - { x: 22.5, y: 56.0, z: 305.5 }
        - { x: 18.5, y: 56.0, z: 301.5 }
        - { x: 26.5, y: 56.0, z: 309.5 }
        - { x: 438.5, y: 56.0, z: -233.5 }
        - { x: 434.5, y: 56.0, z: -229.5 }
        - { x: 442.5, y: 56.0, z: -237.5 }
      yaw: 0.0
      pitch: 0.0
      scatter-radius: 3
      leash-radius: 14

    # Borderlands combat zone (hostiles). The live Hub spawn "borderlands" wins when it is set; the anchor is
    # the fallback. QaCombat login names; StressC still kits.
    combat:
      world: world
      hub-spawns: [borderlands]
      anchors:
        - { x: 220.5, y: 58.0, z: 160.5 }
      yaw: 0.0
      pitch: 0.0
      scatter-radius: 8
      leash-radius: 22
    # Fishing Eldervale shores (AetherionFishing isle-cast presets + landing): Lakewatcher pier on Mirror
    # Reach, the Bait Shack boathouse, the plaza landing above South Deep, the Harbourmaster's Hall by
    # Lantern Cove. The Line's strike bar only runs on the isle.
    fish:
      world: world
      anchors:
        - { x: -336.5, y: 90.0, z: -821.5 }
        - { x: -482.5, y: 90.0, z: -823.5 }
        - { x: -380.0, y: 90.0, z: -815.5 }
        - { x: -391.5, y: 90.0, z: -964.5 }
      yaw: 90.0
      pitch: 20.0
      scatter-radius: 3
      leash-radius: 14
    # /ah and /bazaar work anywhere; bots stand at the live harbour and capital spawns (market, Egon),
    # else on the origin pads. GUIs need the TRADER progression flag (given on setup).
    trade:
      world: world
      hub-spawns: [harbour, capital]
      waypoints:
        - { x: 22.5, y: 56.0, z: 305.5 }
        - { x: 18.5, y: 56.0, z: 301.5 }
        - { x: 438.5, y: 56.0, z: -233.5 }
      yaw: 0.0
      pitch: 0.0
      scatter-radius: 3
      leash-radius: 14
    # Quest NPC spots come from AetherionQuests (every saved NPC in the bot's world within quest-npc-radius),
    # so bots follow NPCs when they move. The anchors are the fallback when Quests is offline.
    quest:
      world: world
      use-quest-npcs: true
      quest-npc-radius: 1500
      anchors:
        - { x: 53.5, y: 91.0, z: 482.5 }
        - { x: 22.5, y: 90.0, z: 580.5 }
        - { x: 438.5, y: 56.0, z: -233.5 }
        - { x: 560.5, y: 91.0, z: -200.5 }
      yaw: 0.0
      pitch: 0.0
      scatter-radius: 3
      leash-radius: 14
    # Real jump-pad centers. Forage lip 479.5 74 -240.5 is a pad destination (not a forage work pad).
    # Leash 72 so mid-arc hops are not yanked; pad-flight-ms covers the same window.
    pad:
      world: world
      anchors:
        - { x: 22.5, y: 56.0, z: 305.5 }
        - { x: 438.5, y: 56.0, z: -233.5 }
        - { x: 53.5, y: 91.0, z: 482.5 }
        - { x: 479.5, y: 74.0, z: -240.5 }
      yaw: 0.0
      pitch: 0.0
      scatter-radius: 1
      leash-radius: 72

  # Chat / tab / Collection leaderboard labels. Login names stay QaMine01 (Velocity).
  nicknames:
    enabled: true
    # Optional. If a list is set, it replaces the built-in German/absurd pool for that role.
    # mine: ["§bPickel-Ute", "§bErz-Ernie"]
