<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Aetherion Helm</title>
    <!-- Shown by the Android app when the panel cannot be reached. Self-contained on purpose: nothing else loads offline. -->
    <style>
      :root {
        --bg: #04050a;
        --text: #f4f5fb;
        --muted: rgba(235, 238, 255, 0.62);
        --rim: rgba(255, 255, 255, 0.12);
        --glass: rgba(255, 255, 255, 0.06);
      }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      body {
        display: grid; place-items: center; overflow: hidden;
        padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(20px, env(safe-area-inset-left, 0px));
        box-sizing: border-box;
      }
      .glow { position: fixed; inset: -20%; background: radial-gradient(40% 35% at 25% 20%, rgba(143, 123, 255, 0.35), transparent 70%), radial-gradient(35% 30% at 80% 85%, rgba(70, 200, 255, 0.22), transparent 70%); filter: blur(20px); }
      .card { position: relative; width: min(380px, 100%); padding: 32px 26px 26px; border-radius: 28px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--rim), 0 30px 80px -20px rgba(0, 0, 0, 0.6); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6); text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #a996ff, #7461ff 48%, #3fc4ff); box-shadow: 0 12px 30px -8px rgba(116, 97, 255, 0.7); }
      h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: -0.02em; text-wrap: balance; }
      p { margin: 0 0 22px; color: var(--muted); }
      button { width: 100%; height: 48px; border: 0; border-radius: 14px; font: 600 15px/1 inherit; color: #fff; background: linear-gradient(135deg, #a18bff, #7c6bff 45%, #46c8ff); cursor: pointer; }
      button:active { transform: scale(0.98); }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      .hint { margin: 14px 0 0; font-size: 12.5px; }
      @media (prefers-reduced-motion: no-preference) { .mark { animation: turn 8s linear infinite; } @keyframes turn { to { transform: rotate(360deg); } } }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <main class="card">
      <div class="mark">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="6.6" fill="none" stroke-width="1.7" />
          <circle cx="12" cy="12" r="2.5" stroke="none" />
          <path fill="none" stroke-width="1.45" d="M12 9.8V2.6M13.56 10.44l5.09-5.09M14.2 12h7.2M13.56 13.56l5.09 5.09M12 14.2v7.2M10.44 13.56l-5.09 5.09M9.8 12H2.6M10.44 10.44 5.35 5.35" />
          <g stroke="none"><circle cx="12" cy="1.7" r="1.3" /><circle cx="19.28" cy="4.72" r="1.3" /><circle cx="22.3" cy="12" r="1.3" /><circle cx="19.28" cy="19.28" r="1.3" /><circle cx="12" cy="22.3" r="1.3" /><circle cx="4.72" cy="19.28" r="1.3" /><circle cx="1.7" cy="12" r="1.3" /><circle cx="4.72" cy="4.72" r="1.3" /></g>
        </svg>
      </div>
      <h1>Panel gerade nicht erreichbar</h1>
      <p>Entweder hat dein Handy kein Netz, oder das Panel startet gerade neu. Das dauert meist nur ein paar Sekunden.</p>
      <button id="retry" type="button">Erneut verbinden</button>
      <p class="hint" id="auto">Ich versuche es automatisch weiter.</p>
    </main>
    <script>
      var target = "__HELM_URL__";
      if (target.indexOf("__") === 0) target = "/";
      function go() { location.replace(target); }
      document.getElementById("retry").addEventListener("click", go);
      window.addEventListener("online", go);
      setInterval(function () { fetch(target + (target.endsWith("/") ? "" : "/") + "api/health", { cache: "no-store", mode: "no-cors" }).then(go, function () {}); }, 8000);
    </script>
  </body>
</html>
