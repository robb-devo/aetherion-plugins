# ============================================================
# The Hollow Sun – Fallen Star showcase boss (Bloodstone arena)
# Combat: HollowSunDirector. Spawn: /boss spawn hollow_sun
# Main Sequence: a gold star-knight. Swipe, lance, slam, starcall, corona.
# Red Giant: it swells and hovers. Rotating flare beams, lava prominences.
# Starfall (66% -> 33%): it rises, becomes a red sun, collapses to a black
#   star and falls. Stand outside the crimson disc.
# Collapse: black/violet. Gravity wells, folds, shockwaves, and at 15%
#   the Nova: break the core or everyone burns.
# Death: the armor bursts, the core returns to the sky as a star.
# ============================================================

id: hollow_sun
display-name: "&6&lThe Hollow Sun"
entity-type: WITHER_SKELETON
model-engine-id: ""

attributes:
  max-health: 120000
  movement-speed: 0.26
  attack-damage: 40
  scale: 1.4
  follow-range: 40
  knockback-resistance: 1.0

equipment:
