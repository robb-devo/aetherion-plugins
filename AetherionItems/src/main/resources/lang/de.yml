books:
  book_mad_king:
    - "§lDER IRRE KÖNIG§r\n\nEin Märchen für Kinder, die nicht schlafen wollen.\n\n\n§8Genehmigt von der Registry."
    - "Es war einmal ein König, der wollte den ganzen Himmel für sich allein.\n\nEr war nicht gütig.\nEr war nicht weise.\nEr war irre."
    - "Er hatte keinen Namen.\n\nIrre Könige dürfen keinen behalten."
    - "Als der Himmel ihm nicht gehorchen wollte, zerbrach er ihn.\n\nWie einen Teller.\nWie ein Spielzeug.\nAls wäre nichts wichtig."
    - "Da läuteten die tapferen Leute die Glocken, und die Glocken schickten ihn weit fort, hinter den Nebel, von wo er nie mehr zurückkommen kann."
    - "Hörst du nachts die Glocken, dann mach die Augen zu.\n\nSie wollen nur ganz sicher gehen.\n\n\n§lEnde.§r"
  maelis_letter_1:
    - "C —\n\nElin will wieder nicht schlafen. Sie sagt, die Dunkelheit hat Ecken.\n\nIch hab ihr heute Abend ein Lied geschrieben. Sieben Töne, einer für jede Glocke."
    - "Beim vierten schlief sie schon.\n\nDu summst es übrigens falsch. Jedes einzelne Mal.\n\nKomm heim und summ es ihr falsch vor. Das mag sie am liebsten.\n\n— M"
  maelis_letter_2:
    - "C —\n\nDu hast heute Abend den ganzen Hafen mit deinen Lampen erleuchtet. Die Stadt hat gejubelt, als hättest du den Mond gefangen."
    - "Elin hat am Fenster gewinkt, bis sie an der Scheibe eingeschlafen ist.\n\nKomm vor der letzten Glocke heim. Die Werkstatt steht morgen früh auch noch.\n\n— M"
  maelis_letter_3:
    - "C —\n\nDie äußeren Inseln sind still, auf die falsche Art. Die Leute vergessen ihre Türen. Ihre Namen.\n\nMach nicht dieses Gesicht. Ich weiß, dass du schon darüber liest."
    - "Versprich mir eins.\n\nSing mit mir die letzte Strophe zu Ende. Das tust du nie. Du hörst immer bei der siebten Glocke auf und siehst mich an, als wäre das Lied vorbei.\n\nIst es nicht.\n\n— M"
  sealed_writ_silent_year:
    - "§lSCHREIBEN DES STILLEN JAHRES§r\n\nAuf Befehl des Rates von Eldervale:\n\nNiemand gehe zu ihm.\nNiemand gehe von ihm."
    - "Sein Name werde aus jedem Buch gestrichen,\nund die ihren mit dem seinen.\n\nDie Königsstraße ist gesperrt. Der Wächter steht, bis er abgelöst wird."
    - "Gezeichnet für den Rat:\n\nA. Morrow\nT. Thorne\nE. Vasko\n\n§8(die übrigen Namen sind ausgekratzt)"
