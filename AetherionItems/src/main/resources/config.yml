# Hotbar nether-star. Hub lobby turns this off — players enter Eldervale via the Aetherion NPC.
manager:
  hotbar-enabled: true

# Player HUD: HP / DEF / cooldown bars drawn from pack font aetherion:hud over the hidden hearts.
# false = old text line (use while the served pack is older than the plugin, or glyphs show as boxes).
hud:
  pack-glyphs: true

# Skills / Aetherion level. Leave sync-from empty unless a server explicitly pulls another file.
skills:
  persist: true
  sync-from: ""

# Hub lobby: no Aetherion ranks/levels. Only Robb UUID may show [Admin].
ranks:
  hub-lobby: false
  mvpplusplus:
    group: mvpplusplus
    weight: 90
    prefix: "&6[MVP&c++&6] "
    players:
      - c46afc0c-488b-430f-83a7-98f8a5df3ac5
