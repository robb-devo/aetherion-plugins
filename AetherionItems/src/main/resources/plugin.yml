name: AetherionItems
version: 1.0.0
main: de.aetherion.items.AetherionItems
api-version: 1.21
author: Aetherion

description: Custom MMO Items System

depend:
  - AetherionCore

softdepend:
  - PlaceholderAPI
  - AetherionHub
  - BossEngine
  - AetherionQuests
  - AetherionDungeons
  - AetherionGuilds
  - AetherMobs
  - LuckPerms
  - WorldGuard
  - DiscordSRV

commands:

  aetheriontest:
    description: Gives a test Aetherion item

  atrecipes:
    description: Opens the Aetherion Recipe Book
    aliases:
      - atrecepies
      - aetherionrecipes
      - recipebook

  aetherionitems:
    description: Aetherion item commands
    aliases:
      - kit1
      - kit2
      - pickaxe
      - axe
      - sword
      - shortbow
      - aetherblade
      - bridgedaxe
      - squidsboot
      - aetherionset
      - voidstick
      - hoe
      - helmet
      - chestplate
      - leggings
      - boots
      - booster

  aetherion:
    description: Opens the Aetherion Manager
    aliases:
      - amanager
      - aethermanager

  devmenu:
    description: Open the Aetherion DEV chest
    aliases:
      - adev
      - aetheriondev
    permission: aetherion.devmenu
  flight:
    description: Toggle flight (content helpers / Monkey)
    permission: aetherion.flight

  bazaar:
    description: Open the resource Bazaar
    aliases:
      - bz
      - aetherbazaar

  ah:
    description: Open the Auction House
    aliases:
      - auction
      - auctionhouse
      - aetherah

  shards:
    description: Aether Shards balance and admin give
    aliases:
      - shard
      - aethershards
      - gems

  shardshop:
    description: Open the Aether Shard shop
    aliases:
      - gemshop
      - bitshop
      - aethershop
    permission: aetherion.shardshop
    permission-message: §cThe shop is open to everyone. If you see this, LuckPerms is being weird.

  skills:
    description: Open the Aetherion skill loadout
    aliases:
      - skill
      - aetherskills
      - aetherskill

  av:
    description: Open a portable anvil (after unlocking one in the world)
    aliases:
      - anvil
      - aetheranvil

  ct:
    description: Open a portable crafting table (after unlocking one in the world)
    aliases:
      - craft
      - craftingtable
      - aethercraft

  trades:
    description: Open the resource trader
    aliases:
      - trade
      - trader
      - sell

  party:
    description: Create or manage a party
    aliases:
      - aetherparty

  gamble:
    description: Open Lucky Vince's casino
    aliases:
      - casino
      - slots
      - roulette

  guide:
    description: Simple Aetherion helper (next steps + craft lookup)
    aliases:
      - aetherguide
      - helpme
      - whatnext

permissions:
  aetherion.shardshop:
    description: Open the Aether Shard shop
    default: true
  aetherion.devmenu:
    description: Open the Dev Kit (full DEV or content helper)
    default: op
  aetherion.dev:
    description: Access the full DEV menu and animal anchors
    default: op
    children:
      aetherion.devmenu: true
      aetherion.dev.content: true
      aetherion.npc.editor: true
  aetherion.dev.content:
    description: Content helper kit (Resources, self shards, NPC editor, flight)
    default: false
    children:
      aetherion.devmenu: true
  aetherion.npc.editor:
    description: FancyNPC + quest creator (/aethernpc; FancyNpcs keeps /npc)
    default: false
  aetherion.flight:
    description: Toggle /flight
    default: op
  aetherion.shards.admin:
    description: Give and take Aether Shards
    default: op
  aetherion.skills.admin:
    description: Unlock or reset player skill slots
    default: op
  aetherion.rank.mvpplusplus:
    description: Exclusive MVP++ homage rank
    default: false
  aetherion.rank.monkey:
    description: Monkey content rank (NPC / quest helper + celestial dye)
    default: false
  aetherion.rank.beta:
    description: Beta Tester ultra rank (rainbow cosmetics only, no tools)
    default: false
