# Aetherion listed coin values (Skyblock-feel).
# Formula (see EconomyCurve.java):
#   compressed = round(unit x 128 x 1.4)
#   compacted  = round(compressed x 128 x 1.5)  (128 compressed / Compacted; Craft matches)
#   refined    = round(compacted x 4)
#   crafted    = round(ingredientSum x craftMargin)
# Margins: T1 1.20, T2 1.30, T3 1.45, T4 1.65, T5 1.90
#          charms 1.25/1.45/1.70, boosters 1.35, material 1.55
# Channels: Trader 100% resources, Gear buyback 32%, Silas x8, Bazaar 50-300%.

