  </defs>
  <rect width="1200" height="750" fill="url(#cave)"/>
  <ellipse cx="600" cy="560" rx="380" ry="180" fill="url(#glow)"/>

  <path d="M0 0 L0 260 C180 200 260 80 420 40 C520 16 580 90 640 40 C760 -20 860 80 1200 30 L1200 0 Z" fill="url(#wall)"/>
  <path d="M0 750 L0 520 C140 580 220 430 360 500 C470 555 540 420 680 490 C820 560 940 430 1200 510 L1200 750 Z" fill="#140b22"/>

