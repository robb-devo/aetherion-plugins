  </g>

  <path d="M200 560 C340 520 480 600 620 540 C760 480 900 560 1040 520" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.35"/>
  <path d="M240 590 C400 550 560 630 720 560" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.4"/>

  <rect x="560" y="500" width="10" height="70" fill="#6b5344"/>
  <polygon points="565,470 600,512 530,512" fill="#8a6a52"/>

  <text x="60" y="700" fill="#c9c2de" font-family="Georgia, serif" font-size="26" letter-spacing="4">CRYSTAL HOLLOWS / AMETHYST</text>
