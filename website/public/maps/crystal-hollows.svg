    <polygon points="70,50 98,92 70,150 42,92" fill="#0b0814" opacity="0.28"/>
  </g>
  <g transform="translate(330,310)">
    <polygon points="48,10 88,70 48,170 8,70" fill="url(#gem)" opacity="0.85"/>
  </g>
  <g transform="translate(720,220)">
