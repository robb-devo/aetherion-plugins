<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Aetherion</title>
  <defs>
    <linearGradient id="tqO" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#e2fffb"/><stop offset="0.45" stop-color="#5ff0de"/><stop offset="1" stop-color="#17a9a0"/></linearGradient>
    <linearGradient id="tqI" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#3fd9c9"/><stop offset="0.6" stop-color="#11808a"/><stop offset="1" stop-color="#08434f"/></linearGradient>
    <linearGradient id="amI" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3ccff"/><stop offset="0.5" stop-color="#a874ff"/><stop offset="1" stop-color="#6a2fe0"/></linearGradient>
    <linearGradient id="amO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8146ee"/><stop offset="0.6" stop-color="#4a1aa8"/><stop offset="1" stop-color="#220a5c"/></linearGradient>
    <linearGradient id="rockTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3f8c"/><stop offset="1" stop-color="#2a1a4e"/></linearGradient>
    <linearGradient id="rockL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e1e55"/><stop offset="1" stop-color="#120b26"/></linearGradient>
    <linearGradient id="rockR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1338"/><stop offset="1" stop-color="#08060f"/></linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5a1a" stop-opacity="0"/><stop offset="0.14" stop-color="#ff7a2e"/><stop offset="0.5" stop-color="#fff7da"/><stop offset="0.86" stop-color="#ff7a2e"/><stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/></linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>

  <!-- seam: the bell light between the letter and its island -->
  <rect x="62" y="299" width="388" height="28" fill="url(#seam)"/>

  <g stroke="#070a10" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="2.6" paint-order="stroke">
    <!-- A, tide half: outer face catches the light, inner face falls into shadow -->
    <polygon points="256,22 66,300 124,300" fill="url(#tqO)"/>
    <polygon points="256,22 124,300 180,300 256,252 256,216 205,216 256,126" fill="url(#tqI)"/>
    <!-- A, amethyst half -->
    <polygon points="256,22 256,126 307,216 256,216 256,252 332,300 388,300" fill="url(#amI)"/>
    <polygon points="256,22 388,300 446,300" fill="url(#amO)"/>
    <!-- the island it floats on -->
    <polygon points="98,327 414,327 396,350 256,360 116,350" fill="url(#rockTop)"/>
    <polygon points="116,350 256,360 256,498 222,422 184,412 166,370 128,362" fill="url(#rockL)"/>
    <polygon points="256,360 396,350 386,364 352,372 334,406 298,418 256,498" fill="url(#rockR)"/>
    <!-- crystals hanging from the rock -->
    <polygon points="178,410 198,414 189,452" fill="#5ff0de"/>
    <polygon points="314,416 334,410 328,446" fill="#b98aff"/>
  </g>

  <!-- the ridge where tide meets amethyst -->
  <polygon points="256,26 261,38 261,120 256,126 251,120 251,38" fill="url(#ridge)" opacity="0.85"/>
</svg>
