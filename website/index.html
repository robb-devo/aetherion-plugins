    <link rel="preload" as="font" type="font/woff2" href="/fonts/alegreya-sans-latin-400-normal.woff2" crossorigin />
    <link rel="preload" as="fetch" href="/world3d/isles.wasm" crossorigin />
    <script>
      // A returning or German visitor lands on their language before the first paint.
      (function () {
        try {
          var p = location.pathname, onDe = p === '/de' || p.indexOf('/de/') === 0, s = null
          try { s = localStorage.getItem('aetherion-lang') } catch (e) {}
          var want = s || ((navigator.language || '').toLowerCase().indexOf('de') === 0 ? 'de' : 'en')
          if (want === 'de' && !onDe && !/^\/(api|launcher)/.test(p)) location.replace('/de' + (p === '/' ? '/' : p) + location.search + location.hash)
          else if (want === 'en' && onDe && s) location.replace((p.slice(3) || '/') + location.search + location.hash)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script>
      (function () {
        var m = document.querySelector('meta[name="x-baked"]')
        if (m && m.getAttribute('content') !== (location.pathname.replace(/\/+$/, '') || '/')) document.getElementById('root').textContent = ''
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
