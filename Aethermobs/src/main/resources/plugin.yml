name: AetherMobs
version: 1.0.0
main: de.aetherion.aethermobs.AetherMobs
api-version: '1.21'
depend:
  - AetherionCore
  - AetherionItems
softdepend:
  - PlaceholderAPI
  - AetherionQuests

commands:

  pet:
    description: AetherMobs pet DEV/test command (spawns / spheres)
    usage: /pet <shiny|collection|sphere|beta>
    permission: aetherion.dev

  pets:
    description: Open your pet collection
    usage: /pets

  aetherlex:
    description: Open the Aetherlex pet encyclopedia
    usage: /aetherlex

permissions:
  aetherion.dev:
    description: DEV pet spawns and catch spheres via /pet
    default: op