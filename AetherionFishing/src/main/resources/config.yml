# Strike window after a bite. Fishing Speed stretches this a little.
strike-ticks: 70
# How long a lure fish may take to swim in and bite.
approach-ticks: 28

# Chance to yank a fishing-skill encounter mob on a successful catch.
# Scales mildly with Fish Catch up to encounter-chance-cap.
encounter-chance: 0.12
encounter-chance-cap: 0.18
# Seconds before an ignored encounter despawns.
encounter-despawn-seconds: 90

# ---------------------------------------------------------------------------
# Fishing Eldervale — the fishing destination (docs/FISHING_ELDERVALE.md)
# Coordinates match `/aetherpaste fishing` at -585 90 -649: schem local (x, y, z)
# lands at world (x - 800, y - 42, z - 864); the main lake surface is y 89.
# New keys are copied into live configs on boot; existing values are never changed.
# ---------------------------------------------------------------------------
fish-isle:
  enabled: true
  footprint:
    world: world
    min-x: -775
    max-x: -415
    min-z: -805
    max-z: -455
  # Plaza north of the Wishing Fountain. Point the hub pad / `/hubadmin set <id>` spawn here.
  landing: {world: world, x: -583.5, y: 90.0, z: -643.5, yaw: 180.0}
  lake-surface-y: 89

