# Silver Run / The Eldermaw, alternating, while anglers are on the isle.
lake-events:
  enabled: true
  first-delay-ticks: 6000
  interval-ticks: 21600
  eldermaw:
    # "x z radius" swim circles, checked clear of islets at y 84-88.
    circuits: ["-509.5 -577.5 14", "-592.5 -521.5 14"]
    swim-y: 85.4
