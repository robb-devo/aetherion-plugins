name: AetherionDungeons
version: 1.0.0
main: de.aetherion.dungeons.AetherionDungeons
api-version: 1.21
author: Aetherion
description: Temporary dungeon instances for Aetherion

depend:
  - AetherionCore

softdepend:
  - AetherionItems
  - BossEngine
  - AetherionQuests
  - WorldEdit

commands:
  dungeon:
    description: Leave a dungeon instance. Admin tools require aetherion.dungeon.admin.
    usage: /dungeon <leave|dhub>
    aliases: [dungeons, aedungeon]
  dhub:
    description: Teleport to the dungeon hub (does not clear inventory)
    usage: /dhub
    aliases: [dungeonhub, dh]

permissions:
  aetherion.dungeon.use:
    default: true
  aetherion.dungeon.admin:
    default: op
