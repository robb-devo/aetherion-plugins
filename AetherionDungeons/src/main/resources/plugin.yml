name: AetherionDungeons
version: 1.0.0
main: de.aetherion.dungeons.AetherionDungeons
api-version: 1.21
author: Aetherion
description: Temporary dungeon instances for Aetherion

depend:
  - AetherionCore

softdepend:
  - AetherionItems
  - BossEngine
  - AetherionQuests
  - WorldEdit

commands:
  dungeon:
    description: Leave a dungeon or return to the main world. Never clears inventory.
    usage: /dungeon <leave|return>
    aliases: [dungeons, aedungeon]
    permission: aetherion.dungeon.use
    permission-message: You cannot use dungeon commands.
  dhub:
    description: Admin teleport to the dungeon hub. Does not clear inventory.
    usage: /dhub
    aliases: [dungeonhub, dh]
    permission: aetherion.dungeon.admin
    permission-message: You cannot use that.

permissions:
  aetherion.dungeon.use:
    description: Leave a dungeon or return to the main world
    default: true
  aetherion.dungeon.admin:
    description: Dungeon admin tools (dhub, give, remove, enter, boss)
    default: op
    children:
      aetherion.dungeon.use: true
